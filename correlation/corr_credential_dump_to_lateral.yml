title: Credential Dump Followed by Lateral Movement
id: e3f4a5b6-c7d8-9012-6789-123456789012
status: experimental
description: Correlates a successful LSASS or NTDS credential dump event with subsequent remote service creation or PsExec-like activity within a short time window, indicating likely lateral movement after credential access.
correlation:
  type: temporal_ordered
  rules:
    - LSASS Memory Dump via Procdump or Similar Tools
    - NTDSUtil IFM Creation for Credential Dumping
    - PsExec or Similar Service Installation for Lateral Movement
  group-by:
    - Computer
    - User
  timespan: 30m
tags:
  - attack.credential-access
  - attack.lateral-movement
  - attack.t1003
  - attack.t1021.002
falsepositives:
  - Legitimate incident response activity where responders dump credentials and then use PsExec for remediation
level: critical
