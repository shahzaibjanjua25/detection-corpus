technique: T1543.002
name: "Create or Modify System Process: Systemd Service"
tactic: persistence
rules:
  - name: Linux Systemd Service Unit Created or Modified
    id: 2b8f5e03-7a4c-49d1-b3e6-1f9c8d2a5e74
    status: experimental
    coverage: partial
    notes: >
      Covers file writes to .service units under /etc/systemd/system/,
      /etc/systemd/user/, and ~/.config/systemd/user/ on hosts with a
      file_event pipeline (Falco, osquery, Wazuh, or auditd -w). Does not
      cover: (a) transient units created via `systemd-run` (no file write,
      needs a separate EXECVE rule), (b) drop-in .conf overrides under
      *.service.d/ (separate path pattern, not included to avoid FP flood),
      (c) systemd generators synthesizing units at boot, (d) SysV init
      scripts under /etc/init.d/ (T1037.004, separate rule), (e) hosts
      without any file-event pipeline (auditd-only fleets need the variant
      documented in the hypothesis). This is the first rule in the corpus
      to use `file_event` rather than `auditd` as its log source.
