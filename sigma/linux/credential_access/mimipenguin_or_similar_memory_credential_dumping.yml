title: Mimipenguin or Similar Memory Credential Dumping
id: d6e7f8a9-b0c1-2345-9012-456789012345
status: experimental
description: Detects execution of known open-source tools that dump cleartext credentials from process memory on Linux.
references:
  - https://attack.mitre.org/techniques/T1003/007/
  - https://github.com/huntergregal/mimipenguin
author: DetectionForge
date: 2024/07/01
modified: 2025/02/01
tags:
  - attack.credential-access
  - attack.t1003.007
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith:
      - '/mimipenguin'
      - '/mimipenguin.py'
      - '/laZagne'
    CommandLine|contains:
      - 'mimipenguin'
      - 'lazagne'
  condition: selection
falsepositives:
  - Security researchers testing credential dumping tools in lab environments
  - Red team exercises that intentionally run these utilities
level: high
