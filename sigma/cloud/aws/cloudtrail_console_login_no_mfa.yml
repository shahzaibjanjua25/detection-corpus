title: AWS Console Login Without MFA
id: c1d2e3f4-a5b6-7890-4567-901234567890
status: stable
description: Detects successful AWS Console logins that did not use multi-factor authentication.
references:
  - https://attack.mitre.org/techniques/T1078/004/
  - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-aws-console-sign-in-events.html
author: DetectionForge
date: 2024/09/01
modified: 2025/01/15
tags:
  - attack.initial-access
  - attack.t1078.004
logsource:
  category: cloudtrail
  product: aws
detection:
  selection:
    eventName: 'ConsoleLogin'
    responseElements.ConsoleLogin: 'Success'
  filter_mfa:
    additionalEventData.MFAUsed: 'Yes'
  condition: selection and not filter_mfa
falsepositives:
  - Break-glass emergency accounts intentionally configured without MFA
  - Service accounts used for automated console access (should be rare)
level: high
