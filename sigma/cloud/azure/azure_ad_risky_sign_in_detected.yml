title: Azure AD Risky Sign-in Detected
id: d2e3f4a5-b6c7-8901-5678-012345678901
status: stable
description: Detects Azure AD sign-in events flagged as risky by Identity Protection, which can indicate credential compromise or anomalous access.
references:
  - https://attack.mitre.org/techniques/T1078/004/
  - https://docs.microsoft.com/en-us/azure/active-directory/identity-protection/overview-identity-protection
author: DetectionForge
date: 2024/09/10
modified: 2025/02/01
tags:
  - attack.initial-access
  - attack.t1078.004
logsource:
  category: azure_activity
  product: azure
detection:
  selection:
    operationName: 'Sign-in activity'
    properties.riskState:
      - 'atRisk'
      - 'confirmedCompromised'
  condition: selection
falsepositives:
  - Users traveling or changing networks frequently (VPN, mobile)
  - Conditional Access policies that generate risk signals for legitimate reasons
level: high
