title: Control Panel Suspicious Activity Pattern 1516
id: e58911fe-9a6a-47c5-d2aa-dfd87c4e8f24
status: experimental
description: Detects process or registry activity patterns associated with Control Panel (T1218.002).
references:
  - https://attack.mitre.org/techniques/T1218/002/
author: DetectionForge
date: 2024/04/26
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'control'
      - 'bulk_pattern_1516'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving control panel
  - Security tools, monitoring agents, and authorized assessments
level: medium
