title: Suspicious Rundll32 Activity Indicator 009
id: 9986bcfe-0633-dad8-5208-2a114ccf4a16
status: experimental
description: Detects process or activity patterns associated with Rundll32 (T1218.011).
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: DetectionForge
date: 2024/05/03
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rundll32'
      - 'suspicious_pattern_9'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving rundll32
  - Security tools and monitoring agents performing similar actions
level: medium
