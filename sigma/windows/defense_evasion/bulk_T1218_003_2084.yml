title: CMSTP Suspicious Activity Pattern 2084
id: 9b495f51-5156-4e71-dd46-398140468a8c
status: experimental
description: Detects process or registry activity patterns associated with CMSTP (T1218.003).
references:
  - https://attack.mitre.org/techniques/T1218/003/
author: DetectionForge
date: 2025/11/15
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmstp'
      - 'bulk_pattern_2084'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving cmstp
  - Security tools, monitoring agents, and authorized assessments
level: medium
