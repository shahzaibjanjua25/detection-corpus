title: ClearLogs Pattern 5107
id: 29e476a3-43d1-4893-a550-6169d0c16c73
status: experimental
description: Detects patterns associated with ClearLogs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2024/06/16
modified: 2025/08/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clearlogs'
      - 'x_5107'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for clearlogs
  - Security and monitoring tools
level: medium
