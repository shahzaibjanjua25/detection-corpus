title: Suspicious Mshta Activity Indicator 070
id: e5e33394-00c5-d19a-9866-ea379f2a97a8
status: experimental
description: Detects process or activity patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2024/07/03
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'suspicious_pattern_70'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving mshta
  - Security tools and monitoring agents performing similar actions
level: medium
