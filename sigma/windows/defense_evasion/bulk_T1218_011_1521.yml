title: Rundll32 Suspicious Activity Pattern 1521
id: e8baa304-b4ee-4c15-dab0-459b5e0e3c48
status: experimental
description: Detects process or registry activity patterns associated with Rundll32 (T1218.011).
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: DetectionForge
date: 2024/05/01
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rundll32'
      - 'bulk_pattern_1521'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving rundll32
  - Security tools, monitoring agents, and authorized assessments
level: medium
