title: Process Injection Suspicious Activity Pattern 1099
id: 5cd3cf48-b468-4d35-fc2a-e10f75c52d36
status: experimental
description: Detects process or registry activity patterns associated with Process Injection (T1055).
references:
  - https://attack.mitre.org/techniques/T1055/
author: DetectionForge
date: 2025/02/03
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'bulk_pattern_1099'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving process injection
  - Security tools, monitoring agents, and authorized assessments
level: medium
