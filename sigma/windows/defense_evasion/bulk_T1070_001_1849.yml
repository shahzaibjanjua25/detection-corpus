title: Clear Windows Event Logs Suspicious Activity Pattern 1849
id: eca3ea3e-b487-4058-9a89-ce8cf1e1f358
status: experimental
description: Detects process or registry activity patterns associated with Clear Windows Event Logs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2025/03/25
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clear'
      - 'bulk_pattern_1849'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clear windows event logs
  - Security tools, monitoring agents, and authorized assessments
level: medium
