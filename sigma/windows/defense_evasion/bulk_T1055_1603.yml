title: Process Injection Suspicious Activity Pattern 1603
id: 9c6e4a07-3ae9-4def-b60a-6943a43587c9
status: experimental
description: Detects process or registry activity patterns associated with Process Injection (T1055).
references:
  - https://attack.mitre.org/techniques/T1055/
author: DetectionForge
date: 2024/07/22
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'bulk_pattern_1603'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving process injection
  - Security tools, monitoring agents, and authorized assessments
level: medium
