title: Suspicious Rename System Utilities Activity Indicator 155
id: fa8b928d-9654-e22f-1267-e488599e8e6e
status: experimental
description: Detects process or activity patterns associated with Rename System Utilities (T1036.003).
references:
  - https://attack.mitre.org/techniques/T1036/003/
author: DetectionForge
date: 2024/09/26
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rename'
      - 'suspicious_pattern_155'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving rename system utilities
  - Security tools and monitoring agents performing similar actions
level: medium
