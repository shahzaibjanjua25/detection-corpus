title: Suspicious File Deletion Activity Indicator 149
id: 976c6ead-7c8d-c93e-0fdd-56a516d65465
status: experimental
description: Detects process or activity patterns associated with File Deletion (T1070.004).
references:
  - https://attack.mitre.org/techniques/T1070/004/
author: DetectionForge
date: 2024/09/20
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'file'
      - 'suspicious_pattern_149'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving file deletion
  - Security tools and monitoring agents performing similar actions
level: medium
