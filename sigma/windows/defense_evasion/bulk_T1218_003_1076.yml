title: CMSTP Suspicious Activity Pattern 1076
id: 75dd97b7-b7d3-4d0d-e806-818f420b8ec0
status: experimental
description: Detects process or registry activity patterns associated with CMSTP (T1218.003).
references:
  - https://attack.mitre.org/techniques/T1218/003/
author: DetectionForge
date: 2025/01/11
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmstp'
      - 'bulk_pattern_1076'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving cmstp
  - Security tools, monitoring agents, and authorized assessments
level: medium
