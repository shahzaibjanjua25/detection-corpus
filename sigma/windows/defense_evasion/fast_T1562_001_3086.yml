title: DisableDefender Activity Indicator 3086
id: f0cb9c5f-e5b2-421b-aaba-78fa7c1ac572
status: experimental
description: Detects activity patterns associated with DisableDefender (T1562.001).
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: DetectionForge
date: 2024/04/27
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'disabledefender'
      - 'fast_3086'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving disabledefender
  - Security tools and monitoring agents
level: medium
