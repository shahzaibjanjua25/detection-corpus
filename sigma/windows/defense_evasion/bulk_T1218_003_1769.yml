title: CMSTP Suspicious Activity Pattern 1769
id: 0d1fea0d-810a-4035-3e51-8cdb0e8a2978
status: experimental
description: Detects process or registry activity patterns associated with CMSTP (T1218.003).
references:
  - https://attack.mitre.org/techniques/T1218/003/
author: DetectionForge
date: 2025/01/04
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmstp'
      - 'bulk_pattern_1769'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving cmstp
  - Security tools, monitoring agents, and authorized assessments
level: medium
