title: Suspicious CMSTP Activity Indicator 005
id: 4eb56dd1-45b2-225f-fc72-9d1fb866d577
status: experimental
description: Detects process or activity patterns associated with CMSTP (T1218.003).
references:
  - https://attack.mitre.org/techniques/T1218/003/
author: DetectionForge
date: 2024/04/29
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmstp'
      - 'suspicious_pattern_5'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving cmstp
  - Security tools and monitoring agents performing similar actions
level: medium
