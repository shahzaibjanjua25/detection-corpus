title: Suspicious Hidden Files and Directories Activity Indicator 026
id: ad63d269-f9ee-8a23-0950-218db40a098f
status: experimental
description: Detects process or activity patterns associated with Hidden Files and Directories (T1564.001).
references:
  - https://attack.mitre.org/techniques/T1564/001/
author: DetectionForge
date: 2024/05/20
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1564.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'hidden'
      - 'suspicious_pattern_26'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving hidden files and directories
  - Security tools and monitoring agents performing similar actions
level: medium
