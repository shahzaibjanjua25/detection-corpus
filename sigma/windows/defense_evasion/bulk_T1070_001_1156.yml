title: Clear Windows Event Logs Suspicious Activity Pattern 1156
id: 08758635-5e94-4076-a2c9-ae457c1a2a65
status: experimental
description: Detects process or registry activity patterns associated with Clear Windows Event Logs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2025/04/01
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clear'
      - 'bulk_pattern_1156'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clear windows event logs
  - Security tools, monitoring agents, and authorized assessments
level: medium
