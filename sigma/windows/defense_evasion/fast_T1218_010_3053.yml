title: Regsvr32 Activity Indicator 3053
id: 09e9bb57-600b-4fc0-a08c-946a481266db
status: experimental
description: Detects activity patterns associated with Regsvr32 (T1218.010).
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: DetectionForge
date: 2024/03/25
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'regsvr32'
      - 'fast_3053'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving regsvr32
  - Security tools and monitoring agents
level: medium
