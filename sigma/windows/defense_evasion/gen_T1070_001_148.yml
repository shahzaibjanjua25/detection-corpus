title: Suspicious Clear Windows Event Logs Activity Indicator 148
id: f52c8f4b-c4ff-5d38-dad1-73eaf2c401b6
status: experimental
description: Detects process or activity patterns associated with Clear Windows Event Logs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2024/09/19
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clear'
      - 'suspicious_pattern_148'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving clear windows event logs
  - Security tools and monitoring agents performing similar actions
level: medium
