title: Suspicious Timestomp Activity Indicator 213
id: d8eb7fed-8e73-5af9-1cd4-75a0278d2e3a
status: experimental
description: Detects process or activity patterns associated with Timestomp (T1070.006).
references:
  - https://attack.mitre.org/techniques/T1070/006/
author: DetectionForge
date: 2024/11/23
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1070.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'timestomp'
      - 'suspicious_pattern_213'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving timestomp
  - Security tools and monitoring agents performing similar actions
level: medium
