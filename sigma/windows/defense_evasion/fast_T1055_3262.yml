title: Injection Activity Indicator 3262
id: 3edd6275-e213-4106-a08e-16e66389d7b7
status: experimental
description: Detects activity patterns associated with Injection (T1055).
references:
  - https://attack.mitre.org/techniques/T1055/
author: DetectionForge
date: 2024/10/20
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'injection'
      - 'fast_3262'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving injection
  - Security tools and monitoring agents
level: medium
