title: Mshta Activity Indicator 3202
id: 70145ddb-5964-4afa-abab-37d6f0afc492
status: experimental
description: Detects activity patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2024/08/21
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'fast_3202'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving mshta
  - Security tools and monitoring agents
level: medium
