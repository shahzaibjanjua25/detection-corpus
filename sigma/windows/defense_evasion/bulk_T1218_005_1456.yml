title: Mshta Suspicious Activity Pattern 1456
id: d1124edc-1fec-4fe2-c67f-7580dfd7ad0c
status: experimental
description: Detects process or registry activity patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2024/02/26
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'bulk_pattern_1456'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving mshta
  - Security tools, monitoring agents, and authorized assessments
level: medium
