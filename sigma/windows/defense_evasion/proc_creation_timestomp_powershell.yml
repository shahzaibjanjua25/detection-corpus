title: PowerShell Timestomp
id: dec9bc03-19de-16e6-f7a4-3b7e1bbb0213
status: stable
description: Detects PowerShell modifying file timestamps
references:
  - https://attack.mitre.org/techniques/T1070/006/
author: DetectionForge
date: 2024/02/15
modified: 2025/03/01
tags:
  - attack.defense-evasion
  - attack.t1070.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '.CreationTime'
      - '.LastWriteTime'
      - '$(Get-Date)'
  condition: selection
falsepositives:
  - Build systems normalizing timestamps
  - Backup restore processes
level: medium
