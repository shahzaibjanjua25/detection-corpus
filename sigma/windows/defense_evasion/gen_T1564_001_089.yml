title: Suspicious Hidden Files and Directories Activity Indicator 089
id: 04f21256-1844-5a24-4bee-09df74d0101a
status: experimental
description: Detects process or activity patterns associated with Hidden Files and Directories (T1564.001).
references:
  - https://attack.mitre.org/techniques/T1564/001/
author: DetectionForge
date: 2024/07/22
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1564.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'hidden'
      - 'suspicious_pattern_89'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving hidden files and directories
  - Security tools and monitoring agents performing similar actions
level: medium
