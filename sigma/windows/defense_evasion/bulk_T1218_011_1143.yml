title: Rundll32 Suspicious Activity Pattern 1143
id: 12d77408-468b-4c42-9e73-f6cd60a71700
status: experimental
description: Detects process or registry activity patterns associated with Rundll32 (T1218.011).
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: DetectionForge
date: 2025/03/19
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rundll32'
      - 'bulk_pattern_1143'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving rundll32
  - Security tools, monitoring agents, and authorized assessments
level: medium
