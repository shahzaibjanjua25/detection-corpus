title: Suspicious Obfuscated Files or Information Activity Indicator 216
id: 2894474f-5136-ee60-c7be-5fe7f8c484ec
status: experimental
description: Detects process or activity patterns associated with Obfuscated Files or Information (T1027).
references:
  - https://attack.mitre.org/techniques/T1027/
author: DetectionForge
date: 2024/11/26
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'obfuscated'
      - 'suspicious_pattern_216'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving obfuscated files or information
  - Security tools and monitoring agents performing similar actions
level: medium
