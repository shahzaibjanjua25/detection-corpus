title: Attrib Hide or System Flag
id: f2398ae8-66d4-fcbc-5736-9cd1cd2dfd39
status: stable
description: Detects attrib.exe used to hide files or set system attribute
references:
  - https://attack.mitre.org/techniques/T1564/001/
author: DetectionForge
date: 2024/02/16
modified: 2025/03/01
tags:
  - attack.defense-evasion
  - attack.t1564.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\attrib.exe'
    CommandLine|contains:
      - '+h'
      - '+s'
      - '+r'
  condition: selection
falsepositives:
  - Legitimate system file protection
  - Software installers
level: medium
