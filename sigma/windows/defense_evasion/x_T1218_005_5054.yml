title: Mshta Pattern 5054
id: 40b3e1c8-e414-46b9-a215-107d4303b2ab
status: experimental
description: Detects patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2024/04/24
modified: 2025/08/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'x_5054'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for mshta
  - Security and monitoring tools
level: medium
