title: Rundll32 Activity Indicator 3129
id: 67b56549-5769-4e97-ade6-767f8fb4e892
status: experimental
description: Detects activity patterns associated with Rundll32 (T1218.011).
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: DetectionForge
date: 2024/06/09
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rundll32'
      - 'fast_3129'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving rundll32
  - Security tools and monitoring agents
level: medium
