title: Suspicious Control Panel Activity Indicator 067
id: 22634370-9605-fdab-902f-9905e1649c34
status: experimental
description: Detects process or activity patterns associated with Control Panel (T1218.002).
references:
  - https://attack.mitre.org/techniques/T1218/002/
author: DetectionForge
date: 2024/06/30
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'control'
      - 'suspicious_pattern_67'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving control panel
  - Security tools and monitoring agents performing similar actions
level: medium
