title: Mshta Activity Indicator 3177
id: b67af4a7-6d3b-4dc0-a1c2-5aaeb1ee6fd1
status: experimental
description: Detects activity patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2024/07/27
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'fast_3177'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving mshta
  - Security tools and monitoring agents
level: medium
