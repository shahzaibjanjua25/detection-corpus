title: Clear Windows Event Logs Suspicious Activity Pattern 1093
id: 285d4f5d-ab05-4f50-68fd-2bd27fd13abb
status: experimental
description: Detects process or registry activity patterns associated with Clear Windows Event Logs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2025/01/28
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clear'
      - 'bulk_pattern_1093'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clear windows event logs
  - Security tools, monitoring agents, and authorized assessments
level: medium
