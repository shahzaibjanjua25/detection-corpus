title: Suspicious Rundll32 Activity Indicator 198
id: 982bc4fe-a894-58e7-e3df-d7e6671f908f
status: experimental
description: Detects process or activity patterns associated with Rundll32 (T1218.011).
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: DetectionForge
date: 2024/11/08
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rundll32'
      - 'suspicious_pattern_198'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving rundll32
  - Security tools and monitoring agents performing similar actions
level: medium
