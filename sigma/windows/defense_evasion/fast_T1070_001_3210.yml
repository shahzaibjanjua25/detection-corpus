title: ClearLogs Activity Indicator 3210
id: 9c4ffc23-f2bf-425d-aef6-0e593274a21c
status: experimental
description: Detects activity patterns associated with ClearLogs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2024/08/29
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clearlogs'
      - 'fast_3210'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clearlogs
  - Security tools and monitoring agents
level: medium
