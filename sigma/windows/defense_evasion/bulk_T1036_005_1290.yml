title: Match Legitimate Name or Location Suspicious Activity Pattern 1290
id: 909d2b62-4b0f-445e-854c-9bd7448cdfe3
status: experimental
description: Detects process or registry activity patterns associated with Match Legitimate Name or Location (T1036.005).
references:
  - https://attack.mitre.org/techniques/T1036/005/
author: DetectionForge
date: 2025/08/13
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'match'
      - 'bulk_pattern_1290'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving match legitimate name or location
  - Security tools, monitoring agents, and authorized assessments
level: medium
