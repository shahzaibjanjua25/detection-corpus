title: Rename System Utilities Suspicious Activity Pattern 1037
id: 3fd052a1-79aa-4247-43bd-ca728d06a2d0
status: experimental
description: Detects process or registry activity patterns associated with Rename System Utilities (T1036.003).
references:
  - https://attack.mitre.org/techniques/T1036/003/
author: DetectionForge
date: 2024/12/03
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rename'
      - 'bulk_pattern_1037'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving rename system utilities
  - Security tools, monitoring agents, and authorized assessments
level: medium
