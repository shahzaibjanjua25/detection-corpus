title: Suspicious Clear Windows Event Logs Activity Indicator 022
id: 3c2c8704-a38c-ea59-5bc6-578cc960bd52
status: experimental
description: Detects process or activity patterns associated with Clear Windows Event Logs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2024/05/16
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clear'
      - 'suspicious_pattern_22'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving clear windows event logs
  - Security tools and monitoring agents performing similar actions
level: medium
