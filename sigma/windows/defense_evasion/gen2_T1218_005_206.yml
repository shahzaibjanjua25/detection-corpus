title: Detection Pattern for Mshta Activity 206
id: 501b8280-fe7f-d89c-0147-c4051f6872eb
status: experimental
description: Detects activity patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2024/12/24
modified: 2025/05/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'pattern_206'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate software and administrative tools using similar command patterns
  - Security products and monitoring agents
level: medium
