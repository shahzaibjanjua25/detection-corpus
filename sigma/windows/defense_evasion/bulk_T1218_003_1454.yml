title: CMSTP Suspicious Activity Pattern 1454
id: 4b142521-7eed-4f37-84a7-afdd4550cd2b
status: experimental
description: Detects process or registry activity patterns associated with CMSTP (T1218.003).
references:
  - https://attack.mitre.org/techniques/T1218/003/
author: DetectionForge
date: 2024/02/24
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmstp'
      - 'bulk_pattern_1454'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving cmstp
  - Security tools, monitoring agents, and authorized assessments
level: medium
