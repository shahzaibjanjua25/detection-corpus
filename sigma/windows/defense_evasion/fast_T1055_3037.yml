title: Injection Activity Indicator 3037
id: 2191606b-da7b-433b-a471-647d6f1a9a81
status: experimental
description: Detects activity patterns associated with Injection (T1055).
references:
  - https://attack.mitre.org/techniques/T1055/
author: DetectionForge
date: 2024/03/09
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'injection'
      - 'fast_3037'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving injection
  - Security tools and monitoring agents
level: medium
