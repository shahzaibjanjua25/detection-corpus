title: InstallUtil Suspicious Activity Pattern 2085
id: 13e052dd-5ad3-4dcb-b29b-450ca5f00e24
status: experimental
description: Detects process or registry activity patterns associated with InstallUtil (T1218.004).
references:
  - https://attack.mitre.org/techniques/T1218/004/
author: DetectionForge
date: 2025/11/16
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'installutil'
      - 'bulk_pattern_2085'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving installutil
  - Security tools, monitoring agents, and authorized assessments
level: medium
