title: Suspicious Match Legitimate Name or Location Activity Indicator 156
id: 266405ce-b7de-c141-cb70-f9f6f4fe810a
status: experimental
description: Detects process or activity patterns associated with Match Legitimate Name or Location (T1036.005).
references:
  - https://attack.mitre.org/techniques/T1036/005/
author: DetectionForge
date: 2024/09/27
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'match'
      - 'suspicious_pattern_156'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving match legitimate name or location
  - Security tools and monitoring agents performing similar actions
level: medium
