title: Ntdll Unhooking Indicators
id: e67702ba-db29-e34f-000a-967af4c9a676
status: stable
description: Detects attempts to unhook or remap ntdll
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: DetectionForge
date: 2024/02/18
modified: 2025/03/01
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ntdll.dll'
      - 'unhook'
      - 're-map'
      - 'knowndlls'
  condition: selection
falsepositives:
  - Some security products
  - Advanced debugging
level: medium
