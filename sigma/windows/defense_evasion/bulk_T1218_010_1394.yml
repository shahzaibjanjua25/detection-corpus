title: Regsvr32 Suspicious Activity Pattern 1394
id: 9a3257ea-e490-4b65-0c32-01c9c83dbae6
status: experimental
description: Detects process or registry activity patterns associated with Regsvr32 (T1218.010).
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: DetectionForge
date: 2025/11/25
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'regsvr32'
      - 'bulk_pattern_1394'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving regsvr32
  - Security tools, monitoring agents, and authorized assessments
level: medium
