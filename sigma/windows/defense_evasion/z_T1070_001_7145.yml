title: ClearLogs Indicator 7145
id: 25991933-4e31-478b-a1ae-8a3c3a0845f8
status: experimental
description: Detects patterns associated with ClearLogs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2025/03/12
modified: 2025/09/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clearlogs'
      - 'z_7145'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for clearlogs
  - Security and monitoring tools
level: medium
