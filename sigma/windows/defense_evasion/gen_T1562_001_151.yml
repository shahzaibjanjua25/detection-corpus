title: Suspicious Disable or Modify Tools Activity Indicator 151
id: 5a885fea-7029-a38f-8f39-c02c9f18f441
status: experimental
description: Detects process or activity patterns associated with Disable or Modify Tools (T1562.001).
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: DetectionForge
date: 2024/09/22
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'disable'
      - 'suspicious_pattern_151'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving disable or modify tools
  - Security tools and monitoring agents performing similar actions
level: medium
