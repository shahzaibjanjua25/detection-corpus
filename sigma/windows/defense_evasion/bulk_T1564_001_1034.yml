title: Hidden Files and Directories Suspicious Activity Pattern 1034
id: a7f3dc10-f11b-4620-db34-1924c68ee209
status: experimental
description: Detects process or registry activity patterns associated with Hidden Files and Directories (T1564.001).
references:
  - https://attack.mitre.org/techniques/T1564/001/
author: DetectionForge
date: 2024/11/30
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1564.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'hidden'
      - 'bulk_pattern_1034'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving hidden files and directories
  - Security tools, monitoring agents, and authorized assessments
level: medium
