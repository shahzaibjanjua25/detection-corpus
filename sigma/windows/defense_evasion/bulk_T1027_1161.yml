title: Obfuscated Files or Information Suspicious Activity Pattern 1161
id: a53155d0-dd53-4b50-39a0-59a5a0561d7a
status: experimental
description: Detects process or registry activity patterns associated with Obfuscated Files or Information (T1027).
references:
  - https://attack.mitre.org/techniques/T1027/
author: DetectionForge
date: 2025/04/06
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'obfuscated'
      - 'bulk_pattern_1161'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving obfuscated files or information
  - Security tools, monitoring agents, and authorized assessments
level: medium
