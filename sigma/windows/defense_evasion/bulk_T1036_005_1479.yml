title: Match Legitimate Name or Location Suspicious Activity Pattern 1479
id: 8b061f75-7d73-4deb-df05-c1c06aac149f
status: experimental
description: Detects process or registry activity patterns associated with Match Legitimate Name or Location (T1036.005).
references:
  - https://attack.mitre.org/techniques/T1036/005/
author: DetectionForge
date: 2024/03/20
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'match'
      - 'bulk_pattern_1479'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving match legitimate name or location
  - Security tools, monitoring agents, and authorized assessments
level: medium
