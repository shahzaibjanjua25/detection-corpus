title: Rename System Utilities Suspicious Activity Pattern 2045
id: 73e92743-4059-422c-0ad5-2cedcbba3d49
status: experimental
description: Detects process or registry activity patterns associated with Rename System Utilities (T1036.003).
references:
  - https://attack.mitre.org/techniques/T1036/003/
author: DetectionForge
date: 2025/10/07
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rename'
      - 'bulk_pattern_2045'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving rename system utilities
  - Security tools, monitoring agents, and authorized assessments
level: medium
