title: ClearLogs Indicator 7125
id: e3adca4c-5d1b-40da-ac9a-a54478c1cb6a
status: experimental
description: Detects patterns associated with ClearLogs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2025/02/20
modified: 2025/09/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clearlogs'
      - 'z_7125'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for clearlogs
  - Security and monitoring tools
level: medium
