title: Mshta Indicator 7182
id: a133f06f-24ea-4241-a597-81521f143b57
status: experimental
description: Detects patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2025/04/18
modified: 2025/09/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'z_7182'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for mshta
  - Security and monitoring tools
level: medium
