title: InstallUtil Suspicious Activity Pattern 1896
id: 8bbf39d7-8a23-472c-4ec7-5dc4d2cd3f85
status: experimental
description: Detects process or registry activity patterns associated with InstallUtil (T1218.004).
references:
  - https://attack.mitre.org/techniques/T1218/004/
author: DetectionForge
date: 2025/05/11
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'installutil'
      - 'bulk_pattern_1896'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving installutil
  - Security tools, monitoring agents, and authorized assessments
level: medium
