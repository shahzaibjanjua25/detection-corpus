title: ClearLogs Activity Indicator 3235
id: 1e35d33f-acba-466e-a4a7-3cd41166667c
status: experimental
description: Detects activity patterns associated with ClearLogs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2024/09/23
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clearlogs'
      - 'fast_3235'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clearlogs
  - Security tools and monitoring agents
level: medium
