title: InstallUtil Suspicious Activity Pattern 1518
id: cb1dd87d-9683-4285-29af-65ede850b5e4
status: experimental
description: Detects process or registry activity patterns associated with InstallUtil (T1218.004).
references:
  - https://attack.mitre.org/techniques/T1218/004/
author: DetectionForge
date: 2024/04/28
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'installutil'
      - 'bulk_pattern_1518'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving installutil
  - Security tools, monitoring agents, and authorized assessments
level: medium
