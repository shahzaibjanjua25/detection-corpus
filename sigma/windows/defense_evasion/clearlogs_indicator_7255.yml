title: ClearLogs Indicator 7255
id: 1f7cd991-2621-4b69-a9fb-f47e3197aa8a
status: experimental
description: Detects patterns associated with ClearLogs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2024/05/26
modified: 2025/09/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clearlogs'
      - 'z_7255'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for clearlogs
  - Security and monitoring tools
level: medium
