title: Attempts to Disable Windows Defender
id: b52f7f8c-064e-56d2-f95e-7ad3c2840e20
status: stable
description: Detects command lines attempting to disable or exclude from Defender
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: DetectionForge
date: 2024/02/19
modified: 2025/03/01
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'Set-MpPreference'
      - 'DisableRealtimeMonitoring'
      - 'Add-MpPreference'
      - '-ExclusionPath'
  condition: selection
falsepositives:
  - Administrators tuning Defender
  - Security product installers
level: medium
