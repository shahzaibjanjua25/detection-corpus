title: Injection Activity Indicator 3062
id: dfcd9cd4-5486-4d7f-a74a-32392a368214
status: experimental
description: Detects activity patterns associated with Injection (T1055).
references:
  - https://attack.mitre.org/techniques/T1055/
author: DetectionForge
date: 2024/04/03
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'injection'
      - 'fast_3062'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving injection
  - Security tools and monitoring agents
level: medium
