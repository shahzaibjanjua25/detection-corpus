title: Disable or Modify Tools Suspicious Activity Pattern 1600
id: db3b1db3-6c7b-4e8a-3d58-4d94eaf59e92
status: experimental
description: Detects process or registry activity patterns associated with Disable or Modify Tools (T1562.001).
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: DetectionForge
date: 2024/07/19
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'disable'
      - 'bulk_pattern_1600'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving disable or modify tools
  - Security tools, monitoring agents, and authorized assessments
level: medium
