title: Suspicious CMSTP Activity Indicator 068
id: 7cb78c4a-6a6d-a774-5b9f-7b3370f72946
status: experimental
description: Detects process or activity patterns associated with CMSTP (T1218.003).
references:
  - https://attack.mitre.org/techniques/T1218/003/
author: DetectionForge
date: 2024/07/01
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmstp'
      - 'suspicious_pattern_68'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving cmstp
  - Security tools and monitoring agents performing similar actions
level: medium
