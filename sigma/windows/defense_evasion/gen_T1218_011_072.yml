title: Suspicious Rundll32 Activity Indicator 072
id: ca020bf5-a47e-67a9-1bdb-fd6e479bf8aa
status: experimental
description: Detects process or activity patterns associated with Rundll32 (T1218.011).
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: DetectionForge
date: 2024/07/05
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rundll32'
      - 'suspicious_pattern_72'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving rundll32
  - Security tools and monitoring agents performing similar actions
level: medium
