title: Obfuscated Files or Information Suspicious Activity Pattern 2106
id: f44bc64d-078e-4f7f-8e51-6341c7d8b5ab
status: experimental
description: Detects process or registry activity patterns associated with Obfuscated Files or Information (T1027).
references:
  - https://attack.mitre.org/techniques/T1027/
author: DetectionForge
date: 2024/01/07
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'obfuscated'
      - 'bulk_pattern_2106'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving obfuscated files or information
  - Security tools, monitoring agents, and authorized assessments
level: medium
