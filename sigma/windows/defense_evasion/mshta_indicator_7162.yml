title: Mshta Indicator 7162
id: 2cb53f5c-2b97-45e0-ae4a-e625fa25d359
status: experimental
description: Detects patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2025/03/29
modified: 2025/09/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'z_7162'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for mshta
  - Security and monitoring tools
level: medium
