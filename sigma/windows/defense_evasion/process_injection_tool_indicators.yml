title: Process Injection Tool Indicators
id: 3e51dc0d-7e5b-a74d-434a-7d0f0fb54667
status: stable
description: Detects command lines of common process injection frameworks
references:
  - https://attack.mitre.org/techniques/T1055/
author: DetectionForge
date: 2024/02/17
modified: 2025/03/01
tags:
  - attack.defense-evasion
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'CreateRemoteThread'
      - 'NtCreateThreadEx'
      - 'QueueUserAPC'
      - 'ProcessHollowing'
  condition: selection
falsepositives:
  - Debuggers and development tools
  - Authorized security testing
level: medium
