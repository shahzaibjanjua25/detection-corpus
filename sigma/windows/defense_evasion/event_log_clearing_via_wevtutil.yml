title: Event Log Clearing via Wevtutil
id: 345b7796-2299-87e6-5f2e-d7a20cca67ea
status: stable
description: Detects wevtutil or similar tools clearing Windows event logs
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2024/02/13
modified: 2025/03/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\wevtutil.exe'
      - '\wmic.exe'
    CommandLine|contains:
      - 'clear-log'
      - 'cl'
      - 'ClearEventLog'
  condition: selection
falsepositives:
  - Legitimate log rotation by administrators
  - SIEM agents performing maintenance
level: medium
