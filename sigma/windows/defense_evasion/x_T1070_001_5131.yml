title: ClearLogs Pattern 5131
id: e88ef249-8c0c-45b0-a151-3f9b686375f9
status: experimental
description: Detects patterns associated with ClearLogs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2024/07/10
modified: 2025/08/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clearlogs'
      - 'x_5131'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for clearlogs
  - Security and monitoring tools
level: medium
