title: Timestomp Suspicious Activity Pattern 1347
id: 9bee6cb1-6c95-4d86-afab-eb8e3c2c888d
status: experimental
description: Detects process or registry activity patterns associated with Timestomp (T1070.006).
references:
  - https://attack.mitre.org/techniques/T1070/006/
author: DetectionForge
date: 2025/10/09
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1070.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'timestomp'
      - 'bulk_pattern_1347'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving timestomp
  - Security tools, monitoring agents, and authorized assessments
level: medium
