title: DisableDefender Activity Indicator 3061
id: 94fd7dd9-4768-45a9-a249-1c1b1725fd27
status: experimental
description: Detects activity patterns associated with DisableDefender (T1562.001).
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: DetectionForge
date: 2024/04/02
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'disabledefender'
      - 'fast_3061'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving disabledefender
  - Security tools and monitoring agents
level: medium
