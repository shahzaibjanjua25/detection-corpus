title: Regsvr32 Suspicious Activity Pattern 2087
id: 5f13f485-d282-415e-52e9-71b84e246af8
status: experimental
description: Detects process or registry activity patterns associated with Regsvr32 (T1218.010).
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: DetectionForge
date: 2025/11/18
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'regsvr32'
      - 'bulk_pattern_2087'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving regsvr32
  - Security tools, monitoring agents, and authorized assessments
level: medium
