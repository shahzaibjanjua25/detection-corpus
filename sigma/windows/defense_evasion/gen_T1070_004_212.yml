title: Suspicious File Deletion Activity Indicator 212
id: cf86a6f3-2c4a-71d6-e2df-4540b27c60cf
status: experimental
description: Detects process or activity patterns associated with File Deletion (T1070.004).
references:
  - https://attack.mitre.org/techniques/T1070/004/
author: DetectionForge
date: 2024/11/22
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'file'
      - 'suspicious_pattern_212'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving file deletion
  - Security tools and monitoring agents performing similar actions
level: medium
