title: Clear Windows Event Logs Suspicious Activity Pattern 1723
id: a30367cc-c5e3-4f50-8df2-3ffaa982c801
status: experimental
description: Detects process or registry activity patterns associated with Clear Windows Event Logs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2024/11/19
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clear'
      - 'bulk_pattern_1723'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clear windows event logs
  - Security tools, monitoring agents, and authorized assessments
level: medium
