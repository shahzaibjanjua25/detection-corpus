title: Suspicious Timestomp Activity Indicator 150
id: 4b711c8a-9cd9-6946-297f-33fdce5a086b
status: experimental
description: Detects process or activity patterns associated with Timestomp (T1070.006).
references:
  - https://attack.mitre.org/techniques/T1070/006/
author: DetectionForge
date: 2024/09/21
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1070.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'timestomp'
      - 'suspicious_pattern_150'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving timestomp
  - Security tools and monitoring agents performing similar actions
level: medium
