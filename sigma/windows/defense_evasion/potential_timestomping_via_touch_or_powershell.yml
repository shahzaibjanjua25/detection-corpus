title: Potential Timestomping via Touch or PowerShell
id: a3b4c5d6-e7f8-9012-6789-123456789012
status: test
description: Detects command lines associated with timestomping techniques that alter file creation or modification times to evade forensic analysis.
references:
  - https://attack.mitre.org/techniques/T1070/006/
author: DetectionForge
date: 2024/05/15
modified: 2025/01/22
tags:
  - attack.defense-evasion
  - attack.t1070.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_powershell:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - '.CreationTime ='
      - '.LastWriteTime ='
      - '.LastAccessTime ='
  selection_touch:
    Image|endswith: '\touch.exe'
    CommandLine|contains: '-t'
  condition: selection_powershell or selection_touch
falsepositives:
  - Build systems or packaging scripts that intentionally normalize timestamps
  - Forensic or backup tools that adjust timestamps during restoration
level: medium
