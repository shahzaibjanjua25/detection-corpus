title: Suspicious InstallUtil Activity Indicator 069
id: ae80d7eb-20e9-e43e-8488-59ef6486cda4
status: experimental
description: Detects process or activity patterns associated with InstallUtil (T1218.004).
references:
  - https://attack.mitre.org/techniques/T1218/004/
author: DetectionForge
date: 2024/07/02
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'installutil'
      - 'suspicious_pattern_69'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving installutil
  - Security tools and monitoring agents performing similar actions
level: medium
