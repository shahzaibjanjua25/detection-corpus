title: Suspicious Process Injection Activity Indicator 217
id: 4dc270fb-961b-bce5-fa90-603b9f18b339
status: experimental
description: Detects process or activity patterns associated with Process Injection (T1055).
references:
  - https://attack.mitre.org/techniques/T1055/
author: DetectionForge
date: 2024/11/27
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'suspicious_pattern_217'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving process injection
  - Security tools and monitoring agents performing similar actions
level: medium
