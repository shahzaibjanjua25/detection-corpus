title: Suspicious Process Injection Activity Indicator 028
id: 7ebf3c85-e1c2-b7b9-d433-78fe4afc2f54
status: experimental
description: Detects process or activity patterns associated with Process Injection (T1055).
references:
  - https://attack.mitre.org/techniques/T1055/
author: DetectionForge
date: 2024/05/22
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'suspicious_pattern_28'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving process injection
  - Security tools and monitoring agents performing similar actions
level: medium
