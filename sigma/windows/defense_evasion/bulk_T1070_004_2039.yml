title: File Deletion Suspicious Activity Pattern 2039
id: 634e6a85-452d-4e79-058f-2ec96e53b6d6
status: experimental
description: Detects process or registry activity patterns associated with File Deletion (T1070.004).
references:
  - https://attack.mitre.org/techniques/T1070/004/
author: DetectionForge
date: 2025/10/01
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'file'
      - 'bulk_pattern_2039'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving file deletion
  - Security tools, monitoring agents, and authorized assessments
level: medium
