title: Regsvr32 Pattern 5067
id: 9f992498-e0c8-4de5-ad0f-c4666a19e0b0
status: experimental
description: Detects patterns associated with Regsvr32 (T1218.010).
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: DetectionForge
date: 2024/05/07
modified: 2025/08/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'regsvr32'
      - 'x_5067'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for regsvr32
  - Security and monitoring tools
level: medium
