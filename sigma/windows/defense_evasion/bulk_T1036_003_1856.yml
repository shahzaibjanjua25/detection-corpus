title: Rename System Utilities Suspicious Activity Pattern 1856
id: 4c80265b-78f2-47af-067f-def2ce7eaaf9
status: experimental
description: Detects process or registry activity patterns associated with Rename System Utilities (T1036.003).
references:
  - https://attack.mitre.org/techniques/T1036/003/
author: DetectionForge
date: 2025/04/01
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rename'
      - 'bulk_pattern_1856'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving rename system utilities
  - Security tools, monitoring agents, and authorized assessments
level: medium
