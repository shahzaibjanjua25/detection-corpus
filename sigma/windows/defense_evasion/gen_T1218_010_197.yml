title: Suspicious Regsvr32 Activity Indicator 197
id: bf302e42-bc56-20c7-bfba-9b2ec056af1d
status: experimental
description: Detects process or activity patterns associated with Regsvr32 (T1218.010).
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: DetectionForge
date: 2024/11/07
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'regsvr32'
      - 'suspicious_pattern_197'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving regsvr32
  - Security tools and monitoring agents performing similar actions
level: medium
