title: Regsvr32 Pattern 5079
id: afad0015-95b4-4075-ab8c-a50cc5bbccea
status: experimental
description: Detects patterns associated with Regsvr32 (T1218.010).
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: DetectionForge
date: 2024/05/19
modified: 2025/08/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'regsvr32'
      - 'x_5079'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for regsvr32
  - Security and monitoring tools
level: medium
