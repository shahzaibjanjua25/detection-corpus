title: Recycle Bin Clearing for Anti-Forensics
id: d9980b96-33f1-a004-e368-d7e272775352
status: stable
description: Detects tools or commands that empty the recycle bin in suspicious context
references:
  - https://attack.mitre.org/techniques/T1070/004/
author: DetectionForge
date: 2024/02/20
modified: 2025/03/01
tags:
  - attack.defense-evasion
  - attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'Clear-RecycleBin'
      - 'emptyrecyclebin'
      - 'sdelete'
  condition: selection
falsepositives:
  - User-initiated cleanup
  - Disk space management scripts
level: medium
