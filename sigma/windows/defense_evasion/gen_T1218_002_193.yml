title: Suspicious Control Panel Activity Indicator 193
id: 0274509c-933f-ee1d-6d3d-251448ad5f5d
status: experimental
description: Detects process or activity patterns associated with Control Panel (T1218.002).
references:
  - https://attack.mitre.org/techniques/T1218/002/
author: DetectionForge
date: 2024/11/03
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'control'
      - 'suspicious_pattern_193'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving control panel
  - Security tools and monitoring agents performing similar actions
level: medium
