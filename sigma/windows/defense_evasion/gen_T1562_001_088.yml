title: Suspicious Disable or Modify Tools Activity Indicator 088
id: 3355a8fd-cfef-dea6-a069-9f89a58efafe
status: experimental
description: Detects process or activity patterns associated with Disable or Modify Tools (T1562.001).
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: DetectionForge
date: 2024/07/21
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'disable'
      - 'suspicious_pattern_88'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving disable or modify tools
  - Security tools and monitoring agents performing similar actions
level: medium
