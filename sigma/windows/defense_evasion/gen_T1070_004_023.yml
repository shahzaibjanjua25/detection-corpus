title: Suspicious File Deletion Activity Indicator 023
id: 99a56022-d7db-530a-68ba-f329e15c09ec
status: experimental
description: Detects process or activity patterns associated with File Deletion (T1070.004).
references:
  - https://attack.mitre.org/techniques/T1070/004/
author: DetectionForge
date: 2024/05/17
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'file'
      - 'suspicious_pattern_23'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving file deletion
  - Security tools and monitoring agents performing similar actions
level: medium
