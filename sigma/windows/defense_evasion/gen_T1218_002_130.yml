title: Suspicious Control Panel Activity Indicator 130
id: e9655e03-3031-1870-c042-9239611cfc1c
status: experimental
description: Detects process or activity patterns associated with Control Panel (T1218.002).
references:
  - https://attack.mitre.org/techniques/T1218/002/
author: DetectionForge
date: 2024/09/01
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'control'
      - 'suspicious_pattern_130'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving control panel
  - Security tools and monitoring agents performing similar actions
level: medium
