title: Regsvr32 Suspicious Activity Pattern 1331
id: a9a4ef50-f279-452a-49c3-9625ff6f076a
status: experimental
description: Detects process or registry activity patterns associated with Regsvr32 (T1218.010).
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: DetectionForge
date: 2025/09/23
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'regsvr32'
      - 'bulk_pattern_1331'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving regsvr32
  - Security tools, monitoring agents, and authorized assessments
level: medium
