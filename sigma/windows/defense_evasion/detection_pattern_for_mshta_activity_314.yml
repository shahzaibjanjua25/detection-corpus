title: Detection Pattern for Mshta Activity 314
id: 35026812-7f01-64ee-cb3d-f4f87c1bcad4
status: experimental
description: Detects activity patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2025/04/11
modified: 2025/05/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'pattern_314'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate software and administrative tools using similar command patterns
  - Security products and monitoring agents
level: medium
