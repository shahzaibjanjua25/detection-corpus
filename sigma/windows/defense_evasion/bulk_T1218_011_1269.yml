title: Rundll32 Suspicious Activity Pattern 1269
id: ce5adecc-d66c-43dc-4e1c-7b3d4a7ab28a
status: experimental
description: Detects process or registry activity patterns associated with Rundll32 (T1218.011).
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: DetectionForge
date: 2025/07/23
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rundll32'
      - 'bulk_pattern_1269'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving rundll32
  - Security tools, monitoring agents, and authorized assessments
level: medium
