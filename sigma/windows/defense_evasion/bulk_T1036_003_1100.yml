title: Rename System Utilities Suspicious Activity Pattern 1100
id: a51aab12-bafb-4dd3-2ba6-0f340d0efc5f
status: experimental
description: Detects process or registry activity patterns associated with Rename System Utilities (T1036.003).
references:
  - https://attack.mitre.org/techniques/T1036/003/
author: DetectionForge
date: 2025/02/04
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1036.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'rename'
      - 'bulk_pattern_1100'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving rename system utilities
  - Security tools, monitoring agents, and authorized assessments
level: medium
