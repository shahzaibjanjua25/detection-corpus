title: Detection Pattern for Regsvr32 Activity 279
id: 0778960a-8460-a513-38fa-7e43ba2efe33
status: experimental
description: Detects activity patterns associated with Regsvr32 (T1218.010).
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: DetectionForge
date: 2025/03/07
modified: 2025/05/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'regsvr32'
      - 'pattern_279'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate software and administrative tools using similar command patterns
  - Security products and monitoring agents
level: medium
