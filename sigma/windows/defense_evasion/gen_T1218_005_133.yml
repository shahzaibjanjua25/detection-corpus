title: Suspicious Mshta Activity Indicator 133
id: 336956b5-f381-bc35-82c6-e8930f010a6e
status: experimental
description: Detects process or activity patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2024/09/04
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'suspicious_pattern_133'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving mshta
  - Security tools and monitoring agents performing similar actions
level: medium
