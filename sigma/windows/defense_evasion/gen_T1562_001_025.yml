title: Suspicious Disable or Modify Tools Activity Indicator 025
id: 6e9025c9-8246-062b-94cd-48d7c3352e5b
status: experimental
description: Detects process or activity patterns associated with Disable or Modify Tools (T1562.001).
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: DetectionForge
date: 2024/05/19
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'disable'
      - 'suspicious_pattern_25'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving disable or modify tools
  - Security tools and monitoring agents performing similar actions
level: medium
