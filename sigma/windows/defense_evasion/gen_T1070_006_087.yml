title: Suspicious Timestomp Activity Indicator 087
id: b4eb5314-1818-b6bb-f44c-a69ff874b18f
status: experimental
description: Detects process or activity patterns associated with Timestomp (T1070.006).
references:
  - https://attack.mitre.org/techniques/T1070/006/
author: DetectionForge
date: 2024/07/20
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1070.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'timestomp'
      - 'suspicious_pattern_87'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving timestomp
  - Security tools and monitoring agents performing similar actions
level: medium
