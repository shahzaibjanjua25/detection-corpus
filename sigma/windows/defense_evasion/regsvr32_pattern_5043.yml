title: Regsvr32 Pattern 5043
id: ab75f7ab-a607-4a6a-ac5c-f58c7203ac67
status: experimental
description: Detects patterns associated with Regsvr32 (T1218.010).
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: DetectionForge
date: 2024/04/13
modified: 2025/08/01
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'regsvr32'
      - 'x_5043'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for regsvr32
  - Security and monitoring tools
level: medium
