title: Mshta Indicator 7062
id: cd575a66-0162-4bdd-a4ff-cdf216aee1e1
status: experimental
description: Detects patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2024/12/19
modified: 2025/09/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'z_7062'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for mshta
  - Security and monitoring tools
level: medium
