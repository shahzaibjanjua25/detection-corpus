title: DisableDefender Activity Indicator 3111
id: ab3c2238-0262-4234-aa47-0939a1dce333
status: experimental
description: Detects activity patterns associated with DisableDefender (T1562.001).
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: DetectionForge
date: 2024/05/22
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'disabledefender'
      - 'fast_3111'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving disabledefender
  - Security tools and monitoring agents
level: medium
