title: File Deletion Suspicious Activity Pattern 1850
id: 6c7a484c-c848-45f6-b542-483126455f4c
status: experimental
description: Detects process or registry activity patterns associated with File Deletion (T1070.004).
references:
  - https://attack.mitre.org/techniques/T1070/004/
author: DetectionForge
date: 2025/03/26
modified: 2025/06/01
tags:
  - attack.defense-evasion
  - attack.t1070.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'file'
      - 'bulk_pattern_1850'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving file deletion
  - Security tools, monitoring agents, and authorized assessments
level: medium
