title: Suspicious Process Injection Activity Indicator 154
id: 0a32f7ed-69e9-28ca-aafc-b7ef10e0dfcd
status: experimental
description: Detects process or activity patterns associated with Process Injection (T1055).
references:
  - https://attack.mitre.org/techniques/T1055/
author: DetectionForge
date: 2024/09/25
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1055
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'suspicious_pattern_154'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving process injection
  - Security tools and monitoring agents performing similar actions
level: medium
