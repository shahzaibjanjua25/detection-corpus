title: Mshta Indicator 7212
id: fa99db08-c60c-4ab3-ae5e-14dbe162de3d
status: experimental
description: Detects patterns associated with Mshta (T1218.005).
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2024/04/13
modified: 2025/09/01
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'mshta'
      - 'z_7212'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for mshta
  - Security and monitoring tools
level: medium
