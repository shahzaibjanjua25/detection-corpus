title: Suspicious Obfuscated Files or Information Activity Indicator 027
id: 7e55a467-6d20-2204-bab9-41faf8e32a7f
status: experimental
description: Detects process or activity patterns associated with Obfuscated Files or Information (T1027).
references:
  - https://attack.mitre.org/techniques/T1027/
author: DetectionForge
date: 2024/05/21
modified: 2025/04/01
tags:
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'obfuscated'
      - 'suspicious_pattern_27'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving obfuscated files or information
  - Security tools and monitoring agents performing similar actions
level: medium
