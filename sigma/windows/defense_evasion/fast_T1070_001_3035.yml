title: ClearLogs Activity Indicator 3035
id: d3a093f5-8c40-477d-af5f-1d42e6494229
status: experimental
description: Detects activity patterns associated with ClearLogs (T1070.001).
references:
  - https://attack.mitre.org/techniques/T1070/001/
author: DetectionForge
date: 2024/03/07
modified: 2025/07/01
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clearlogs'
      - 'fast_3035'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clearlogs
  - Security tools and monitoring agents
level: medium
