title: Suspicious System Information Discovery Activity Indicator 094
id: ce8b76a0-04fc-ee78-b4f6-98d5e27a239e
status: experimental
description: Detects process or activity patterns associated with System Information Discovery (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2024/07/27
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'suspicious_pattern_94'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving system information discovery
  - Security tools and monitoring agents performing similar actions
level: medium
