title: Suspicious Local Account Discovery Activity Indicator 096
id: 96ec2a09-15ac-a9da-265e-2b555e7768f7
status: experimental
description: Detects process or activity patterns associated with Local Account Discovery (T1087.001).
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: DetectionForge
date: 2024/07/29
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'suspicious_pattern_96'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving local account discovery
  - Security tools and monitoring agents performing similar actions
level: medium
