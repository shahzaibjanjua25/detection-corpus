title: Suspicious Domain Account Discovery Activity Indicator 097
id: 91fa8b9b-4f87-01c7-b76a-7a623d0affbd
status: experimental
description: Detects process or activity patterns associated with Domain Account Discovery (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2024/07/30
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domain'
      - 'suspicious_pattern_97'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving domain account discovery
  - Security tools and monitoring agents performing similar actions
level: medium
