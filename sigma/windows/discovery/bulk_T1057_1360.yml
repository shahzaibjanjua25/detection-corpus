title: Process Discovery Suspicious Activity Pattern 1360
id: b054cf66-f346-44bb-e6f9-63f0402b51d9
status: experimental
description: Detects process or registry activity patterns associated with Process Discovery (T1057).
references:
  - https://attack.mitre.org/techniques/T1057/
author: DetectionForge
date: 2025/10/22
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1057
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'bulk_pattern_1360'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving process discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
