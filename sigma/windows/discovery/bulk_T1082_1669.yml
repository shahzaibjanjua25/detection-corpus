title: System Information Discovery Suspicious Activity Pattern 1669
id: a96483fd-0512-473b-8700-1c3b6b3fff32
status: experimental
description: Detects process or registry activity patterns associated with System Information Discovery (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2024/09/26
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'bulk_pattern_1669'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving system information discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
