title: SystemInfo Activity Indicator 3763
id: 96a9c250-46a6-44a0-a283-b5abee18e4ff
status: experimental
description: Detects activity patterns associated with SystemInfo (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2024/07/13
modified: 2025/07/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'systeminfo'
      - 'fast_3763'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving systeminfo
  - Security tools and monitoring agents
level: medium
