title: Domain Trust Discovery Suspicious Activity Pattern 1551
id: b97915ea-8112-4519-f218-f871ae6e3e0f
status: experimental
description: Detects process or registry activity patterns associated with Domain Trust Discovery (T1482).
references:
  - https://attack.mitre.org/techniques/T1482/
author: DetectionForge
date: 2024/05/31
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domain'
      - 'bulk_pattern_1551'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving domain trust discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
