title: Process Discovery Suspicious Activity Pattern 1675
id: 12416c17-1688-45ca-1244-d994509b28ca
status: experimental
description: Detects process or registry activity patterns associated with Process Discovery (T1057).
references:
  - https://attack.mitre.org/techniques/T1057/
author: DetectionForge
date: 2024/10/02
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1057
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'bulk_pattern_1675'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving process discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
