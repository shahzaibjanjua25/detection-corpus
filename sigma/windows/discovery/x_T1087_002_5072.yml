title: DomainAcct Pattern 5072
id: ba672ea3-f8a8-4c4a-a453-efaa7f0f88db
status: experimental
description: Detects patterns associated with DomainAcct (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2024/05/12
modified: 2025/08/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domainacct'
      - 'x_5072'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for domainacct
  - Security and monitoring tools
level: medium
