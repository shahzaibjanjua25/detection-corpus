title: Suspicious Domain Account Discovery Activity Indicator 034
id: 99f5dec0-43e9-e428-8f1c-6341ac8ff623
status: experimental
description: Detects process or activity patterns associated with Domain Account Discovery (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2024/05/28
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domain'
      - 'suspicious_pattern_34'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving domain account discovery
  - Security tools and monitoring agents performing similar actions
level: medium
