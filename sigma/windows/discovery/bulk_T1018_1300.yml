title: Remote System Discovery Suspicious Activity Pattern 1300
id: 51f5b5f9-539b-46b3-6db1-3bb0e380c32c
status: experimental
description: Detects process or registry activity patterns associated with Remote System Discovery (T1018).
references:
  - https://attack.mitre.org/techniques/T1018/
author: DetectionForge
date: 2025/08/23
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1018
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'remote'
      - 'bulk_pattern_1300'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving remote system discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
