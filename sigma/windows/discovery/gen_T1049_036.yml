title: Suspicious System Network Connections Discovery Activity Indicator 036
id: 2d79bbea-8ac4-d9df-3a92-bf5fd0779044
status: experimental
description: Detects process or activity patterns associated with System Network Connections Discovery (T1049).
references:
  - https://attack.mitre.org/techniques/T1049/
author: DetectionForge
date: 2024/05/30
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1049
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'suspicious_pattern_36'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving system network connections discovery
  - Security tools and monitoring agents performing similar actions
level: medium
