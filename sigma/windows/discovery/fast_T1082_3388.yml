title: SystemInfo Activity Indicator 3388
id: 0b50c366-a163-4a7b-ac66-d79d910d7067
status: experimental
description: Detects activity patterns associated with SystemInfo (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2025/02/23
modified: 2025/07/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'systeminfo'
      - 'fast_3388'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving systeminfo
  - Security tools and monitoring agents
level: medium
