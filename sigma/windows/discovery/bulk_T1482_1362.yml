title: Domain Trust Discovery Suspicious Activity Pattern 1362
id: ab760a30-4694-416a-e09e-9a484981d473
status: experimental
description: Detects process or registry activity patterns associated with Domain Trust Discovery (T1482).
references:
  - https://attack.mitre.org/techniques/T1482/
author: DetectionForge
date: 2025/10/24
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domain'
      - 'bulk_pattern_1362'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving domain trust discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
