title: Detection Pattern for DomainAccount Activity 248
id: 14dd26ea-af14-dfe5-952e-227e4c8a6c77
status: experimental
description: Detects activity patterns associated with DomainAccount (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2025/02/04
modified: 2025/05/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domainaccount'
      - 'pattern_248'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate software and administrative tools using similar command patterns
  - Security products and monitoring agents
level: medium
