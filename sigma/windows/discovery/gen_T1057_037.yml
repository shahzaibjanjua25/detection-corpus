title: Suspicious Process Discovery Activity Indicator 037
id: 7090d688-b960-ce8d-a110-f94a68095d77
status: experimental
description: Detects process or activity patterns associated with Process Discovery (T1057).
references:
  - https://attack.mitre.org/techniques/T1057/
author: DetectionForge
date: 2024/05/31
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1057
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'suspicious_pattern_37'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving process discovery
  - Security tools and monitoring agents performing similar actions
level: medium
