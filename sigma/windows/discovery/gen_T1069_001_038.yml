title: Suspicious Local Groups Activity Indicator 038
id: cfeb9bd7-e07a-2ad4-1e35-0c8e7c256b59
status: experimental
description: Detects process or activity patterns associated with Local Groups (T1069.001).
references:
  - https://attack.mitre.org/techniques/T1069/001/
author: DetectionForge
date: 2024/06/01
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1069.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'suspicious_pattern_38'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving local groups
  - Security tools and monitoring agents performing similar actions
level: medium
