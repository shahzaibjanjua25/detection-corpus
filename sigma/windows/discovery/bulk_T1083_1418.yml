title: File and Directory Discovery Suspicious Activity Pattern 1418
id: 055ff70e-35f0-4424-2e36-acc0624ae41b
status: experimental
description: Detects process or registry activity patterns associated with File and Directory Discovery (T1083).
references:
  - https://attack.mitre.org/techniques/T1083/
author: DetectionForge
date: 2024/01/19
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1083
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'file'
      - 'bulk_pattern_1418'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving file and directory discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
