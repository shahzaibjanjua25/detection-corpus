title: BloodHound / SharpHound Indicators
id: 1a34ac2d-3c2c-928e-528c-f6022c690f92
status: stable
description: Detects SharpHound and BloodHound collectors
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2024/02/26
modified: 2025/03/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'SharpHound'
      - 'BloodHound'
      - '--CollectionMethod'
      - 'Session'
      - 'ACL'
  condition: selection
falsepositives:
  - Authorized red team / purple team
  - AD security assessments
level: medium
