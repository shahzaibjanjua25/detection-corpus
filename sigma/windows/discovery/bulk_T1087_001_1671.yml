title: Local Account Discovery Suspicious Activity Pattern 1671
id: d3c7ef77-34ea-4f54-69ea-542a29e1a0ac
status: experimental
description: Detects process or registry activity patterns associated with Local Account Discovery (T1087.001).
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: DetectionForge
date: 2024/09/28
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'bulk_pattern_1671'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving local account discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
