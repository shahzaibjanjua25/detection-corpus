title: System Information Discovery Suspicious Activity Pattern 1732
id: 6f437e5a-62fd-40c8-1163-336e050c0ce8
status: experimental
description: Detects process or registry activity patterns associated with System Information Discovery (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2024/11/28
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'bulk_pattern_1732'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving system information discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
