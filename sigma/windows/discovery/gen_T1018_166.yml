title: Suspicious Remote System Discovery Activity Indicator 166
id: 1ced2cf3-8778-ccb7-fc88-68dcda52a24e
status: experimental
description: Detects process or activity patterns associated with Remote System Discovery (T1018).
references:
  - https://attack.mitre.org/techniques/T1018/
author: DetectionForge
date: 2024/10/07
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1018
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'remote'
      - 'suspicious_pattern_166'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving remote system discovery
  - Security tools and monitoring agents performing similar actions
level: medium
