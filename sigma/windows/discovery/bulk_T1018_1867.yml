title: Remote System Discovery Suspicious Activity Pattern 1867
id: 8d476da9-05ba-4f83-7dfd-d9a354fdb3b4
status: experimental
description: Detects process or registry activity patterns associated with Remote System Discovery (T1018).
references:
  - https://attack.mitre.org/techniques/T1018/
author: DetectionForge
date: 2025/04/12
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1018
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'remote'
      - 'bulk_pattern_1867'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving remote system discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
