title: System Network Connections Discovery Suspicious Activity Pattern 1548
id: 87255eb3-bd32-4ee6-aa36-3227f77ea6aa
status: experimental
description: Detects process or registry activity patterns associated with System Network Connections Discovery (T1049).
references:
  - https://attack.mitre.org/techniques/T1049/
author: DetectionForge
date: 2024/05/28
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1049
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'bulk_pattern_1548'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving system network connections discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
