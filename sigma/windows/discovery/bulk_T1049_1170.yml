title: System Network Connections Discovery Suspicious Activity Pattern 1170
id: ef9240b2-9795-44d8-ab68-8b8d6a846467
status: experimental
description: Detects process or registry activity patterns associated with System Network Connections Discovery (T1049).
references:
  - https://attack.mitre.org/techniques/T1049/
author: DetectionForge
date: 2025/04/15
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1049
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'bulk_pattern_1170'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving system network connections discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
