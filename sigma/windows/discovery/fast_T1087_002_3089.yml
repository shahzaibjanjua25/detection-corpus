title: DomainAccount Activity Indicator 3089
id: 38e5861a-f85e-4769-ad41-6001536fc8dc
status: experimental
description: Detects activity patterns associated with DomainAccount (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2024/04/30
modified: 2025/07/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domainaccount'
      - 'fast_3089'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving domainaccount
  - Security tools and monitoring agents
level: medium
