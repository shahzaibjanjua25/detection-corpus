title: Suspicious File and Directory Discovery Activity Indicator 032
id: fb4cde54-b287-4d61-1c18-9e645dafec04
status: experimental
description: Detects process or activity patterns associated with File and Directory Discovery (T1083).
references:
  - https://attack.mitre.org/techniques/T1083/
author: DetectionForge
date: 2024/05/26
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1083
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'file'
      - 'suspicious_pattern_32'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving file and directory discovery
  - Security tools and monitoring agents performing similar actions
level: medium
