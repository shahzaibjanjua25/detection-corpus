title: SystemInfo Activity Indicator 3313
id: 2e8b7599-0cda-4201-ada7-d4e034be4c6d
status: experimental
description: Detects activity patterns associated with SystemInfo (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2024/12/10
modified: 2025/07/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'systeminfo'
      - 'fast_3313'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving systeminfo
  - Security tools and monitoring agents
level: medium
