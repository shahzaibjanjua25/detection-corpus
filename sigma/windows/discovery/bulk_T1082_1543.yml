title: System Information Discovery Suspicious Activity Pattern 1543
id: d0910593-acc1-4474-09a7-8a3ac32906aa
status: experimental
description: Detects process or registry activity patterns associated with System Information Discovery (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2024/05/23
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'bulk_pattern_1543'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving system information discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
