title: System Information Discovery Suspicious Activity Pattern 1228
id: 8bfb5c05-d0fc-497b-bba5-96807199f572
status: experimental
description: Detects process or registry activity patterns associated with System Information Discovery (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2025/06/12
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'bulk_pattern_1228'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving system information discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
