title: DomainAcct Indicator 7176
id: b30688eb-36fd-4d1e-a4c7-09c433509d95
status: experimental
description: Detects patterns associated with DomainAcct (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2025/04/12
modified: 2025/09/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domainacct'
      - 'z_7176'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for domainacct
  - Security and monitoring tools
level: medium
