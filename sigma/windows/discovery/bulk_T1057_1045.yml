title: Process Discovery Suspicious Activity Pattern 1045
id: de35385a-34fa-44c6-1564-c9ab5ca2e954
status: experimental
description: Detects process or registry activity patterns associated with Process Discovery (T1057).
references:
  - https://attack.mitre.org/techniques/T1057/
author: DetectionForge
date: 2024/12/11
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1057
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'bulk_pattern_1045'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving process discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
