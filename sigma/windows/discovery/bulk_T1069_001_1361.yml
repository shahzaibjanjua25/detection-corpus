title: Local Groups Suspicious Activity Pattern 1361
id: 5f6ad52e-04b1-42c8-574a-23bbb62029f5
status: experimental
description: Detects process or registry activity patterns associated with Local Groups (T1069.001).
references:
  - https://attack.mitre.org/techniques/T1069/001/
author: DetectionForge
date: 2025/10/23
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1069.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'bulk_pattern_1361'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving local groups
  - Security tools, monitoring agents, and authorized assessments
level: medium
