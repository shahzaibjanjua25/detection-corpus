title: System Network Connections Discovery Suspicious Activity Pattern 1737
id: 610f1571-1514-44af-7cc4-632b742c99c6
status: experimental
description: Detects process or registry activity patterns associated with System Network Connections Discovery (T1049).
references:
  - https://attack.mitre.org/techniques/T1049/
author: DetectionForge
date: 2024/12/03
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1049
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'bulk_pattern_1737'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving system network connections discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
