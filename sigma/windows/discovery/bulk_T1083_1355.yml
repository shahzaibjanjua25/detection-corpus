title: File and Directory Discovery Suspicious Activity Pattern 1355
id: b8eb057a-a871-48b2-22b3-5bcdb5420f8f
status: experimental
description: Detects process or registry activity patterns associated with File and Directory Discovery (T1083).
references:
  - https://attack.mitre.org/techniques/T1083/
author: DetectionForge
date: 2025/10/17
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1083
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'file'
      - 'bulk_pattern_1355'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving file and directory discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
