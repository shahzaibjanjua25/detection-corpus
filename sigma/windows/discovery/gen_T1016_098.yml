title: Suspicious System Network Configuration Discovery Activity Indicator 098
id: 3fd82556-571e-0236-fbe8-18f9e15d219d
status: experimental
description: Detects process or activity patterns associated with System Network Configuration Discovery (T1016).
references:
  - https://attack.mitre.org/techniques/T1016/
author: DetectionForge
date: 2024/07/31
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1016
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'suspicious_pattern_98'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving system network configuration discovery
  - Security tools and monitoring agents performing similar actions
level: medium
