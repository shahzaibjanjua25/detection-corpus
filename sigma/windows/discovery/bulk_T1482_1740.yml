title: Domain Trust Discovery Suspicious Activity Pattern 1740
id: f8743b30-7417-4918-31a3-101419d9b52a
status: experimental
description: Detects process or registry activity patterns associated with Domain Trust Discovery (T1482).
references:
  - https://attack.mitre.org/techniques/T1482/
author: DetectionForge
date: 2024/12/06
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domain'
      - 'bulk_pattern_1740'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving domain trust discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
