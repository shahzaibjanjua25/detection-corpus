title: DomainAccount Activity Indicator 3289
id: 733cd3d1-38e1-4602-a9db-5b4217c8f4ce
status: experimental
description: Detects activity patterns associated with DomainAccount (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2024/11/16
modified: 2025/07/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domainaccount'
      - 'fast_3289'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving domainaccount
  - Security tools and monitoring agents
level: medium
