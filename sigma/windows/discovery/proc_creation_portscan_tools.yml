title: Port Scanning Tool Execution
id: 4effd159-c995-8863-15b6-f2c5ee163a7f
status: stable
description: Detects common port scanners and network discovery tools
references:
  - https://attack.mitre.org/techniques/T1046/
author: DetectionForge
date: 2024/02/27
modified: 2025/03/01
tags:
  - attack.discovery
  - attack.t1046
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\nmap.exe'
      - '\masscan.exe'
      - '\rustscan.exe'
    CommandLine|contains:
      - '-p'
      - '-sS'
      - '-sT'
  condition: selection
falsepositives:
  - Network administrators performing scans
  - Vulnerability management tools
level: medium
