title: SystemInfo Activity Indicator 3713
id: fd099bde-579b-4f2b-a1b0-bac0160ef6cc
status: experimental
description: Detects activity patterns associated with SystemInfo (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2024/05/24
modified: 2025/07/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'systeminfo'
      - 'fast_3713'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving systeminfo
  - Security tools and monitoring agents
level: medium
