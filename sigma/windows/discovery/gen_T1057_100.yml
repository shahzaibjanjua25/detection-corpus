title: Suspicious Process Discovery Activity Indicator 100
id: d97d0531-34ee-14c4-a8e9-6da018ecc008
status: experimental
description: Detects process or activity patterns associated with Process Discovery (T1057).
references:
  - https://attack.mitre.org/techniques/T1057/
author: DetectionForge
date: 2024/08/02
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1057
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'suspicious_pattern_100'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving process discovery
  - Security tools and monitoring agents performing similar actions
level: medium
