title: Remote System Discovery Suspicious Activity Pattern 1804
id: 066d1f7e-6b01-450e-e227-75395b3a7ce6
status: experimental
description: Detects process or registry activity patterns associated with Remote System Discovery (T1018).
references:
  - https://attack.mitre.org/techniques/T1018/
author: DetectionForge
date: 2025/02/08
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1018
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'remote'
      - 'bulk_pattern_1804'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving remote system discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
