title: Local Account Discovery Suspicious Activity Pattern 1230
id: 10573ba1-f7dd-4383-b552-1b1ecac83459
status: experimental
description: Detects process or registry activity patterns associated with Local Account Discovery (T1087.001).
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: DetectionForge
date: 2025/06/14
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'bulk_pattern_1230'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving local account discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
