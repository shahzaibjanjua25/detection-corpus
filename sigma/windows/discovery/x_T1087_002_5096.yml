title: DomainAcct Pattern 5096
id: c90e31d2-d3fe-4eb9-a5f7-78933e84e009
status: experimental
description: Detects patterns associated with DomainAcct (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2024/06/05
modified: 2025/08/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domainacct'
      - 'x_5096'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for domainacct
  - Security and monitoring tools
level: medium
