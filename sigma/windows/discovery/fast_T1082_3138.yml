title: SystemInfo Activity Indicator 3138
id: 9f354af7-b89d-4c26-acc6-7e82a8f44cbb
status: experimental
description: Detects activity patterns associated with SystemInfo (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2024/06/18
modified: 2025/07/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'systeminfo'
      - 'fast_3138'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving systeminfo
  - Security tools and monitoring agents
level: medium
