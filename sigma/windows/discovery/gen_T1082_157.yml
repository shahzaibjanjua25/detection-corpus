title: Suspicious System Information Discovery Activity Indicator 157
id: ab1a0d7a-21ba-36bb-a084-ce9e80685af2
status: experimental
description: Detects process or activity patterns associated with System Information Discovery (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2024/09/28
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'suspicious_pattern_157'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving system information discovery
  - Security tools and monitoring agents performing similar actions
level: medium
