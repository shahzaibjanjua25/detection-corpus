title: System Information Discovery Suspicious Activity Pattern 1606
id: 07b9605b-2ab5-4726-d6f1-b4f218f72eee
status: experimental
description: Detects process or registry activity patterns associated with System Information Discovery (T1082).
references:
  - https://attack.mitre.org/techniques/T1082/
author: DetectionForge
date: 2024/07/25
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1082
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'bulk_pattern_1606'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving system information discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
