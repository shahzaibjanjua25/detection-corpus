title: DomainAcct Indicator 7196
id: 7c1eaff7-43a3-42e3-a1bc-e4a4fbdc3385
status: experimental
description: Detects patterns associated with DomainAcct (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2025/05/02
modified: 2025/09/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domainacct'
      - 'z_7196'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for domainacct
  - Security and monitoring tools
level: medium
