title: Domain Account Discovery Suspicious Activity Pattern 1231
id: 6e3c1fb2-9433-48c0-800f-9c3fe2ea4b2a
status: experimental
description: Detects process or registry activity patterns associated with Domain Account Discovery (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2025/06/15
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domain'
      - 'bulk_pattern_1231'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving domain account discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
