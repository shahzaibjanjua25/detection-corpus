title: Domain Trust Discovery Suspicious Activity Pattern 1803
id: 0dfa2419-bd5d-4904-a5e0-45bdcf3289c2
status: experimental
description: Detects process or registry activity patterns associated with Domain Trust Discovery (T1482).
references:
  - https://attack.mitre.org/techniques/T1482/
author: DetectionForge
date: 2025/02/07
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domain'
      - 'bulk_pattern_1803'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving domain trust discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
