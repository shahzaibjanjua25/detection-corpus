title: DomainAccount Activity Indicator 3589
id: 8cd69046-944e-4d63-a89e-6f11ba03b616
status: experimental
description: Detects activity patterns associated with DomainAccount (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2025/09/12
modified: 2025/07/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domainaccount'
      - 'fast_3589'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving domainaccount
  - Security tools and monitoring agents
level: medium
