title: Suspicious Local Account Discovery Activity Indicator 033
id: a68aabe5-452e-3569-0e0e-bbb317799be2
status: experimental
description: Detects process or activity patterns associated with Local Account Discovery (T1087.001).
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: DetectionForge
date: 2024/05/27
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'suspicious_pattern_33'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving local account discovery
  - Security tools and monitoring agents performing similar actions
level: medium
