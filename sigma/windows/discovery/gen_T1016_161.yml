title: Suspicious System Network Configuration Discovery Activity Indicator 161
id: 2e079c1e-febe-f79d-bcb0-c2d2198d6963
status: experimental
description: Detects process or activity patterns associated with System Network Configuration Discovery (T1016).
references:
  - https://attack.mitre.org/techniques/T1016/
author: DetectionForge
date: 2024/10/02
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1016
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'suspicious_pattern_161'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving system network configuration discovery
  - Security tools and monitoring agents performing similar actions
level: medium
