title: Local Account Discovery Suspicious Activity Pattern 1545
id: 7858c904-bc34-4287-5dba-f93e22b4b906
status: experimental
description: Detects process or registry activity patterns associated with Local Account Discovery (T1087.001).
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: DetectionForge
date: 2024/05/25
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'bulk_pattern_1545'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving local account discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
