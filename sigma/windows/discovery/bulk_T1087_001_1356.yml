title: Local Account Discovery Suspicious Activity Pattern 1356
id: a5b98dc9-2e67-4e0a-35de-5e693751ab5c
status: experimental
description: Detects process or registry activity patterns associated with Local Account Discovery (T1087.001).
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: DetectionForge
date: 2025/10/18
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'bulk_pattern_1356'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving local account discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
