title: Net User / Group Enumeration
id: b3bb22f6-f48d-67a9-cb5b-530d7d1b62b5
status: stable
description: Detects net.exe user and group enumeration commands
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: DetectionForge
date: 2024/02/21
modified: 2025/03/01
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\net.exe'
    CommandLine|contains:
      - 'user'
      - 'group'
      - 'localgroup'
      - '/domain'
  condition: selection
falsepositives:
  - Helpdesk and admin troubleshooting
  - Inventory scripts
level: medium
