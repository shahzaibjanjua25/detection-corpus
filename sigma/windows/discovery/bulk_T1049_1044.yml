title: System Network Connections Discovery Suspicious Activity Pattern 1044
id: 7f3b1e72-15d4-49fe-c299-1424c584d723
status: experimental
description: Detects process or registry activity patterns associated with System Network Connections Discovery (T1049).
references:
  - https://attack.mitre.org/techniques/T1049/
author: DetectionForge
date: 2024/12/10
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1049
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'bulk_pattern_1044'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving system network connections discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
