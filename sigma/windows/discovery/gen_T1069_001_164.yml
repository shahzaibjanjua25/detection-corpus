title: Suspicious Local Groups Activity Indicator 164
id: 1bc486e1-dd27-aef6-baae-c61bcd29a2e9
status: experimental
description: Detects process or activity patterns associated with Local Groups (T1069.001).
references:
  - https://attack.mitre.org/techniques/T1069/001/
author: DetectionForge
date: 2024/10/05
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1069.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'suspicious_pattern_164'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving local groups
  - Security tools and monitoring agents performing similar actions
level: medium
