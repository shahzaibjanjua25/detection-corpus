title: DomainAcct Pattern 5036
id: cc4e7434-a07f-4016-af6d-844002f660ea
status: experimental
description: Detects patterns associated with DomainAcct (T1087.002).
references:
  - https://attack.mitre.org/techniques/T1087/002/
author: DetectionForge
date: 2024/04/06
modified: 2025/08/01
tags:
  - attack.discovery
  - attack.t1087.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domainacct'
      - 'x_5036'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for domainacct
  - Security and monitoring tools
level: medium
