title: Suspicious System Network Configuration Discovery Activity Indicator 035
id: e055e8de-f493-f453-7421-4ebb115a79df
status: experimental
description: Detects process or activity patterns associated with System Network Configuration Discovery (T1016).
references:
  - https://attack.mitre.org/techniques/T1016/
author: DetectionForge
date: 2024/05/29
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1016
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'suspicious_pattern_35'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving system network configuration discovery
  - Security tools and monitoring agents performing similar actions
level: medium
