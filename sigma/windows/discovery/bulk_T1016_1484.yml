title: System Network Configuration Discovery Suspicious Activity Pattern 1484
id: ea3ff1ac-d4bf-42b6-5b90-0092daef94f6
status: experimental
description: Detects process or registry activity patterns associated with System Network Configuration Discovery (T1016).
references:
  - https://attack.mitre.org/techniques/T1016/
author: DetectionForge
date: 2024/03/25
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1016
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'system'
      - 'bulk_pattern_1484'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving system network configuration discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
