title: Suspicious Local Groups Activity Indicator 101
id: a155a161-761b-0ad4-1ed5-37bbc1525db4
status: experimental
description: Detects process or activity patterns associated with Local Groups (T1069.001).
references:
  - https://attack.mitre.org/techniques/T1069/001/
author: DetectionForge
date: 2024/08/03
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1069.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'suspicious_pattern_101'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving local groups
  - Security tools and monitoring agents performing similar actions
level: medium
