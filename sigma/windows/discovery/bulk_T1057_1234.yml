title: Process Discovery Suspicious Activity Pattern 1234
id: 8859b58e-6c30-412c-5f94-14b8bdddb67f
status: experimental
description: Detects process or registry activity patterns associated with Process Discovery (T1057).
references:
  - https://attack.mitre.org/techniques/T1057/
author: DetectionForge
date: 2025/06/18
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1057
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'process'
      - 'bulk_pattern_1234'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving process discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
