title: Local Account Discovery Suspicious Activity Pattern 1797
id: 97f8de5a-c4b6-43cc-54b6-5617e405f13a
status: experimental
description: Detects process or registry activity patterns associated with Local Account Discovery (T1087.001).
references:
  - https://attack.mitre.org/techniques/T1087/001/
author: DetectionForge
date: 2025/02/01
modified: 2025/06/01
tags:
  - attack.discovery
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'bulk_pattern_1797'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving local account discovery
  - Security tools, monitoring agents, and authorized assessments
level: medium
