title: Suspicious Domain Trust Discovery Activity Indicator 039
id: 9b8fd5b4-3f57-8b7f-9a89-a51ea6cba8dd
status: experimental
description: Detects process or activity patterns associated with Domain Trust Discovery (T1482).
references:
  - https://attack.mitre.org/techniques/T1482/
author: DetectionForge
date: 2024/06/02
modified: 2025/04/01
tags:
  - attack.discovery
  - attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'domain'
      - 'suspicious_pattern_39'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving domain trust discovery
  - Security tools and monitoring agents performing similar actions
level: medium
