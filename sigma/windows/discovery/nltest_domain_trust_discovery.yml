title: Nltest Domain Trust Discovery
id: e11cd22f-ca84-68c9-3f87-756e6fd00273
status: stable
description: Detects nltest used for domain trust and DC discovery
references:
  - https://attack.mitre.org/techniques/T1482/
author: DetectionForge
date: 2024/02/24
modified: 2025/03/01
tags:
  - attack.discovery
  - attack.t1482
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\nltest.exe'
    CommandLine|contains:
      - '/domain_trusts'
      - '/dclist'
      - '/dsgetdc'
  condition: selection
falsepositives:
  - Domain administrators performing trust audits
  - Migration tools
level: medium
