title: NTDS Suspicious Activity Pattern 1152
id: bb0ead57-e724-43d9-32ed-3ecd19edaaa6
status: experimental
description: Detects process or registry activity patterns associated with NTDS (T1003.003).
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: DetectionForge
date: 2025/03/28
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ntds'
      - 'bulk_pattern_1152'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving ntds
  - Security tools, monitoring agents, and authorized assessments
level: medium
