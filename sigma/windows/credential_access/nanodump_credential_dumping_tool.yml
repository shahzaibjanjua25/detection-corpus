title: NanoDump Credential Dumping Tool
id: 773ecf18-6882-abb1-92ee-b6c92e0a38b3
status: stable
description: Detects NanoDump and similar silent LSASS dumpers
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2024/01/17
modified: 2025/03/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\nanodump.exe'
      - '\nanodump'
    CommandLine|contains:
      - '--write'
      - 'lsass'
  condition: selection
falsepositives:
  - Red team exercises
  - Security research labs
level: high
