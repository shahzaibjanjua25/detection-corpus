title: LSASS Pattern 5142
id: 8dcde957-b8fc-45b0-a452-f9b8e081a0e6
status: experimental
description: Detects patterns associated with LSASS (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2024/07/21
modified: 2025/08/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'x_5142'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for lsass
  - Security and monitoring tools
level: medium
