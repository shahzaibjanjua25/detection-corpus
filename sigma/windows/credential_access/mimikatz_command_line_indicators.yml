title: Mimikatz Command Line Indicators
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: stable
description: Detects process creation events containing classic Mimikatz command-line arguments used for credential dumping.
references:
  - https://attack.mitre.org/techniques/T1003/
  - https://github.com/gentilkiwi/mimikatz
author: DetectionForge
date: 2024/03/15
modified: 2025/02/01
tags:
  - attack.credential-access
  - attack.t1003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'privilege::debug'
      - 'token::elevate'
      - 'crypto::capi'
      - 'kerberos::'
  filter_research:
    Image|contains:
      - '\mimikatz'
      - '\x64'
    ParentImage|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
  condition: selection and not filter_research
falsepositives:
  - Security researchers or red team operators running Mimikatz in controlled lab environments
  - Training platforms that deliberately execute Mimikatz for educational purposes
level: critical
