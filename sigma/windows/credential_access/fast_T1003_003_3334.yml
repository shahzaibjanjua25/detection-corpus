title: NTDS Activity Indicator 3334
id: 7fd0105f-ab37-45f2-af37-ab693568717e
status: experimental
description: Detects activity patterns associated with NTDS (T1003.003).
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: DetectionForge
date: 2024/12/31
modified: 2025/07/01
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ntds'
      - 'fast_3334'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving ntds
  - Security tools and monitoring agents
level: medium
