title: Procdump LSASS Dump Attempt
id: 003874ed-aed6-d0f2-68fc-2545c3b32686
status: stable
description: Detects procdump targeting lsass.exe
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2024/01/15
modified: 2025/03/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
    CommandLine|contains: 'lsass'
  condition: selection
falsepositives:
  - Legitimate IR use of Sysinternals Procdump
  - Some EDR products create process dumps
level: high
