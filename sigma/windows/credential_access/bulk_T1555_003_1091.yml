title: Credentials from Web Browsers Suspicious Activity Pattern 1091
id: ff0dd8bf-9c0e-45e7-1d3b-fde5a50f8e0a
status: experimental
description: Detects process or registry activity patterns associated with Credentials from Web Browsers (T1555.003).
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: DetectionForge
date: 2025/01/26
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1555.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'credentials'
      - 'bulk_pattern_1091'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving credentials from web browsers
  - Security tools, monitoring agents, and authorized assessments
level: medium
