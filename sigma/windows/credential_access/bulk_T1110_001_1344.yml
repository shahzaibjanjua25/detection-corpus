title: Password Guessing Suspicious Activity Pattern 1344
id: 054574a6-28e2-42fd-79ca-f79d67a45479
status: experimental
description: Detects process or registry activity patterns associated with Password Guessing (T1110.001).
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: DetectionForge
date: 2025/10/06
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'password'
      - 'bulk_pattern_1344'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving password guessing
  - Security tools, monitoring agents, and authorized assessments
level: medium
