title: Suspicious Credentials from Web Browsers Activity Indicator 209
id: 999e79cf-8546-181f-1cf5-812716d36653
status: experimental
description: Detects process or activity patterns associated with Credentials from Web Browsers (T1555.003).
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: DetectionForge
date: 2024/11/19
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1555.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'credentials'
      - 'suspicious_pattern_209'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving credentials from web browsers
  - Security tools and monitoring agents performing similar actions
level: medium
