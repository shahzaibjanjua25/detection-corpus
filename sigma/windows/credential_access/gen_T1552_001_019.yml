title: Suspicious Credentials In Files Activity Indicator 019
id: a28267bd-19f5-be5d-f496-1af2c25cc0ec
status: experimental
description: Detects process or activity patterns associated with Credentials In Files (T1552.001).
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: DetectionForge
date: 2024/05/13
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'credentials'
      - 'suspicious_pattern_19'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving credentials in files
  - Security tools and monitoring agents performing similar actions
level: medium
