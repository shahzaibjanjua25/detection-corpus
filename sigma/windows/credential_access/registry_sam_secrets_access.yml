title: Access to SAM or SECURITY Hive
id: cc4c55ed-ffd1-8694-40f9-c5c298fe20c4
status: stable
description: Detects non-system access to SAM/SECURITY registry hives
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: DetectionForge
date: 2024/01/18
modified: 2025/03/01
tags:
  - attack.credential-access
  - attack.t1003.002
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains:
      - '\SAM\'
      - '\SECURITY\'
  condition: selection
falsepositives:
  - Domain admin audits with regedit
  - Backup software snapshotting registry
level: high
