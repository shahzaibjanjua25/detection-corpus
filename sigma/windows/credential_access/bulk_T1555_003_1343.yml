title: Credentials from Web Browsers Suspicious Activity Pattern 1343
id: fe63d0a1-0beb-415d-3c2b-dd8ac9b83ae7
status: experimental
description: Detects process or registry activity patterns associated with Credentials from Web Browsers (T1555.003).
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: DetectionForge
date: 2025/10/05
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1555.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'credentials'
      - 'bulk_pattern_1343'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving credentials from web browsers
  - Security tools, monitoring agents, and authorized assessments
level: medium
