title: LSASS Activity Indicator 3708
id: 5f79181b-114e-4e8b-aec3-2c721878a3ee
status: experimental
description: Detects activity patterns associated with LSASS (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2024/05/19
modified: 2025/07/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'fast_3708'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving lsass
  - Security tools and monitoring agents
level: medium
