title: LSASS Indicator 7184
id: 14cd262e-d4a3-4d24-accb-acc7627149e1
status: experimental
description: Detects patterns associated with LSASS (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2025/04/20
modified: 2025/09/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'z_7184'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for lsass
  - Security and monitoring tools
level: medium
