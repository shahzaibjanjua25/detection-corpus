title: Suspicious Credentials from Web Browsers Activity Indicator 083
id: be2cee52-31b5-5a2e-3740-5d2ab61b9de7
status: experimental
description: Detects process or activity patterns associated with Credentials from Web Browsers (T1555.003).
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: DetectionForge
date: 2024/07/16
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1555.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'credentials'
      - 'suspicious_pattern_83'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving credentials from web browsers
  - Security tools and monitoring agents performing similar actions
level: medium
