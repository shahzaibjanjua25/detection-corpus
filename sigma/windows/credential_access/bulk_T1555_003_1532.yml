title: Credentials from Web Browsers Suspicious Activity Pattern 1532
id: 3c497b9f-1544-4d09-864e-0e2afb3913ce
status: experimental
description: Detects process or registry activity patterns associated with Credentials from Web Browsers (T1555.003).
references:
  - https://attack.mitre.org/techniques/T1555/003/
author: DetectionForge
date: 2024/05/12
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1555.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'credentials'
      - 'bulk_pattern_1532'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving credentials from web browsers
  - Security tools, monitoring agents, and authorized assessments
level: medium
