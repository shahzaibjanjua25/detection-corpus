title: Suspicious Credentials In Files Activity Indicator 145
id: 1a81cf4f-dd67-d6b9-e1b7-41f697e97cb5
status: experimental
description: Detects process or activity patterns associated with Credentials In Files (T1552.001).
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: DetectionForge
date: 2024/09/16
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'credentials'
      - 'suspicious_pattern_145'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving credentials in files
  - Security tools and monitoring agents performing similar actions
level: medium
