title: NTDS Suspicious Activity Pattern 1782
id: 9e74d7b7-22f8-4f69-6c98-42706d8fe7d4
status: experimental
description: Detects process or registry activity patterns associated with NTDS (T1003.003).
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: DetectionForge
date: 2025/01/17
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ntds'
      - 'bulk_pattern_1782'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving ntds
  - Security tools, monitoring agents, and authorized assessments
level: medium
