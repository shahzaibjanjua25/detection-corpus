title: Suspicious Password Guessing Activity Indicator 147
id: 1dab8e8b-414d-3870-15f4-5a5d66403299
status: experimental
description: Detects process or activity patterns associated with Password Guessing (T1110.001).
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: DetectionForge
date: 2024/09/18
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'password'
      - 'suspicious_pattern_147'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving password guessing
  - Security tools and monitoring agents performing similar actions
level: medium
