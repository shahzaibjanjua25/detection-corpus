title: Impacket Secretsdump Indicators
id: e5d49508-ba72-9668-779e-a0c8770ab5b3
status: stable
description: Detects command lines associated with Impacket secretsdump
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: DetectionForge
date: 2024/01/19
modified: 2025/03/01
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'secretsdump'
      - '-just-dc'
      - '-ntds'
  condition: selection
falsepositives:
  - Authorized penetration tests
  - Internal red team activity
level: high
