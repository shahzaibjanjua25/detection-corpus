title: Password Guessing Suspicious Activity Pattern 1092
id: d8efff28-2c5f-469b-61be-1aa51f9ff5f0
status: experimental
description: Detects process or registry activity patterns associated with Password Guessing (T1110.001).
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: DetectionForge
date: 2025/01/27
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'password'
      - 'bulk_pattern_1092'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving password guessing
  - Security tools, monitoring agents, and authorized assessments
level: medium
