title: NTDS Suspicious Activity Pattern 1908
id: a1ab57d6-4378-4eb8-1aec-3d7967900ebb
status: experimental
description: Detects process or registry activity patterns associated with NTDS (T1003.003).
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: DetectionForge
date: 2025/05/23
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ntds'
      - 'bulk_pattern_1908'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving ntds
  - Security tools, monitoring agents, and authorized assessments
level: medium
