title: NTDS Activity Indicator 3459
id: 5c9b55ed-8cfd-4d4b-a6af-7ac96565abbb
status: experimental
description: Detects activity patterns associated with NTDS (T1003.003).
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: DetectionForge
date: 2025/05/05
modified: 2025/07/01
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ntds'
      - 'fast_3459'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving ntds
  - Security tools and monitoring agents
level: medium
