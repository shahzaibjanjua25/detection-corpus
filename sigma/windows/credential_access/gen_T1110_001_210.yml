title: Suspicious Password Guessing Activity Indicator 210
id: d39a1612-9e1a-7627-07a9-3a39fa1df56b
status: experimental
description: Detects process or activity patterns associated with Password Guessing (T1110.001).
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: DetectionForge
date: 2024/11/20
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'password'
      - 'suspicious_pattern_210'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving password guessing
  - Security tools and monitoring agents performing similar actions
level: medium
