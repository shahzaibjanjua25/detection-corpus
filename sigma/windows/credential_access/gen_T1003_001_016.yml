title: Suspicious LSASS Memory Activity Indicator 016
id: ebec27c2-7ca2-e266-17bf-d356a543c34f
status: experimental
description: Detects process or activity patterns associated with LSASS Memory (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2024/05/10
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'suspicious_pattern_16'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving lsass memory
  - Security tools and monitoring agents performing similar actions
level: medium
