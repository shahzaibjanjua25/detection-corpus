title: Suspicious NTDS Activity Indicator 144
id: e4106e28-3068-49f7-a4a8-53d469ed179c
status: experimental
description: Detects process or activity patterns associated with NTDS (T1003.003).
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: DetectionForge
date: 2024/09/15
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ntds'
      - 'suspicious_pattern_144'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving ntds
  - Security tools and monitoring agents performing similar actions
level: medium
