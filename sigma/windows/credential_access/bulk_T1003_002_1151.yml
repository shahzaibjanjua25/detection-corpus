title: Security Account Manager Suspicious Activity Pattern 1151
id: 5379d202-5507-4c2d-e7c4-1e3b44670d18
status: experimental
description: Detects process or registry activity patterns associated with Security Account Manager (T1003.002).
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: DetectionForge
date: 2025/03/27
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'security'
      - 'bulk_pattern_1151'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving security account manager
  - Security tools, monitoring agents, and authorized assessments
level: medium
