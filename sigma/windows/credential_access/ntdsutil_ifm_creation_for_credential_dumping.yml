title: NTDSUtil IFM Creation for Credential Dumping
id: d4e5f6a7-b8c9-0123-def0-234567890123
status: stable
description: Detects use of ntdsutil.exe to create an Install From Media (IFM) set, a common technique for offline NTDS.dit extraction.
references:
  - https://attack.mitre.org/techniques/T1003/003/
  - https://docs.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/cc753343(v=ws.11)
author: DetectionForge
date: 2024/04/10
modified: 2025/03/01
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\ntdsutil.exe'
    CommandLine|contains|all:
      - 'ifm'
      - 'create'
  condition: selection
falsepositives:
  - Domain controller administrators performing legitimate IFM creation for DC promotion or recovery
  - Automated backup scripts that use ntdsutil for system state backups
level: high
