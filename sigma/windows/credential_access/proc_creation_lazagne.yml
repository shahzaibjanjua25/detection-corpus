title: LaZagne Credential Recovery Tool
id: 32898ecf-da44-595c-52f4-bf983b90f83d
status: stable
description: Detects LaZagne password recovery utility
references:
  - https://attack.mitre.org/techniques/T1555/
author: DetectionForge
date: 2024/01/21
modified: 2025/03/01
tags:
  - attack.credential-access
  - attack.t1555
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\lazagne.exe'
      - '\laZagne.exe'
    CommandLine|contains:
      - 'all'
      - 'browsers'
      - 'chats'
  condition: selection
falsepositives:
  - Security assessments
  - Password audit tools used by IT
level: high
