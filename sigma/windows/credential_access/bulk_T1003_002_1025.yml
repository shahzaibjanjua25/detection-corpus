title: Security Account Manager Suspicious Activity Pattern 1025
id: 3a7678de-b02e-47d6-ad84-7f65638c8b67
status: experimental
description: Detects process or registry activity patterns associated with Security Account Manager (T1003.002).
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: DetectionForge
date: 2024/11/21
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1003.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'security'
      - 'bulk_pattern_1025'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving security account manager
  - Security tools, monitoring agents, and authorized assessments
level: medium
