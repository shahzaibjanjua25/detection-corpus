title: LSASS Pattern 5130
id: 54e06840-1517-4b63-aabb-abd5018274bf
status: experimental
description: Detects patterns associated with LSASS (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2024/07/09
modified: 2025/08/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'x_5130'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for lsass
  - Security and monitoring tools
level: medium
