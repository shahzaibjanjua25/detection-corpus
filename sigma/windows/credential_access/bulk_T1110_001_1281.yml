title: Password Guessing Suspicious Activity Pattern 1281
id: d4e45525-c248-4c69-5d5e-32363759ae86
status: experimental
description: Detects process or registry activity patterns associated with Password Guessing (T1110.001).
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: DetectionForge
date: 2025/08/04
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'password'
      - 'bulk_pattern_1281'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving password guessing
  - Security tools, monitoring agents, and authorized assessments
level: medium
