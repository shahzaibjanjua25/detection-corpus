title: LSASS Activity Indicator 3108
id: b4ee9e3f-e1d7-41dd-ac32-66e3b3b4e72c
status: experimental
description: Detects activity patterns associated with LSASS (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2024/05/19
modified: 2025/07/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'fast_3108'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving lsass
  - Security tools and monitoring agents
level: medium
