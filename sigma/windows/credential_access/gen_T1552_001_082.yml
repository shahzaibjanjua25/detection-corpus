title: Suspicious Credentials In Files Activity Indicator 082
id: 3a35082e-dce1-eb9d-6236-2f1ab3b21b95
status: experimental
description: Detects process or activity patterns associated with Credentials In Files (T1552.001).
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: DetectionForge
date: 2024/07/15
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'credentials'
      - 'suspicious_pattern_82'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving credentials in files
  - Security tools and monitoring agents performing similar actions
level: medium
