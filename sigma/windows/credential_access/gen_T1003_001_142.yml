title: Suspicious LSASS Memory Activity Indicator 142
id: b96e7574-f988-03a1-dcec-c114b399cf8e
status: experimental
description: Detects process or activity patterns associated with LSASS Memory (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2024/09/13
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'suspicious_pattern_142'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving lsass memory
  - Security tools and monitoring agents performing similar actions
level: medium
