title: Suspicious Security Account Manager Activity Indicator 017
id: 5c835ef7-e8e4-9dd3-7717-1df019c03c9d
status: experimental
description: Detects process or activity patterns associated with Security Account Manager (T1003.002).
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: DetectionForge
date: 2024/05/11
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1003.002
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'security'
      - 'suspicious_pattern_17'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving security account manager
  - Security tools and monitoring agents performing similar actions
level: medium
