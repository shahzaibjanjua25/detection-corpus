title: Suspicious Access to SAM Registry Hive
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: test
description: Detects processes other than the expected system components accessing the SAM registry hive, which can indicate offline credential dumping attempts.
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: DetectionForge
date: 2024/04/02
modified: 2025/01/20
tags:
  - attack.credential-access
  - attack.t1003.002
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains:
      - '\SAM\SAM\Domains\Account'
      - '\SAM\Domains\Account\Users'
  filter_system:
    Image|endswith:
      - '\lsass.exe'
      - '\services.exe'
      - '\winlogon.exe'
      - '\csrss.exe'
  filter_trusted_tools:
    Image|endswith:
      - '\reg.exe'
      - '\regedit.exe'
    User|contains:
      - 'ADMINISTRATOR'
      - 'SYSTEM'
  condition: selection and not 1 of filter_*
falsepositives:
  - Legitimate administrative use of regedit or reg.exe by domain admins during account audits
  - Backup or imaging software that snapshots the registry
level: high
