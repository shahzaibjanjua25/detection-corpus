title: Volume Shadow Copy Credential Access
id: 2d575387-120e-7bac-6664-12ae41e9c0a0
status: stable
description: Detects creation of volume shadow copies followed by ntds access patterns
references:
  - https://attack.mitre.org/techniques/T1003/003/
author: DetectionForge
date: 2024/01/20
modified: 2025/03/01
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains:
      - 'create'
      - 'shadow'
  condition: selection
falsepositives:
  - Legitimate system backup jobs
  - Storage migration tools
level: high
