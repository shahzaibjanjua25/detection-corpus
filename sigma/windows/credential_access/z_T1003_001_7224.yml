title: LSASS Indicator 7224
id: b5c0f8fa-413c-46e0-aa76-49c0d36afb4a
status: experimental
description: Detects patterns associated with LSASS (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2024/04/25
modified: 2025/09/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'z_7224'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for lsass
  - Security and monitoring tools
level: medium
