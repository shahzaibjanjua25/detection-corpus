title: Credentials In Files Suspicious Activity Pattern 1909
id: c40ee775-46a0-4ee7-fefd-75279687713d
status: experimental
description: Detects process or registry activity patterns associated with Credentials In Files (T1552.001).
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: DetectionForge
date: 2025/05/24
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1552.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'credentials'
      - 'bulk_pattern_1909'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving credentials in files
  - Security tools, monitoring agents, and authorized assessments
level: medium
