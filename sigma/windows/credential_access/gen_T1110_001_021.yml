title: Suspicious Password Guessing Activity Indicator 021
id: f7fff283-661f-38b9-eae5-8039f13c9f2c
status: experimental
description: Detects process or activity patterns associated with Password Guessing (T1110.001).
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: DetectionForge
date: 2024/05/15
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'password'
      - 'suspicious_pattern_21'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving password guessing
  - Security tools and monitoring agents performing similar actions
level: medium
