title: LSASS Activity Indicator 3433
id: 5fb6a728-1a81-460f-a56a-867c0fa7b818
status: experimental
description: Detects activity patterns associated with LSASS (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2025/04/09
modified: 2025/07/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'fast_3433'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving lsass
  - Security tools and monitoring agents
level: medium
