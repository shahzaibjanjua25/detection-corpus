title: LSASS Memory Suspicious Activity Pattern 1339
id: a62a9fff-2b90-449e-b8d4-818eb0cb0171
status: experimental
description: Detects process or registry activity patterns associated with LSASS Memory (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2025/10/01
modified: 2025/06/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'bulk_pattern_1339'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving lsass memory
  - Security tools, monitoring agents, and authorized assessments
level: medium
