title: Suspicious LSASS Memory Activity Indicator 205
id: d2cb3afc-ebe5-c4dc-bcc7-2e73e1463054
status: experimental
description: Detects process or activity patterns associated with LSASS Memory (T1003.001).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: DetectionForge
date: 2024/11/15
modified: 2025/04/01
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'lsass'
      - 'suspicious_pattern_205'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving lsass memory
  - Security tools and monitoring agents performing similar actions
level: medium
