title: Suspicious DNS Activity Indicator 184
id: 3b897e08-512a-3811-bbea-6770c48689da
status: experimental
description: Detects process or activity patterns associated with DNS (T1071.004).
references:
  - https://attack.mitre.org/techniques/T1071/004/
author: DetectionForge
date: 2024/10/25
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1071.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'dns'
      - 'suspicious_pattern_184'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving dns
  - Security tools and monitoring agents performing similar actions
level: medium
