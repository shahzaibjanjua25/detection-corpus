title: Web Protocols Suspicious Activity Pattern 1254
id: 4d2f4410-dde1-41ea-2071-6d2571d0d51f
status: experimental
description: Detects process or registry activity patterns associated with Web Protocols (T1071.001).
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2025/07/08
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'web'
      - 'bulk_pattern_1254'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving web protocols
  - Security tools, monitoring agents, and authorized assessments
level: medium
