title: Suspicious Web Protocols Activity Indicator 057
id: 0d430a88-3439-422b-90d4-6541a4f0b825
status: experimental
description: Detects process or activity patterns associated with Web Protocols (T1071.001).
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2024/06/20
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'web'
      - 'suspicious_pattern_57'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving web protocols
  - Security tools and monitoring agents performing similar actions
level: medium
