title: DNS Suspicious Activity Pattern 1759
id: 4067945d-113a-437a-bf1f-bbd8605c3ef7
status: experimental
description: Detects process or registry activity patterns associated with DNS (T1071.004).
references:
  - https://attack.mitre.org/techniques/T1071/004/
author: DetectionForge
date: 2024/12/25
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1071.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'dns'
      - 'bulk_pattern_1759'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving dns
  - Security tools, monitoring agents, and authorized assessments
level: medium
