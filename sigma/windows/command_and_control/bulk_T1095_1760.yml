title: Non-Application Layer Protocol Suspicious Activity Pattern 1760
id: 87bbbd58-1ac8-4450-5bf4-38add6e4a050
status: experimental
description: Detects process or registry activity patterns associated with Non-Application Layer Protocol (T1095).
references:
  - https://attack.mitre.org/techniques/T1095/
author: DetectionForge
date: 2024/12/26
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1095
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'non-application'
      - 'bulk_pattern_1760'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving non-application layer protocol
  - Security tools, monitoring agents, and authorized assessments
level: medium
