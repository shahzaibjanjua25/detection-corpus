title: Web Protocols Suspicious Activity Pattern 1002
id: 290b6747-aac0-4a49-8521-452aa139c334
status: experimental
description: Detects process or registry activity patterns associated with Web Protocols (T1071.001).
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2024/10/29
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'web'
      - 'bulk_pattern_1002'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving web protocols
  - Security tools, monitoring agents, and authorized assessments
level: medium
