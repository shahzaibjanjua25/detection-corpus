title: Certutil Encode / Decode for C2
id: 024f5e33-a690-7a10-e19c-1ac126ad6dca
status: stable
description: Detects certutil used to encode or decode content (often for payload staging)
references:
  - https://attack.mitre.org/techniques/T1140/
author: DetectionForge
date: 2024/03/11
modified: 2025/03/01
tags:
  - attack.command-and-control
  - attack.t1140
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - '-encode'
      - '-decode'
      - '-decodehex'
  condition: selection
falsepositives:
  - Certificate management tasks
  - Administrators encoding files
level: medium
