title: Suspicious DNS Activity Indicator 121
id: a5e8a0dd-ca98-1247-6435-7a8142cefcb7
status: experimental
description: Detects process or activity patterns associated with DNS (T1071.004).
references:
  - https://attack.mitre.org/techniques/T1071/004/
author: DetectionForge
date: 2024/08/23
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1071.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'dns'
      - 'suspicious_pattern_121'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving dns
  - Security tools and monitoring agents performing similar actions
level: medium
