title: Non-Standard Port Suspicious Activity Pattern 1573
id: f4e2e535-6ba7-4838-2d5b-34f584fe0d7c
status: experimental
description: Detects process or registry activity patterns associated with Non-Standard Port (T1571).
references:
  - https://attack.mitre.org/techniques/T1571/
author: DetectionForge
date: 2024/06/22
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1571
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'non-standard'
      - 'bulk_pattern_1573'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving non-standard port
  - Security tools, monitoring agents, and authorized assessments
level: medium
