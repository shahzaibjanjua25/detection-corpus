title: Suspicious Non-Application Layer Protocol Activity Indicator 122
id: 826bbc09-3d95-fe76-8cbe-1ede6f6be6a0
status: experimental
description: Detects process or activity patterns associated with Non-Application Layer Protocol (T1095).
references:
  - https://attack.mitre.org/techniques/T1095/
author: DetectionForge
date: 2024/08/24
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1095
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'non-application'
      - 'suspicious_pattern_122'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving non-application layer protocol
  - Security tools and monitoring agents performing similar actions
level: medium
