title: Suspicious Non-Standard Port Activity Indicator 124
id: a3e3d274-8bbf-89b6-508a-01878d516e55
status: experimental
description: Detects process or activity patterns associated with Non-Standard Port (T1571).
references:
  - https://attack.mitre.org/techniques/T1571/
author: DetectionForge
date: 2024/08/26
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1571
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'non-standard'
      - 'suspicious_pattern_124'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving non-standard port
  - Security tools and monitoring agents performing similar actions
level: medium
