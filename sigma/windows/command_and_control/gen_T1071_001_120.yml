title: Suspicious Web Protocols Activity Indicator 120
id: baa9b818-a41c-b92d-b73a-10d067b89707
status: experimental
description: Detects process or activity patterns associated with Web Protocols (T1071.001).
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2024/08/22
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'web'
      - 'suspicious_pattern_120'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving web protocols
  - Security tools and monitoring agents performing similar actions
level: medium
