title: PowerShell Download with Suspicious User-Agent
id: e9f0a1b2-c3d4-5678-2345-789012345678
status: experimental
description: Detects PowerShell web requests that set unusual or known-malicious User-Agent strings.
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2024/10/10
modified: 2025/01/20
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'User-Agent'
      - 'Invoke-WebRequest'
      - 'Net.WebClient'
    CommandLine|contains:
      - 'Mozilla/4.0'
      - 'Cobalt'
      - 'Empire'
  condition: selection
falsepositives:
  - Custom monitoring scripts that intentionally set older User-Agent strings
level: medium
