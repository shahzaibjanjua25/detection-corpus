title: Suspicious Ingress Tool Transfer Activity Indicator 123
id: 5eaed5c3-bfe4-cefa-4199-297f014ba3ae
status: experimental
description: Detects process or activity patterns associated with Ingress Tool Transfer (T1105).
references:
  - https://attack.mitre.org/techniques/T1105/
author: DetectionForge
date: 2024/08/25
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ingress'
      - 'suspicious_pattern_123'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving ingress tool transfer
  - Security tools and monitoring agents performing similar actions
level: medium
