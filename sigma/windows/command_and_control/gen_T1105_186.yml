title: Suspicious Ingress Tool Transfer Activity Indicator 186
id: 0f59bc0e-81c0-8c12-022f-f370f4b387ea
status: experimental
description: Detects process or activity patterns associated with Ingress Tool Transfer (T1105).
references:
  - https://attack.mitre.org/techniques/T1105/
author: DetectionForge
date: 2024/10/27
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ingress'
      - 'suspicious_pattern_186'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving ingress tool transfer
  - Security tools and monitoring agents performing similar actions
level: medium
