title: Suspicious DNS Activity Indicator 058
id: 174b8fa5-ffa4-c19f-b895-6b7b321f4bbd
status: experimental
description: Detects process or activity patterns associated with DNS (T1071.004).
references:
  - https://attack.mitre.org/techniques/T1071/004/
author: DetectionForge
date: 2024/06/21
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1071.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'dns'
      - 'suspicious_pattern_58'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving dns
  - Security tools and monitoring agents performing similar actions
level: medium
