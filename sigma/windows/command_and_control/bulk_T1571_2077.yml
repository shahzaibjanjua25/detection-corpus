title: Non-Standard Port Suspicious Activity Pattern 2077
id: 6acb5e11-0d59-4771-a634-490f98b1ccc7
status: experimental
description: Detects process or registry activity patterns associated with Non-Standard Port (T1571).
references:
  - https://attack.mitre.org/techniques/T1571/
author: DetectionForge
date: 2025/11/08
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1571
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'non-standard'
      - 'bulk_pattern_2077'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving non-standard port
  - Security tools, monitoring agents, and authorized assessments
level: medium
