title: Encrypted Channel Suspicious Activity Pattern 1763
id: a93a711c-9d36-4642-c514-dc150ab14b64
status: experimental
description: Detects process or registry activity patterns associated with Encrypted Channel (T1573).
references:
  - https://attack.mitre.org/techniques/T1573/
author: DetectionForge
date: 2024/12/29
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1573
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'encrypted'
      - 'bulk_pattern_1763'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving encrypted channel
  - Security tools, monitoring agents, and authorized assessments
level: medium
