title: Non-Standard Port Suspicious Activity Pattern 1195
id: 9d25cca2-c9de-4342-a4dd-057e8adb8d50
status: experimental
description: Detects process or registry activity patterns associated with Non-Standard Port (T1571).
references:
  - https://attack.mitre.org/techniques/T1571/
author: DetectionForge
date: 2025/05/10
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1571
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'non-standard'
      - 'bulk_pattern_1195'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving non-standard port
  - Security tools, monitoring agents, and authorized assessments
level: medium
