title: Web Protocols Suspicious Activity Pattern 1506
id: 279c6207-a5e6-4a2e-a573-2e0ed5758496
status: experimental
description: Detects process or registry activity patterns associated with Web Protocols (T1071.001).
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2024/04/16
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'web'
      - 'bulk_pattern_1506'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving web protocols
  - Security tools, monitoring agents, and authorized assessments
level: medium
