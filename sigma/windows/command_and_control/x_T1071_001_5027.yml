title: WebC2 Pattern 5027
id: ef75cf3d-57b5-4e2e-a7e2-4aa279a0bd62
status: experimental
description: Detects patterns associated with WebC2 (T1071.001).
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2024/03/28
modified: 2025/08/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'webc2'
      - 'x_5027'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for webc2
  - Security and monitoring tools
level: medium
