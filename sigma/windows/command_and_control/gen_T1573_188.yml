title: Suspicious Encrypted Channel Activity Indicator 188
id: d474b336-2fae-def1-901a-67614af2ca24
status: experimental
description: Detects process or activity patterns associated with Encrypted Channel (T1573).
references:
  - https://attack.mitre.org/techniques/T1573/
author: DetectionForge
date: 2024/10/29
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1573
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'encrypted'
      - 'suspicious_pattern_188'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving encrypted channel
  - Security tools and monitoring agents performing similar actions
level: medium
