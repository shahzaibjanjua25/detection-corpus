title: Detection Pattern for WebC2 Activity 239
id: db6ccb9c-8dff-348d-c31b-2c1a3caaf386
status: experimental
description: Detects activity patterns associated with WebC2 (T1071.001).
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2025/01/26
modified: 2025/05/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'webc2'
      - 'pattern_239'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate software and administrative tools using similar command patterns
  - Security products and monitoring agents
level: medium
