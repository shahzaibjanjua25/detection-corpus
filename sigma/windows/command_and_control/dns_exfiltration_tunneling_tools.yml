title: DNS Exfiltration / Tunneling Tools
id: 9463a215-969a-ab26-523f-39a3d1e769a5
status: stable
description: Detects known DNS tunneling and exfiltration utilities
references:
  - https://attack.mitre.org/techniques/T1071/004/
author: DetectionForge
date: 2024/03/12
modified: 2025/03/01
tags:
  - attack.command-and-control
  - attack.t1071.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\iodine.exe'
      - '\dnscat2'
      - '\dns2tcp'
    CommandLine|contains:
      - 'tunnel'
      - 'dns'
  condition: selection
falsepositives:
  - Network research
  - Authorized testing of DNS security
level: medium
