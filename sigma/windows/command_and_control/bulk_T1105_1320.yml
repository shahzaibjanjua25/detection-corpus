title: Ingress Tool Transfer Suspicious Activity Pattern 1320
id: 330298f7-1bb5-4fe5-befc-004d2c54df7e
status: experimental
description: Detects process or registry activity patterns associated with Ingress Tool Transfer (T1105).
references:
  - https://attack.mitre.org/techniques/T1105/
author: DetectionForge
date: 2025/09/12
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'ingress'
      - 'bulk_pattern_1320'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving ingress tool transfer
  - Security tools, monitoring agents, and authorized assessments
level: medium
