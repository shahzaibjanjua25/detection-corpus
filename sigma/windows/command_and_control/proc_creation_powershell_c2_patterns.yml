title: PowerShell C2 Communication Patterns
id: e52555f0-45bf-6e15-f033-c67e2c693295
status: stable
description: Detects PowerShell making web requests with suspicious patterns
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2024/03/10
modified: 2025/03/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'Net.WebClient'
      - 'DownloadString'
      - 'IEX'
      - 'http://'
      - 'https://'
  condition: selection
falsepositives:
  - Software update mechanisms
  - Package managers
level: medium
