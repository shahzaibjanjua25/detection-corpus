title: WebC2 Indicator 7019
id: 1bd0d0fb-1d1e-4bfe-a6f9-f6cb33c6ceea
status: experimental
description: Detects patterns associated with WebC2 (T1071.001).
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2024/11/06
modified: 2025/09/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'webc2'
      - 'z_7019'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for webc2
  - Security and monitoring tools
level: medium
