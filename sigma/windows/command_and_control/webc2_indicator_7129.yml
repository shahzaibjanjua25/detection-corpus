title: WebC2 Indicator 7129
id: 27a24b06-58e0-4726-a45f-cc5feb842be4
status: experimental
description: Detects patterns associated with WebC2 (T1071.001).
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2025/02/24
modified: 2025/09/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'webc2'
      - 'z_7129'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for webc2
  - Security and monitoring tools
level: medium
