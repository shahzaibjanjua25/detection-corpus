title: Suspicious Non-Standard Port Activity Indicator 061
id: 97cf0e46-e56f-f01e-d3fe-18bfad97b67a
status: experimental
description: Detects process or activity patterns associated with Non-Standard Port (T1571).
references:
  - https://attack.mitre.org/techniques/T1571/
author: DetectionForge
date: 2024/06/24
modified: 2025/04/01
tags:
  - attack.command-and-control
  - attack.t1571
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'non-standard'
      - 'suspicious_pattern_61'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving non-standard port
  - Security tools and monitoring agents performing similar actions
level: medium
