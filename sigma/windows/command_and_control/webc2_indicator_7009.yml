title: WebC2 Indicator 7009
id: c4f3c7d5-2887-4319-adac-506b40101b44
status: experimental
description: Detects patterns associated with WebC2 (T1071.001).
references:
  - https://attack.mitre.org/techniques/T1071/001/
author: DetectionForge
date: 2024/10/27
modified: 2025/09/01
tags:
  - attack.command-and-control
  - attack.t1071.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'webc2'
      - 'z_7009'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for webc2
  - Security and monitoring tools
level: medium
