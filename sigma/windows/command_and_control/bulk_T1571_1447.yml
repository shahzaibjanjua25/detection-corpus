title: Non-Standard Port Suspicious Activity Pattern 1447
id: 5ba2b928-91fa-43d8-c71d-9c093f946d6b
status: experimental
description: Detects process or registry activity patterns associated with Non-Standard Port (T1571).
references:
  - https://attack.mitre.org/techniques/T1571/
author: DetectionForge
date: 2024/02/17
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1571
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'non-standard'
      - 'bulk_pattern_1447'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving non-standard port
  - Security tools, monitoring agents, and authorized assessments
level: medium
