title: Encrypted Channel Suspicious Activity Pattern 1007
id: 91b4d92a-9333-4ecd-6917-dd3811cab921
status: experimental
description: Detects process or registry activity patterns associated with Encrypted Channel (T1573).
references:
  - https://attack.mitre.org/techniques/T1573/
author: DetectionForge
date: 2024/11/03
modified: 2025/06/01
tags:
  - attack.command-and-control
  - attack.t1573
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'encrypted'
      - 'bulk_pattern_1007'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving encrypted channel
  - Security tools, monitoring agents, and authorized assessments
level: medium
