title: Archive via Utility Suspicious Activity Pattern 1815
id: db111e7a-725e-4fc1-7783-7534971ebbc6
status: experimental
description: Detects process or registry activity patterns associated with Archive via Utility (T1560.001).
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: DetectionForge
date: 2025/02/19
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'archive'
      - 'bulk_pattern_1815'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving archive via utility
  - Security tools, monitoring agents, and authorized assessments
level: medium
