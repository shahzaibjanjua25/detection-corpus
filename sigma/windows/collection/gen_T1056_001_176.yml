title: Suspicious Keylogging Activity Indicator 176
id: f0d2976d-ce69-b5fc-903f-b3bc8b1a7245
status: experimental
description: Detects process or activity patterns associated with Keylogging (T1056.001).
references:
  - https://attack.mitre.org/techniques/T1056/001/
author: DetectionForge
date: 2024/10/17
modified: 2025/04/01
tags:
  - attack.collection
  - attack.t1056.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'keylogging'
      - 'suspicious_pattern_176'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving keylogging
  - Security tools and monitoring agents performing similar actions
level: medium
