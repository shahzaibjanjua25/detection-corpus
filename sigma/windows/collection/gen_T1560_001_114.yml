title: Suspicious Archive via Utility Activity Indicator 114
id: 8253cbd9-6217-5b00-8b2f-d61c49af7735
status: experimental
description: Detects process or activity patterns associated with Archive via Utility (T1560.001).
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: DetectionForge
date: 2024/08/16
modified: 2025/04/01
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'archive'
      - 'suspicious_pattern_114'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving archive via utility
  - Security tools and monitoring agents performing similar actions
level: medium
