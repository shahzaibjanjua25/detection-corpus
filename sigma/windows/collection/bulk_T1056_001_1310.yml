title: Keylogging Suspicious Activity Pattern 1310
id: d8579d95-8196-4368-377b-7cb33bf3a59c
status: experimental
description: Detects process or registry activity patterns associated with Keylogging (T1056.001).
references:
  - https://attack.mitre.org/techniques/T1056/001/
author: DetectionForge
date: 2025/09/02
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1056.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'keylogging'
      - 'bulk_pattern_1310'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving keylogging
  - Security tools, monitoring agents, and authorized assessments
level: medium
