title: Clipboard Activity Indicator 3543
id: 625232d8-e9c1-4792-aedc-034086bd80bc
status: experimental
description: Detects activity patterns associated with Clipboard (T1115).
references:
  - https://attack.mitre.org/techniques/T1115/
author: DetectionForge
date: 2025/07/28
modified: 2025/07/01
tags:
  - attack.collection
  - attack.t1115
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clipboard'
      - 'fast_3543'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clipboard
  - Security tools and monitoring agents
level: medium
