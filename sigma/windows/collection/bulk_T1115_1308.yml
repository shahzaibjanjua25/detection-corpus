title: Clipboard Data Suspicious Activity Pattern 1308
id: 4ebebcac-cfcd-4fed-5dbc-eca5af57ae19
status: experimental
description: Detects process or registry activity patterns associated with Clipboard Data (T1115).
references:
  - https://attack.mitre.org/techniques/T1115/
author: DetectionForge
date: 2025/08/31
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1115
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clipboard'
      - 'bulk_pattern_1308'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clipboard data
  - Security tools, monitoring agents, and authorized assessments
level: medium
