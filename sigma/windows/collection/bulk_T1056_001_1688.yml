title: Keylogging Suspicious Activity Pattern 1688
id: 25d8d86c-5f70-48c2-ecbb-a3bf94ce6688
status: experimental
description: Detects process or registry activity patterns associated with Keylogging (T1056.001).
references:
  - https://attack.mitre.org/techniques/T1056/001/
author: DetectionForge
date: 2024/10/15
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1056.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'keylogging'
      - 'bulk_pattern_1688'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving keylogging
  - Security tools, monitoring agents, and authorized assessments
level: medium
