title: Clipboard Collection via PowerShell
id: c4e7bb10-d040-7d60-b67c-5f1b5e6178d7
status: stable
description: Detects PowerShell accessing clipboard data
references:
  - https://attack.mitre.org/techniques/T1115/
author: DetectionForge
date: 2024/03/04
modified: 2025/03/01
tags:
  - attack.collection
  - attack.t1115
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'Get-Clipboard'
      - 'Windows.Clipboard'
      - 'Get-Content -Path Alias:'
  condition: selection
falsepositives:
  - Productivity scripts
  - Accessibility tools
level: medium
