title: Keylogging Suspicious Activity Pattern 2192
id: b677a178-07a2-43d8-984b-2d831dedc368
status: experimental
description: Detects process or registry activity patterns associated with Keylogging (T1056.001).
references:
  - https://attack.mitre.org/techniques/T1056/001/
author: DetectionForge
date: 2024/04/02
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1056.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'keylogging'
      - 'bulk_pattern_2192'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving keylogging
  - Security tools, monitoring agents, and authorized assessments
level: medium
