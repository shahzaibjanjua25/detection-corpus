title: Screen Capture Suspicious Activity Pattern 1561
id: bf96e740-edb0-4fa7-dd83-2194f09bd8cb
status: experimental
description: Detects process or registry activity patterns associated with Screen Capture (T1113).
references:
  - https://attack.mitre.org/techniques/T1113/
author: DetectionForge
date: 2024/06/10
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1113
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'screen'
      - 'bulk_pattern_1561'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving screen capture
  - Security tools, monitoring agents, and authorized assessments
level: medium
