title: Clipboard Activity Indicator 3668
id: 85578a86-2d05-412c-a7e3-aac12350b6e4
status: experimental
description: Detects activity patterns associated with Clipboard (T1115).
references:
  - https://attack.mitre.org/techniques/T1115/
author: DetectionForge
date: 2024/04/09
modified: 2025/07/01
tags:
  - attack.collection
  - attack.t1115
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clipboard'
      - 'fast_3668'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clipboard
  - Security tools and monitoring agents
level: medium
