title: Clipboard Activity Indicator 3818
id: 9254a10b-02e7-4fcc-a0bd-df20f60ce8fe
status: experimental
description: Detects activity patterns associated with Clipboard (T1115).
references:
  - https://attack.mitre.org/techniques/T1115/
author: DetectionForge
date: 2024/09/06
modified: 2025/07/01
tags:
  - attack.collection
  - attack.t1115
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clipboard'
      - 'fast_3818'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clipboard
  - Security tools and monitoring agents
level: medium
