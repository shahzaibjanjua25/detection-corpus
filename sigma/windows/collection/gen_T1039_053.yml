title: Suspicious Data from Network Shared Drive Activity Indicator 053
id: da152fe0-e12a-8e7e-1049-09273cdd674b
status: experimental
description: Detects process or activity patterns associated with Data from Network Shared Drive (T1039).
references:
  - https://attack.mitre.org/techniques/T1039/
author: DetectionForge
date: 2024/06/16
modified: 2025/04/01
tags:
  - attack.collection
  - attack.t1039
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'data'
      - 'suspicious_pattern_53'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving data from network shared drive
  - Security tools and monitoring agents performing similar actions
level: medium
