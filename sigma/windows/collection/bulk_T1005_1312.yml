title: Data from Local System Suspicious Activity Pattern 1312
id: 8369cc81-15a9-403c-c9e3-ef2b2a62c7fb
status: experimental
description: Detects process or registry activity patterns associated with Data from Local System (T1005).
references:
  - https://attack.mitre.org/techniques/T1005/
author: DetectionForge
date: 2025/09/04
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'data'
      - 'bulk_pattern_1312'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving data from local system
  - Security tools, monitoring agents, and authorized assessments
level: medium
