title: Keylogging Suspicious Activity Pattern 1751
id: e59a67fc-4716-4ae1-a85f-1be00535b9fd
status: experimental
description: Detects process or registry activity patterns associated with Keylogging (T1056.001).
references:
  - https://attack.mitre.org/techniques/T1056/001/
author: DetectionForge
date: 2024/12/17
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1056.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'keylogging'
      - 'bulk_pattern_1751'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving keylogging
  - Security tools, monitoring agents, and authorized assessments
level: medium
