title: Data from Network Shared Drive Suspicious Activity Pattern 2132
id: 21f60a43-5b17-4b17-36aa-352030c07cd7
status: experimental
description: Detects process or registry activity patterns associated with Data from Network Shared Drive (T1039).
references:
  - https://attack.mitre.org/techniques/T1039/
author: DetectionForge
date: 2024/02/02
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1039
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'data'
      - 'bulk_pattern_2132'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving data from network shared drive
  - Security tools, monitoring agents, and authorized assessments
level: medium
