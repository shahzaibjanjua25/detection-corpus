title: Clipboard Activity Indicator 3093
id: 60508c7f-e1a1-46fc-abe5-3cf45456b881
status: experimental
description: Detects activity patterns associated with Clipboard (T1115).
references:
  - https://attack.mitre.org/techniques/T1115/
author: DetectionForge
date: 2024/05/04
modified: 2025/07/01
tags:
  - attack.collection
  - attack.t1115
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clipboard'
      - 'fast_3093'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clipboard
  - Security tools and monitoring agents
level: medium
