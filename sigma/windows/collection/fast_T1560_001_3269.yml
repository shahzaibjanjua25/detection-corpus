title: Archive Activity Indicator 3269
id: 333e2e2a-6ee5-4ce1-aac0-1e9ff9a87ecb
status: experimental
description: Detects activity patterns associated with Archive (T1560.001).
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: DetectionForge
date: 2024/10/27
modified: 2025/07/01
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'archive'
      - 'fast_3269'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving archive
  - Security tools and monitoring agents
level: medium
