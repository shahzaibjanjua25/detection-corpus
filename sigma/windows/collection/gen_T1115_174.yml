title: Suspicious Clipboard Data Activity Indicator 174
id: c53202e3-71ff-31f4-8acc-deabcb217344
status: experimental
description: Detects process or activity patterns associated with Clipboard Data (T1115).
references:
  - https://attack.mitre.org/techniques/T1115/
author: DetectionForge
date: 2024/10/15
modified: 2025/04/01
tags:
  - attack.collection
  - attack.t1115
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clipboard'
      - 'suspicious_pattern_174'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving clipboard data
  - Security tools and monitoring agents performing similar actions
level: medium
