title: Data from Local System Suspicious Activity Pattern 1627
id: 4972f080-af37-45cc-640a-30178da6ef74
status: experimental
description: Detects process or registry activity patterns associated with Data from Local System (T1005).
references:
  - https://attack.mitre.org/techniques/T1005/
author: DetectionForge
date: 2024/08/15
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'data'
      - 'bulk_pattern_1627'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving data from local system
  - Security tools, monitoring agents, and authorized assessments
level: medium
