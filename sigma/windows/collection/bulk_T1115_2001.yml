title: Clipboard Data Suspicious Activity Pattern 2001
id: 151143de-b2e9-4d6b-c233-14c3a14aff58
status: experimental
description: Detects process or registry activity patterns associated with Clipboard Data (T1115).
references:
  - https://attack.mitre.org/techniques/T1115/
author: DetectionForge
date: 2025/08/24
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1115
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clipboard'
      - 'bulk_pattern_2001'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clipboard data
  - Security tools, monitoring agents, and authorized assessments
level: medium
