title: Suspicious Keylogging Activity Indicator 113
id: e83688fc-d196-b5e5-2df5-522468c7608c
status: experimental
description: Detects process or activity patterns associated with Keylogging (T1056.001).
references:
  - https://attack.mitre.org/techniques/T1056/001/
author: DetectionForge
date: 2024/08/15
modified: 2025/04/01
tags:
  - attack.collection
  - attack.t1056.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'keylogging'
      - 'suspicious_pattern_113'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving keylogging
  - Security tools and monitoring agents performing similar actions
level: medium
