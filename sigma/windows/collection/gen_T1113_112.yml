title: Suspicious Screen Capture Activity Indicator 112
id: 07244219-2048-2907-0dae-534d52a5663c
status: experimental
description: Detects process or activity patterns associated with Screen Capture (T1113).
references:
  - https://attack.mitre.org/techniques/T1113/
author: DetectionForge
date: 2024/08/14
modified: 2025/04/01
tags:
  - attack.collection
  - attack.t1113
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'screen'
      - 'suspicious_pattern_112'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving screen capture
  - Security tools and monitoring agents performing similar actions
level: medium
