title: Archive via Utility Suspicious Activity Pattern 1752
id: 288cec69-b678-49fa-685b-afa31197e06c
status: experimental
description: Detects process or registry activity patterns associated with Archive via Utility (T1560.001).
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: DetectionForge
date: 2024/12/18
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'archive'
      - 'bulk_pattern_1752'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving archive via utility
  - Security tools, monitoring agents, and authorized assessments
level: medium
