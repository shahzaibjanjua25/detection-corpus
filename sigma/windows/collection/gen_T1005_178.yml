title: Suspicious Data from Local System Activity Indicator 178
id: 92d3afb5-d4d5-a3b3-8a30-a01c497e3c4a
status: experimental
description: Detects process or activity patterns associated with Data from Local System (T1005).
references:
  - https://attack.mitre.org/techniques/T1005/
author: DetectionForge
date: 2024/10/19
modified: 2025/04/01
tags:
  - attack.collection
  - attack.t1005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'data'
      - 'suspicious_pattern_178'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving data from local system
  - Security tools and monitoring agents performing similar actions
level: medium
