title: Clipboard Data Suspicious Activity Pattern 1371
id: 08ff0371-292c-472f-1af7-bf0e74faada8
status: experimental
description: Detects process or registry activity patterns associated with Clipboard Data (T1115).
references:
  - https://attack.mitre.org/techniques/T1115/
author: DetectionForge
date: 2025/11/02
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1115
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'clipboard'
      - 'bulk_pattern_1371'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving clipboard data
  - Security tools, monitoring agents, and authorized assessments
level: medium
