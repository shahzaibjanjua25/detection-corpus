title: Keylogger Tool Indicators
id: 1bb57f60-6fb5-25d1-7cc9-bc3a3b9997fe
status: stable
description: Detects common keylogger related strings and tools
references:
  - https://attack.mitre.org/techniques/T1056/001/
author: DetectionForge
date: 2024/03/05
modified: 2025/03/01
tags:
  - attack.collection
  - attack.t1056.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'GetAsyncKeyState'
      - 'SetWindowsHookEx'
      - 'keylogger'
      - 'logkeys'
  condition: selection
falsepositives:
  - Security research
  - Parental control software
level: medium
