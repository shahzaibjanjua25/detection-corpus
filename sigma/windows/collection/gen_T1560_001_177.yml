title: Suspicious Archive via Utility Activity Indicator 177
id: 177e9551-eca1-bb2f-cfa2-326463aed6a0
status: experimental
description: Detects process or activity patterns associated with Archive via Utility (T1560.001).
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: DetectionForge
date: 2024/10/18
modified: 2025/04/01
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'archive'
      - 'suspicious_pattern_177'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving archive via utility
  - Security tools and monitoring agents performing similar actions
level: medium
