title: Suspicious Screen Capture Activity Indicator 049
id: ade823d3-cb09-cb83-f4aa-036e05b74879
status: experimental
description: Detects process or activity patterns associated with Screen Capture (T1113).
references:
  - https://attack.mitre.org/techniques/T1113/
author: DetectionForge
date: 2024/06/12
modified: 2025/04/01
tags:
  - attack.collection
  - attack.t1113
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'screen'
      - 'suspicious_pattern_49'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving screen capture
  - Security tools and monitoring agents performing similar actions
level: medium
