title: Data from Network Shared Drive Suspicious Activity Pattern 2069
id: fbd3427d-bce3-4f23-b387-126cc7a0666e
status: experimental
description: Detects process or registry activity patterns associated with Data from Network Shared Drive (T1039).
references:
  - https://attack.mitre.org/techniques/T1039/
author: DetectionForge
date: 2025/10/31
modified: 2025/06/01
tags:
  - attack.collection
  - attack.t1039
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'data'
      - 'bulk_pattern_2069'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving data from network shared drive
  - Security tools, monitoring agents, and authorized assessments
level: medium
