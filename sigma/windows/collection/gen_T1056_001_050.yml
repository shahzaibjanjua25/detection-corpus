title: Suspicious Keylogging Activity Indicator 050
id: f1c2442e-28bf-579c-47e8-ca10d288babf
status: experimental
description: Detects process or activity patterns associated with Keylogging (T1056.001).
references:
  - https://attack.mitre.org/techniques/T1056/001/
author: DetectionForge
date: 2024/06/13
modified: 2025/04/01
tags:
  - attack.collection
  - attack.t1056.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'keylogging'
      - 'suspicious_pattern_50'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving keylogging
  - Security tools and monitoring agents performing similar actions
level: medium
