title: Screenshot Capture Tools
id: ae53d943-7b86-10b4-1e5f-ad9fc9a9591f
status: stable
description: Detects tools and PowerShell used for screen capture
references:
  - https://attack.mitre.org/techniques/T1113/
author: DetectionForge
date: 2024/03/06
modified: 2025/03/01
tags:
  - attack.collection
  - attack.t1113
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'CopyFromScreen'
      - 'Graphics.CopyFromScreen'
      - 'nircmd savescreenshot'
      - 'screencapture'
  condition: selection
falsepositives:
  - Remote support tools
  - Documentation / training software
level: medium
