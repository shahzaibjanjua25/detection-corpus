title: Archive Activity Indicator 3194
id: 491fe61d-c3ef-4c9f-a7ad-4dff14803d92
status: experimental
description: Detects activity patterns associated with Archive (T1560.001).
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: DetectionForge
date: 2024/08/13
modified: 2025/07/01
tags:
  - attack.collection
  - attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'archive'
      - 'fast_3194'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving archive
  - Security tools and monitoring agents
level: medium
