title: Suspicious PowerShell Activity Indicator 000
id: 4a213a1c-9e3e-5c59-3e6e-850104f02a61
status: experimental
description: Detects process or activity patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/04/24
modified: 2025/04/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'suspicious_pattern_0'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving powershell
  - Security tools and monitoring agents performing similar actions
level: medium
