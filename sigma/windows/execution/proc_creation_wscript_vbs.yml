title: Wscript / Cscript Suspicious Script
id: 555ab61d-084e-9e29-46ef-1de3a5170a55
status: stable
description: Detects wscript/cscript executing scripts from unusual locations
references:
  - https://attack.mitre.org/techniques/T1059/005/
author: DetectionForge
date: 2024/02/01
modified: 2025/03/01
tags:
  - attack.execution
  - attack.t1059.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
    CommandLine|contains:
      - '.vbs'
      - '.js'
      - '\Temp\'
      - '\AppData\'
  condition: selection
falsepositives:
  - Legacy business applications
  - Software installers using VBScript
level: medium
