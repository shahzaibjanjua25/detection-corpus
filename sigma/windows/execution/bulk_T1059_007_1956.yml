title: JavaScript Suspicious Activity Pattern 1956
id: dd607b5f-809a-4306-8a5a-1fa122db5ab6
status: experimental
description: Detects process or registry activity patterns associated with JavaScript (T1059.007).
references:
  - https://attack.mitre.org/techniques/T1059/007/
author: DetectionForge
date: 2025/07/10
modified: 2025/06/01
tags:
  - attack.execution
  - attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'javascript'
      - 'bulk_pattern_1956'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving javascript
  - Security tools, monitoring agents, and authorized assessments
level: medium
