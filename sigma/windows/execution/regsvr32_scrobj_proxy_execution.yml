title: Regsvr32 Scrobj Proxy Execution
id: dbcf1ea6-80d3-977c-67b5-13dc0055bf6b
status: stable
description: Detects regsvr32 used with scrobj.dll for scriptlet execution
references:
  - https://attack.mitre.org/techniques/T1218/010/
author: DetectionForge
date: 2024/01/27
modified: 2025/03/01
tags:
  - attack.execution
  - attack.t1218.010
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains:
      - 'scrobj'
      - '.sct'
  condition: selection
falsepositives:
  - Legitimate COM registration in rare cases
  - Software installers
level: medium
