title: Windows Command Shell Suspicious Activity Pattern 1954
id: 6546e279-8e55-47d5-1dde-2418dc1bcf32
status: experimental
description: Detects process or registry activity patterns associated with Windows Command Shell (T1059.003).
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2025/07/08
modified: 2025/06/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'bulk_pattern_1954'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving windows command shell
  - Security tools, monitoring agents, and authorized assessments
level: medium
