title: Cmd Activity Indicator 3201
id: d064e00c-d528-4854-a830-cbef0affa6bd
status: experimental
description: Detects activity patterns associated with Cmd (T1059.003).
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2024/08/20
modified: 2025/07/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmd'
      - 'fast_3201'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving cmd
  - Security tools and monitoring agents
level: medium
