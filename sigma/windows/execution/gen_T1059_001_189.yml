title: Suspicious PowerShell Activity Indicator 189
id: 593f28d8-fc5d-061c-1ea2-2f902af3a804
status: experimental
description: Detects process or activity patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/10/30
modified: 2025/04/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'suspicious_pattern_189'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving powershell
  - Security tools and monitoring agents performing similar actions
level: medium
