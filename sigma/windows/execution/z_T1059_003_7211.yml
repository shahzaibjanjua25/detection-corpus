title: Cmd Indicator 7211
id: 21d8ea10-1ac8-4fb2-a788-8b667d24bb06
status: experimental
description: Detects patterns associated with Cmd (T1059.003).
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2024/04/12
modified: 2025/09/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmd'
      - 'z_7211'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for cmd
  - Security and monitoring tools
level: medium
