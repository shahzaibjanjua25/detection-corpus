title: Visual Basic Suspicious Activity Pattern 1955
id: 52310ef9-867f-472b-39b6-15e7f1bf1d3d
status: experimental
description: Detects process or registry activity patterns associated with Visual Basic (T1059.005).
references:
  - https://attack.mitre.org/techniques/T1059/005/
author: DetectionForge
date: 2025/07/09
modified: 2025/06/01
tags:
  - attack.execution
  - attack.t1059.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'visual'
      - 'bulk_pattern_1955'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving visual basic
  - Security tools, monitoring agents, and authorized assessments
level: medium
