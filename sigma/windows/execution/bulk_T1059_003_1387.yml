title: Windows Command Shell Suspicious Activity Pattern 1387
id: dd6ddae5-6466-4304-c127-0104fb8f628a
status: experimental
description: Detects process or registry activity patterns associated with Windows Command Shell (T1059.003).
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2025/11/18
modified: 2025/06/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'bulk_pattern_1387'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving windows command shell
  - Security tools, monitoring agents, and authorized assessments
level: medium
