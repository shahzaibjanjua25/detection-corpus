title: PowerShell Activity Indicator 3800
id: f95d3b45-a45b-43fd-a63d-9b1d762f6039
status: experimental
description: Detects activity patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/08/19
modified: 2025/07/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'fast_3800'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving powershell
  - Security tools and monitoring agents
level: medium
