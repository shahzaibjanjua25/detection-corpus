title: Windows Command Shell Suspicious Activity Pattern 1009
id: 558ff30b-4187-43fe-1290-3fec19f10df0
status: experimental
description: Detects process or registry activity patterns associated with Windows Command Shell (T1059.003).
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2024/11/05
modified: 2025/06/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'bulk_pattern_1009'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving windows command shell
  - Security tools, monitoring agents, and authorized assessments
level: medium
