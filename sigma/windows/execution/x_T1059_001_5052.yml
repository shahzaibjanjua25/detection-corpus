title: PowerShell Pattern 5052
id: 105e330e-c30e-423a-ab19-eec0fa6cdeac
status: experimental
description: Detects patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/04/22
modified: 2025/08/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'x_5052'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for powershell
  - Security and monitoring tools
level: medium
