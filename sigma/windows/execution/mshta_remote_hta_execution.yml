title: Mshta Remote HTA Execution
id: bec6e55f-6a1e-7688-df24-99bb5dbbaaa3
status: stable
description: Detects mshta.exe loading remote HTA/JS content
references:
  - https://attack.mitre.org/techniques/T1218/005/
author: DetectionForge
date: 2024/01/26
modified: 2025/03/01
tags:
  - attack.execution
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
  condition: selection
falsepositives:
  - Legacy internal tools still using HTA
  - Rare enterprise apps
level: medium
