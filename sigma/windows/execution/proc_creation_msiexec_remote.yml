title: Msiexec Remote Package Execution
id: 040ff7d9-19fa-40fa-dbff-3430db674343
status: stable
description: Detects msiexec installing from remote HTTP/HTTPS sources
references:
  - https://attack.mitre.org/techniques/T1218/007/
author: DetectionForge
date: 2024/01/31
modified: 2025/03/01
tags:
  - attack.execution
  - attack.t1218.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\msiexec.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - '/i'
  condition: selection
falsepositives:
  - Legitimate software deployment via HTTP
  - Update mechanisms
level: medium
