title: Suspicious JavaScript Activity Indicator 003
id: 0e03a132-a710-590f-fbe6-583e6ec6c7a9
status: experimental
description: Detects process or activity patterns associated with JavaScript (T1059.007).
references:
  - https://attack.mitre.org/techniques/T1059/007/
author: DetectionForge
date: 2024/04/27
modified: 2025/04/01
tags:
  - attack.execution
  - attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'javascript'
      - 'suspicious_pattern_3'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving javascript
  - Security tools and monitoring agents performing similar actions
level: medium
