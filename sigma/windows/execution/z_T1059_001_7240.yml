title: PowerShell Indicator 7240
id: 1a191ab0-7407-47bc-aade-81f26d242380
status: experimental
description: Detects patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/05/11
modified: 2025/09/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'z_7240'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for powershell
  - Security and monitoring tools
level: medium
