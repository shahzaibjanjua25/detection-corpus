title: Certutil Download of Remote File
id: b8c9d0e1-f2a3-4567-1234-678901234567
status: stable
description: Detects certutil.exe used to download a file from a remote URL, a living-off-the-land binary technique frequently observed in malware droppers.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: DetectionForge
date: 2024/03/08
modified: 2025/02/05
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - 'urlcache'
      - ' -split '
      - ' -f '
      - 'http://'
      - 'https://'
  filter_microsoft_update:
    CommandLine|contains: 'microsoft.com'
  condition: selection and not filter_microsoft_update
falsepositives:
  - Administrators using certutil to retrieve certificate revocation lists or root certificates
  - Software update mechanisms that legitimately invoke certutil
level: high
