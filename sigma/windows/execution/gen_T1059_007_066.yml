title: Suspicious JavaScript Activity Indicator 066
id: 6b410f58-0c51-0f54-c4eb-56547b4ffa1d
status: experimental
description: Detects process or activity patterns associated with JavaScript (T1059.007).
references:
  - https://attack.mitre.org/techniques/T1059/007/
author: DetectionForge
date: 2024/06/29
modified: 2025/04/01
tags:
  - attack.execution
  - attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'javascript'
      - 'suspicious_pattern_66'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving javascript
  - Security tools and monitoring agents performing similar actions
level: medium
