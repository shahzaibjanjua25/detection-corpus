title: Suspicious Visual Basic Activity Indicator 191
id: 09ff8d20-1052-4508-1c59-7f92e6663a28
status: experimental
description: Detects process or activity patterns associated with Visual Basic (T1059.005).
references:
  - https://attack.mitre.org/techniques/T1059/005/
author: DetectionForge
date: 2024/11/01
modified: 2025/04/01
tags:
  - attack.execution
  - attack.t1059.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'visual'
      - 'suspicious_pattern_191'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving visual basic
  - Security tools and monitoring agents performing similar actions
level: medium
