title: PowerShell Suspicious Activity Pattern 1764
id: 32aca442-fa7d-45bd-1ec6-ea53aefa6882
status: experimental
description: Detects process or registry activity patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/12/30
modified: 2025/06/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'bulk_pattern_1764'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving powershell
  - Security tools, monitoring agents, and authorized assessments
level: medium
