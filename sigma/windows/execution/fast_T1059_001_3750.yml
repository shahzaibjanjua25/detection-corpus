title: PowerShell Activity Indicator 3750
id: ccf52b1e-2cf9-4723-ad4e-44a7aae0019b
status: experimental
description: Detects activity patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/06/30
modified: 2025/07/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'fast_3750'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving powershell
  - Security tools and monitoring agents
level: medium
