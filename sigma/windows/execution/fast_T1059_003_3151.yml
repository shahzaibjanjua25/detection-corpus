title: Cmd Activity Indicator 3151
id: e89472b5-defc-48cd-a3cc-8f2033b9044f
status: experimental
description: Detects activity patterns associated with Cmd (T1059.003).
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2024/07/01
modified: 2025/07/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmd'
      - 'fast_3151'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving cmd
  - Security tools and monitoring agents
level: medium
