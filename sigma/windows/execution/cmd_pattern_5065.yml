title: Cmd Pattern 5065
id: 5ef492fc-c554-4f04-a81d-00b79e3e16b6
status: experimental
description: Detects patterns associated with Cmd (T1059.003).
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2024/05/05
modified: 2025/08/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmd'
      - 'x_5065'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for cmd
  - Security and monitoring tools
level: medium
