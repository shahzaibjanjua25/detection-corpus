title: Suspicious Visual Basic Activity Indicator 128
id: 19e15f5e-32ca-7ce3-4de5-ac568f117c21
status: experimental
description: Detects process or activity patterns associated with Visual Basic (T1059.005).
references:
  - https://attack.mitre.org/techniques/T1059/005/
author: DetectionForge
date: 2024/08/30
modified: 2025/04/01
tags:
  - attack.execution
  - attack.t1059.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'visual'
      - 'suspicious_pattern_128'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving visual basic
  - Security tools and monitoring agents performing similar actions
level: medium
