title: JavaScript Suspicious Activity Pattern 1641
id: fee4230e-00a7-4439-617d-9ff14f5d0243
status: experimental
description: Detects process or registry activity patterns associated with JavaScript (T1059.007).
references:
  - https://attack.mitre.org/techniques/T1059/007/
author: DetectionForge
date: 2024/08/29
modified: 2025/06/01
tags:
  - attack.execution
  - attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'javascript'
      - 'bulk_pattern_1641'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving javascript
  - Security tools, monitoring agents, and authorized assessments
level: medium
