title: Cmd Echo Pipe to Execute
id: 6325b485-5db2-d73d-01e5-950ccfd292e6
status: stable
description: Detects cmd.exe using echo and pipe to execute content
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2024/01/25
modified: 2025/03/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmd.exe'
    CommandLine|contains|all:
      - 'echo'
      - '|'
  condition: selection
falsepositives:
  - Legacy batch scripts
  - Some installers
level: medium
