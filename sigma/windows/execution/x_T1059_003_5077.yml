title: Cmd Pattern 5077
id: 6f079f7f-d753-483d-abca-1ae7c2b3dc8c
status: experimental
description: Detects patterns associated with Cmd (T1059.003).
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2024/05/17
modified: 2025/08/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmd'
      - 'x_5077'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for cmd
  - Security and monitoring tools
level: medium
