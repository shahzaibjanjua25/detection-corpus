title: PowerShell Indicator 7140
id: 2a0bc912-2b42-48de-a10c-72677dd34bb1
status: experimental
description: Detects patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2025/03/07
modified: 2025/09/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'z_7140'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for powershell
  - Security and monitoring tools
level: medium
