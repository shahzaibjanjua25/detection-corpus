title: PowerShell Download Cradle
id: da6d739e-b548-a7d7-b1b7-b10bf9792de0
status: stable
description: Detects common PowerShell download-and-execute cradles
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/01/23
modified: 2025/03/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'DownloadString'
      - 'DownloadFile'
      - 'IEX'
      - 'Invoke-Expression'
  condition: selection
falsepositives:
  - Software deployment scripts
  - Configuration management tools
level: medium
