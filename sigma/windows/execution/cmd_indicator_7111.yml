title: Cmd Indicator 7111
id: 42b9aff9-9c17-462f-ac73-c70f95fac08c
status: experimental
description: Detects patterns associated with Cmd (T1059.003).
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2025/02/06
modified: 2025/09/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmd'
      - 'z_7111'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for cmd
  - Security and monitoring tools
level: medium
