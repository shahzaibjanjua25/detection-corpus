title: JavaScript Suspicious Activity Pattern 1893
id: 5cd96d52-57c6-48b2-fad6-e9057e403e98
status: experimental
description: Detects process or registry activity patterns associated with JavaScript (T1059.007).
references:
  - https://attack.mitre.org/techniques/T1059/007/
author: DetectionForge
date: 2025/05/08
modified: 2025/06/01
tags:
  - attack.execution
  - attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'javascript'
      - 'bulk_pattern_1893'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving javascript
  - Security tools, monitoring agents, and authorized assessments
level: medium
