title: CMSTP INF Proxy Execution
id: db48e8e4-029b-4827-0fc5-72973177ad4b
status: stable
description: Detects cmstp.exe used with INF files for proxy execution
references:
  - https://attack.mitre.org/techniques/T1218/003/
author: DetectionForge
date: 2024/01/29
modified: 2025/03/01
tags:
  - attack.execution
  - attack.t1218.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmstp.exe'
    CommandLine|contains:
      - '.inf'
      - '/s'
  condition: selection
falsepositives:
  - Legitimate connection manager profiles
  - VPN client installers
level: medium
