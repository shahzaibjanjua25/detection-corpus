title: PowerShell Pattern 5100
id: c6987103-68c5-46e5-acf6-f23792b4ae54
status: experimental
description: Detects patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/06/09
modified: 2025/08/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'x_5100'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for powershell
  - Security and monitoring tools
level: medium
