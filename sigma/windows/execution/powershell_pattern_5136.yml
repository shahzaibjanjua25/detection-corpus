title: PowerShell Pattern 5136
id: d485ec6a-a7a0-49dd-a53d-ea7163dcba6e
status: experimental
description: Detects patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/07/15
modified: 2025/08/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'x_5136'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for powershell
  - Security and monitoring tools
level: medium
