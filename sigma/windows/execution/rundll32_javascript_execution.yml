title: Rundll32 JavaScript Execution
id: b54ef640-ea2d-2c5d-3ff3-deda0eb6d781
status: stable
description: Detects rundll32 executing JavaScript content
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: DetectionForge
date: 2024/01/28
modified: 2025/03/01
tags:
  - attack.execution
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
  condition: selection
falsepositives:
  - Very rare legitimate use
  - Some accessibility helpers
level: medium
