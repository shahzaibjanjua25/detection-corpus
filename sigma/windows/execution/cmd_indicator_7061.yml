title: Cmd Indicator 7061
id: 26a6d952-2b97-41d9-a6bf-f2c124755e3a
status: experimental
description: Detects patterns associated with Cmd (T1059.003).
references:
  - https://attack.mitre.org/techniques/T1059/003/
author: DetectionForge
date: 2024/12/18
modified: 2025/09/01
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cmd'
      - 'z_7061'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for cmd
  - Security and monitoring tools
level: medium
