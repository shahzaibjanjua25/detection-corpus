title: JavaScript Suspicious Activity Pattern 2145
id: cf483f87-4507-4de1-1d2c-60a00cefb77e
status: experimental
description: Detects process or registry activity patterns associated with JavaScript (T1059.007).
references:
  - https://attack.mitre.org/techniques/T1059/007/
author: DetectionForge
date: 2024/02/15
modified: 2025/06/01
tags:
  - attack.execution
  - attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'javascript'
      - 'bulk_pattern_2145'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving javascript
  - Security tools, monitoring agents, and authorized assessments
level: medium
