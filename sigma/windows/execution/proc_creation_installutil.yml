title: InstallUtil Proxy Execution
id: 72036680-6a4f-1633-5020-7d6c53404ae1
status: stable
description: Detects InstallUtil.exe used to execute assemblies
references:
  - https://attack.mitre.org/techniques/T1218/004/
author: DetectionForge
date: 2024/01/30
modified: 2025/03/01
tags:
  - attack.execution
  - attack.t1218.004
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\InstallUtil.exe'
    CommandLine|contains:
      - '/logfile='
      - '/LogToConsole=false'
  condition: selection
falsepositives:
  - Legitimate .NET installation tasks
  - Developer tooling
level: medium
