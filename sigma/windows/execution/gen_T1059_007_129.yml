title: Suspicious JavaScript Activity Indicator 129
id: 4a9b2c62-af85-a6fa-e331-455713493cd8
status: experimental
description: Detects process or activity patterns associated with JavaScript (T1059.007).
references:
  - https://attack.mitre.org/techniques/T1059/007/
author: DetectionForge
date: 2024/08/31
modified: 2025/04/01
tags:
  - attack.execution
  - attack.t1059.007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'javascript'
      - 'suspicious_pattern_129'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving javascript
  - Security tools and monitoring agents performing similar actions
level: medium
