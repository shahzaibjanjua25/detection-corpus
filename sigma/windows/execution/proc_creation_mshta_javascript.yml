title: Mshta JavaScript or VBScript Execution
id: f6a7b8c9-d0e1-2345-f012-456789012345
status: stable
description: Detects mshta.exe executing JavaScript or VBScript content, a living-off-the-land technique frequently used to proxy execution of malicious code.
references:
  - https://attack.mitre.org/techniques/T1218/005/
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
author: DetectionForge
date: 2024/03/01
modified: 2025/02/12
tags:
  - attack.execution
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
      - '.hta'
      - 'http://'
      - 'https://'
  filter_legitimate_hta:
    CommandLine|contains:
      - 'C:\Windows\System32'
      - 'C:\Program Files'
  condition: selection and not filter_legitimate_hta
falsepositives:
  - Legacy enterprise applications that still ship .hta help or configuration interfaces
  - Software installers that temporarily use mshta for custom actions
level: high
