title: Suspicious PowerShell Activity Indicator 126
id: 0281a532-c5cf-d065-9a69-955d3616e730
status: experimental
description: Detects process or activity patterns associated with PowerShell (T1059.001).
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: DetectionForge
date: 2024/08/28
modified: 2025/04/01
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'powershell'
      - 'suspicious_pattern_126'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving powershell
  - Security tools and monitoring agents performing similar actions
level: medium
