title: Suspicious Scheduled Task Activity Indicator 076
id: c638feed-395e-af6a-dcd3-d4c109ac97d7
status: experimental
description: Detects process or activity patterns associated with Scheduled Task (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2024/07/09
modified: 2025/04/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'scheduled'
      - 'suspicious_pattern_76'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving scheduled task
  - Security tools and monitoring agents performing similar actions
level: medium
