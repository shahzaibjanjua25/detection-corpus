title: Windows Service Suspicious Activity Pattern 1400
id: 73a979e7-80a2-41ff-ffd6-76a772ff665d
status: experimental
description: Detects process or registry activity patterns associated with Windows Service (T1543.003).
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: DetectionForge
date: 2024/01/01
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'bulk_pattern_1400'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving windows service
  - Security tools, monitoring agents, and authorized assessments
level: medium
