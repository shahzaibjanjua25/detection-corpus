title: SchTask Pattern 5081
id: f51b08fc-a12e-410e-a799-cd39d1529e50
status: experimental
description: Detects patterns associated with SchTask (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2024/05/21
modified: 2025/08/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'schtask'
      - 'x_5081'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for schtask
  - Security and monitoring tools
level: medium
