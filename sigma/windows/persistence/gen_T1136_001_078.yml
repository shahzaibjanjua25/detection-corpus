title: Suspicious Local Account Activity Indicator 078
id: 7595652e-c8e2-a6c3-5f7e-256d1f27a34d
status: experimental
description: Detects process or activity patterns associated with Local Account (T1136.001).
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: DetectionForge
date: 2024/07/11
modified: 2025/04/01
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'suspicious_pattern_78'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving local account
  - Security tools and monitoring agents performing similar actions
level: medium
