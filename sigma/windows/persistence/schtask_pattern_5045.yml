title: SchTask Pattern 5045
id: 4c21ff8c-b831-4863-aaac-45142c50dd3f
status: experimental
description: Detects patterns associated with SchTask (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2024/04/15
modified: 2025/08/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'schtask'
      - 'x_5045'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for schtask
  - Security and monitoring tools
level: medium
