title: Shortcut Modification Suspicious Activity Pattern 1650
id: 91eecc88-23ca-428e-7631-549cfa700aab
status: experimental
description: Detects process or registry activity patterns associated with Shortcut Modification (T1547.009).
references:
  - https://attack.mitre.org/techniques/T1547/009/
author: DetectionForge
date: 2024/09/07
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1547.009
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'shortcut'
      - 'bulk_pattern_1650'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving shortcut modification
  - Security tools, monitoring agents, and authorized assessments
level: medium
