title: SchTask Activity Indicator 3331
id: e6bad55e-f696-4d4d-aa5b-3a1b09b8f5be
status: experimental
description: Detects activity patterns associated with SchTask (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2024/12/28
modified: 2025/07/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'schtask'
      - 'fast_3331'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving schtask
  - Security tools and monitoring agents
level: medium
