title: AT Command Job Creation
id: afbece11-c94a-d045-f3f0-b66f68d4d520
status: stable
description: Detects use of the legacy at.exe command for job scheduling
references:
  - https://attack.mitre.org/techniques/T1053/002/
author: DetectionForge
date: 2024/02/04
modified: 2025/03/01
tags:
  - attack.persistence
  - attack.t1053.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\at.exe'
    CommandLine|contains:
      - '\\'
      - '/interactive'
  condition: selection
falsepositives:
  - Legacy scripts still using at.exe
  - Some monitoring tools
level: medium
