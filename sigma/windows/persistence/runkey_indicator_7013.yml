title: RunKey Indicator 7013
id: 2673df5e-0db6-4278-a483-7ae59d75cb73
status: experimental
description: Detects patterns associated with RunKey (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2024/10/31
modified: 2025/09/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'runkey'
      - 'z_7013'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for runkey
  - Security and monitoring tools
level: medium
