title: RunKey Indicator 7183
id: b3c4a0d0-067b-432e-a9fb-755e3707f5f3
status: experimental
description: Detects patterns associated with RunKey (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2025/04/19
modified: 2025/09/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'runkey'
      - 'z_7183'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for runkey
  - Security and monitoring tools
level: medium
