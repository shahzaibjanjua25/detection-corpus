title: Service Activity Indicator 3532
id: 12ed00cc-c8b4-4468-a702-d7b6a98ea3a1
status: experimental
description: Detects activity patterns associated with Service (T1543.003).
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: DetectionForge
date: 2025/07/17
modified: 2025/07/01
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'service'
      - 'fast_3532'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving service
  - Security tools and monitoring agents
level: medium
