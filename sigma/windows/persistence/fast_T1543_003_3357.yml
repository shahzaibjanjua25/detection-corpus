title: Service Activity Indicator 3357
id: a2317972-1cec-401c-a67f-af3104a679ff
status: experimental
description: Detects activity patterns associated with Service (T1543.003).
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: DetectionForge
date: 2025/01/23
modified: 2025/07/01
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'service'
      - 'fast_3357'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving service
  - Security tools and monitoring agents
level: medium
