title: Suspicious Windows Service Activity Indicator 203
id: bf695b54-5f3f-8989-3e01-025bd0287229
status: experimental
description: Detects process or activity patterns associated with Windows Service (T1543.003).
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: DetectionForge
date: 2024/11/13
modified: 2025/04/01
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'suspicious_pattern_203'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving windows service
  - Security tools and monitoring agents performing similar actions
level: medium
