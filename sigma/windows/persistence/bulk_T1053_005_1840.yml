title: Scheduled Task Suspicious Activity Pattern 1840
id: 4a4f82dd-238c-4661-531d-e8982f2bd51f
status: experimental
description: Detects process or registry activity patterns associated with Scheduled Task (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2025/03/16
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'scheduled'
      - 'bulk_pattern_1840'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving scheduled task
  - Security tools, monitoring agents, and authorized assessments
level: medium
