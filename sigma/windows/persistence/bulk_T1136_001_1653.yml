title: Local Account Suspicious Activity Pattern 1653
id: 4c27c4cc-4336-4bf1-0fbe-f6f8b184e525
status: experimental
description: Detects process or registry activity patterns associated with Local Account (T1136.001).
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: DetectionForge
date: 2024/09/10
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'bulk_pattern_1653'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving local account
  - Security tools, monitoring agents, and authorized assessments
level: medium
