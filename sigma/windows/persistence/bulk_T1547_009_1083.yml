title: Shortcut Modification Suspicious Activity Pattern 1083
id: 62dae0f7-54df-4be3-d8c6-dc320100a65f
status: experimental
description: Detects process or registry activity patterns associated with Shortcut Modification (T1547.009).
references:
  - https://attack.mitre.org/techniques/T1547/009/
author: DetectionForge
date: 2025/01/18
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1547.009
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'shortcut'
      - 'bulk_pattern_1083'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving shortcut modification
  - Security tools, monitoring agents, and authorized assessments
level: medium
