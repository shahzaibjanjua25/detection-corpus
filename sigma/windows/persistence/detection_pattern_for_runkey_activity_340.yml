title: Detection Pattern for RunKey Activity 340
id: 5624f794-fd13-c488-3d7e-7ad37cae63f1
status: experimental
description: Detects activity patterns associated with RunKey (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2025/05/07
modified: 2025/05/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'runkey'
      - 'pattern_340'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate software and administrative tools using similar command patterns
  - Security products and monitoring agents
level: medium
