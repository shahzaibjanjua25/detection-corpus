title: Suspicious Registry Run Keys Activity Indicator 136
id: 818a4671-8b21-2452-5483-7e6c922ad7c7
status: experimental
description: Detects process or activity patterns associated with Registry Run Keys (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2024/09/07
modified: 2025/04/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'registry'
      - 'suspicious_pattern_136'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving registry run keys
  - Security tools and monitoring agents performing similar actions
level: medium
