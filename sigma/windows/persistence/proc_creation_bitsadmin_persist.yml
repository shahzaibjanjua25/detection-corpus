title: BITS Job Persistence
id: b7542398-fb71-b14c-acae-3196c35cd56f
status: stable
description: Detects bitsadmin creating persistent download jobs
references:
  - https://attack.mitre.org/techniques/T1197/
author: DetectionForge
date: 2024/02/06
modified: 2025/03/01
tags:
  - attack.persistence
  - attack.t1197
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\bitsadmin.exe'
    CommandLine|contains:
      - '/create'
      - '/addfile'
      - '/SetNotifyCmdLine'
  condition: selection
falsepositives:
  - Legitimate background transfer jobs
  - Software updaters
level: medium
