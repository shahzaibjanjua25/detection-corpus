title: Service ImagePath Modification
id: 27ee61e2-2ee4-fb10-6e68-de36717caff7
status: stable
description: Detects modification of service ImagePath to unusual binaries
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: DetectionForge
date: 2024/02/07
modified: 2025/03/01
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains:
      - '\Services\'
      - '\ImagePath'
    Details|contains:
      - '\Temp\'
      - '\AppData\'
      - 'powershell'
  condition: selection
falsepositives:
  - Software updates changing service paths
  - Legitimate service reconfiguration
level: medium
