title: RunKey Activity Indicator 3330
id: 707de92e-f56c-4e11-a1c6-95ce6fa19181
status: experimental
description: Detects activity patterns associated with RunKey (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2024/12/27
modified: 2025/07/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'runkey'
      - 'fast_3330'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving runkey
  - Security tools and monitoring agents
level: medium
