title: RunKey Pattern 5104
id: 6c49ebf1-9fe8-46a5-a706-6971e94471d7
status: experimental
description: Detects patterns associated with RunKey (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2024/06/13
modified: 2025/08/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'runkey'
      - 'x_5104'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for runkey
  - Security and monitoring tools
level: medium
