title: Suspicious Windows Service Activity Indicator 077
id: 9cb5beaa-2275-634d-e710-21e600981bd1
status: experimental
description: Detects process or activity patterns associated with Windows Service (T1543.003).
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: DetectionForge
date: 2024/07/10
modified: 2025/04/01
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'suspicious_pattern_77'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving windows service
  - Security tools and monitoring agents performing similar actions
level: medium
