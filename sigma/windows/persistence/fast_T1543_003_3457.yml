title: Service Activity Indicator 3457
id: 66c4427c-bd08-42c3-a275-5c09ef34533a
status: experimental
description: Detects activity patterns associated with Service (T1543.003).
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: DetectionForge
date: 2025/05/03
modified: 2025/07/01
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'service'
      - 'fast_3457'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving service
  - Security tools and monitoring agents
level: medium
