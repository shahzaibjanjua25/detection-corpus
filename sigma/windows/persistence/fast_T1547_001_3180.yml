title: RunKey Activity Indicator 3180
id: d1dded1c-897d-489f-a80d-759d9f6a137c
status: experimental
description: Detects activity patterns associated with RunKey (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2024/07/30
modified: 2025/07/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'runkey'
      - 'fast_3180'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving runkey
  - Security tools and monitoring agents
level: medium
