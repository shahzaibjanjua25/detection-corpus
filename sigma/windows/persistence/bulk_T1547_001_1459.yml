title: Registry Run Keys Suspicious Activity Pattern 1459
id: 107a9662-8f16-466b-3880-c7c6089f27ee
status: experimental
description: Detects process or registry activity patterns associated with Registry Run Keys (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2024/02/29
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'registry'
      - 'bulk_pattern_1459'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving registry run keys
  - Security tools, monitoring agents, and authorized assessments
level: medium
