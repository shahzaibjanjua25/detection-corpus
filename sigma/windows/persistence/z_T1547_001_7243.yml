title: RunKey Indicator 7243
id: 65aba7ed-f9b8-46c8-a1d8-721ef3b3f695
status: experimental
description: Detects patterns associated with RunKey (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2024/05/14
modified: 2025/09/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'runkey'
      - 'z_7243'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for runkey
  - Security and monitoring tools
level: medium
