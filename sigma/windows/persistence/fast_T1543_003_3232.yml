title: Service Activity Indicator 3232
id: 0f3232e6-93b5-4871-a77c-287988f10f85
status: experimental
description: Detects activity patterns associated with Service (T1543.003).
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: DetectionForge
date: 2024/09/20
modified: 2025/07/01
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'service'
      - 'fast_3232'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving service
  - Security tools and monitoring agents
level: medium
