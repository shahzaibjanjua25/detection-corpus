title: Registry Run Keys Suspicious Activity Pattern 1018
id: 94b5891b-9b39-4f95-1cb1-77fb9fb98b97
status: experimental
description: Detects process or registry activity patterns associated with Registry Run Keys (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2024/11/14
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'registry'
      - 'bulk_pattern_1018'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving registry run keys
  - Security tools, monitoring agents, and authorized assessments
level: medium
