title: SchTask Pattern 5069
id: ae9aa8c3-aa86-4ff4-a08d-345bbd5ddd7f
status: experimental
description: Detects patterns associated with SchTask (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2024/05/09
modified: 2025/08/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'schtask'
      - 'x_5069'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for schtask
  - Security and monitoring tools
level: medium
