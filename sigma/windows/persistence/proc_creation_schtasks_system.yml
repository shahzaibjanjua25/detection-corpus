title: Scheduled Task Created as SYSTEM
id: f3553ada-6bb1-2c3f-1de1-e7d9fba47066
status: stable
description: Detects schtasks creating tasks that run as SYSTEM or with highest privileges
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2024/02/03
modified: 2025/03/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
      - '/ru system'
      - '/rl highest'
      - 'Create'
  condition: selection
falsepositives:
  - Legitimate system maintenance tasks
  - Patch management tools
level: medium
