title: Suspicious Local Account Activity Indicator 141
id: 4f84fd88-6f49-56f1-980f-e0c57cca5db9
status: experimental
description: Detects process or activity patterns associated with Local Account (T1136.001).
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: DetectionForge
date: 2024/09/12
modified: 2025/04/01
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'suspicious_pattern_141'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving local account
  - Security tools and monitoring agents performing similar actions
level: medium
