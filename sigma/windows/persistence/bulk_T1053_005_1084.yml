title: Scheduled Task Suspicious Activity Pattern 1084
id: 838ebc54-e9c0-4d36-de83-0ec0b62d3833
status: experimental
description: Detects process or registry activity patterns associated with Scheduled Task (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2025/01/19
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'scheduled'
      - 'bulk_pattern_1084'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving scheduled task
  - Security tools, monitoring agents, and authorized assessments
level: medium
