title: Winlogon Helper DLL Suspicious Activity Pattern 1271
id: 3145b336-1acb-41c2-83ef-bdcff07b2d92
status: experimental
description: Detects process or registry activity patterns associated with Winlogon Helper DLL (T1547.004).
references:
  - https://attack.mitre.org/techniques/T1547/004/
author: DetectionForge
date: 2025/07/25
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1547.004
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'winlogon'
      - 'bulk_pattern_1271'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving winlogon helper dll
  - Security tools, monitoring agents, and authorized assessments
level: medium
