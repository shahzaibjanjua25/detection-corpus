title: SchTask Pattern 5117
id: 484e4616-3f71-4fa2-afeb-951dc1fe5899
status: experimental
description: Detects patterns associated with SchTask (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2024/06/26
modified: 2025/08/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'schtask'
      - 'x_5117'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for schtask
  - Security and monitoring tools
level: medium
