title: Scheduled Task Suspicious Activity Pattern 1525
id: 77973ea3-218d-4ac6-ba08-f1c55fe98584
status: experimental
description: Detects process or registry activity patterns associated with Scheduled Task (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2024/05/05
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'scheduled'
      - 'bulk_pattern_1525'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving scheduled task
  - Security tools, monitoring agents, and authorized assessments
level: medium
