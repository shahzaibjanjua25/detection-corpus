title: Suspicious Windows Service Activity Indicator 140
id: a32f2abf-9a9e-e18e-9083-55c24ca057b5
status: experimental
description: Detects process or activity patterns associated with Windows Service (T1543.003).
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: DetectionForge
date: 2024/09/11
modified: 2025/04/01
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'suspicious_pattern_140'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving windows service
  - Security tools and monitoring agents performing similar actions
level: medium
