title: Suspicious Shortcut Modification Activity Indicator 012
id: 37576ded-098e-4b94-96f9-1e53f1f15145
status: experimental
description: Detects process or activity patterns associated with Shortcut Modification (T1547.009).
references:
  - https://attack.mitre.org/techniques/T1547/009/
author: DetectionForge
date: 2024/05/06
modified: 2025/04/01
tags:
  - attack.persistence
  - attack.t1547.009
logsource:
  category: file_event
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'shortcut'
      - 'suspicious_pattern_12'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving shortcut modification
  - Security tools and monitoring agents performing similar actions
level: medium
