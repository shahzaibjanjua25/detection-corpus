title: RunKey Pattern 5068
id: 20ebdc7f-c428-4e97-a20d-8b92323e220d
status: experimental
description: Detects patterns associated with RunKey (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2024/05/08
modified: 2025/08/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'runkey'
      - 'x_5068'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for runkey
  - Security and monitoring tools
level: medium
