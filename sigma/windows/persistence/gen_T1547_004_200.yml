title: Suspicious Winlogon Helper Activity Indicator 200
id: bc635b18-9e11-ce3d-5b51-9bb0cec68e17
status: experimental
description: Detects process or activity patterns associated with Winlogon Helper (T1547.004).
references:
  - https://attack.mitre.org/techniques/T1547/004/
author: DetectionForge
date: 2024/11/10
modified: 2025/04/01
tags:
  - attack.persistence
  - attack.t1547.004
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'winlogon'
      - 'suspicious_pattern_200'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving winlogon helper
  - Security tools and monitoring agents performing similar actions
level: medium
