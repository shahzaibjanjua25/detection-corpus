title: Local Account Suspicious Activity Pattern 1842
id: 24a1b0e6-e684-44bd-1103-ce3fa0a4668c
status: experimental
description: Detects process or registry activity patterns associated with Local Account (T1136.001).
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: DetectionForge
date: 2025/03/18
modified: 2025/06/01
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'local'
      - 'bulk_pattern_1842'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving local account
  - Security tools, monitoring agents, and authorized assessments
level: medium
