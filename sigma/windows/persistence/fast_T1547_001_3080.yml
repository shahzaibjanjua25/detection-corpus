title: RunKey Activity Indicator 3080
id: f8a1f9c9-bcdf-4e38-a997-588fe7400b35
status: experimental
description: Detects activity patterns associated with RunKey (T1547.001).
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: DetectionForge
date: 2024/04/21
modified: 2025/07/01
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'runkey'
      - 'fast_3080'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving runkey
  - Security tools and monitoring agents
level: medium
