title: SchTask Activity Indicator 3531
id: 3ec7cdd5-1c05-4607-a844-f133c9464056
status: experimental
description: Detects activity patterns associated with SchTask (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2025/07/16
modified: 2025/07/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'schtask'
      - 'fast_3531'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving schtask
  - Security tools and monitoring agents
level: medium
