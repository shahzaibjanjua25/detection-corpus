title: SchTask Pattern 5093
id: 290177a9-95ab-441e-abd9-c7d065b2d527
status: experimental
description: Detects patterns associated with SchTask (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2024/06/02
modified: 2025/08/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'schtask'
      - 'x_5093'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for schtask
  - Security and monitoring tools
level: medium
