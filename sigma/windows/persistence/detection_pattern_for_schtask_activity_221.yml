title: Detection Pattern for SchTask Activity 221
id: 3c942065-d140-a83e-c714-730e7d5d7b55
status: experimental
description: Detects activity patterns associated with SchTask (T1053.005).
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: DetectionForge
date: 2025/01/08
modified: 2025/05/01
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'schtask'
      - 'pattern_221'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate software and administrative tools using similar command patterns
  - Security products and monitoring agents
level: medium
