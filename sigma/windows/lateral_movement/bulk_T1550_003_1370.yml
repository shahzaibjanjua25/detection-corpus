title: Pass the Ticket Suspicious Activity Pattern 1370
id: 2b281917-ae84-42b7-a6a5-24c52114e20b
status: experimental
description: Detects process or registry activity patterns associated with Pass the Ticket (T1550.003).
references:
  - https://attack.mitre.org/techniques/T1550/003/
author: DetectionForge
date: 2025/11/01
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1550.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'pass'
      - 'bulk_pattern_1370'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving pass the ticket
  - Security tools, monitoring agents, and authorized assessments
level: medium
