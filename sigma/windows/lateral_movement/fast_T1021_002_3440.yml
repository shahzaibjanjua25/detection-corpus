title: SMB Activity Indicator 3440
id: cd6afb08-da33-4bcc-a1d1-db8bb09ec6da
status: experimental
description: Detects activity patterns associated with SMB (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2025/04/16
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'fast_3440'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving smb
  - Security tools and monitoring agents
level: medium
