title: Remote Desktop Protocol Suspicious Activity Pattern 1364
id: a5b412cb-2627-49ab-73ac-0061a014b0d8
status: experimental
description: Detects process or registry activity patterns associated with Remote Desktop Protocol (T1021.001).
references:
  - https://attack.mitre.org/techniques/T1021/001/
author: DetectionForge
date: 2025/10/26
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'remote'
      - 'bulk_pattern_1364'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving remote desktop protocol
  - Security tools, monitoring agents, and authorized assessments
level: medium
