title: Windows Remote Management Suspicious Activity Pattern 1556
id: 29e32f69-e8cb-45e4-a475-2c0b3ad1d2f0
status: experimental
description: Detects process or registry activity patterns associated with Windows Remote Management (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2024/06/05
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'bulk_pattern_1556'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving windows remote management
  - Security tools, monitoring agents, and authorized assessments
level: medium
