title: Suspicious Pass the Ticket Activity Indicator 173
id: f04e9a5e-acac-62ef-8129-8795dd2e6a57
status: experimental
description: Detects process or activity patterns associated with Pass the Ticket (T1550.003).
references:
  - https://attack.mitre.org/techniques/T1550/003/
author: DetectionForge
date: 2024/10/14
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1550.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'pass'
      - 'suspicious_pattern_173'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving pass the ticket
  - Security tools and monitoring agents performing similar actions
level: medium
