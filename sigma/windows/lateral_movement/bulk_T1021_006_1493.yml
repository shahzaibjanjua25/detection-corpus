title: Windows Remote Management Suspicious Activity Pattern 1493
id: 7e3c7434-964b-4c59-b4e3-e4a3ff72492d
status: experimental
description: Detects process or registry activity patterns associated with Windows Remote Management (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2024/04/03
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'bulk_pattern_1493'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving windows remote management
  - Security tools, monitoring agents, and authorized assessments
level: medium
