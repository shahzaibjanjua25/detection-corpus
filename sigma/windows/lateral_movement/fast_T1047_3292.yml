title: WMI Activity Indicator 3292
id: cd389826-d2b1-4d3c-a4f8-b68c55e23736
status: experimental
description: Detects activity patterns associated with WMI (T1047).
references:
  - https://attack.mitre.org/techniques/T1047/
author: DetectionForge
date: 2024/11/19
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'wmi'
      - 'fast_3292'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving wmi
  - Security tools and monitoring agents
level: medium
