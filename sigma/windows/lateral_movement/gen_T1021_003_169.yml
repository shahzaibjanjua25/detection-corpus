title: Suspicious Distributed Component Object Model Activity Indicator 169
id: 2560a625-3d50-8453-d534-30d27d028daf
status: experimental
description: Detects process or activity patterns associated with Distributed Component Object Model (T1021.003).
references:
  - https://attack.mitre.org/techniques/T1021/003/
author: DetectionForge
date: 2024/10/10
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1021.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'distributed'
      - 'suspicious_pattern_169'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving distributed component object model
  - Security tools and monitoring agents performing similar actions
level: medium
