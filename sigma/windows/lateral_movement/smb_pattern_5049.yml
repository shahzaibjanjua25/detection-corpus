title: SMB Pattern 5049
id: a0fa12d4-0ba4-464b-a436-630ddac679d3
status: experimental
description: Detects patterns associated with SMB (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2024/04/19
modified: 2025/08/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'x_5049'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for smb
  - Security and monitoring tools
level: medium
