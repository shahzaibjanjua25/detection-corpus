title: Suspicious Windows Remote Management Activity Indicator 107
id: abdf0b58-2257-bb0d-1e4a-4b9ab8b0088b
status: experimental
description: Detects process or activity patterns associated with Windows Remote Management (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2024/08/09
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'suspicious_pattern_107'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving windows remote management
  - Security tools and monitoring agents performing similar actions
level: medium
