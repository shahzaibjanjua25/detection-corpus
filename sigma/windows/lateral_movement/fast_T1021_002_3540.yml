title: SMB Activity Indicator 3540
id: 189b10a6-d51b-4b5c-a550-0f1e86d460b7
status: experimental
description: Detects activity patterns associated with SMB (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2025/07/25
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'fast_3540'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving smb
  - Security tools and monitoring agents
level: medium
