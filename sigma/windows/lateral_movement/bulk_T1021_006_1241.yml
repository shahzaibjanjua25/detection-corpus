title: Windows Remote Management Suspicious Activity Pattern 1241
id: b1181e30-0828-454f-eb9a-3f34c7095dec
status: experimental
description: Detects process or registry activity patterns associated with Windows Remote Management (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2025/06/25
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'bulk_pattern_1241'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving windows remote management
  - Security tools, monitoring agents, and authorized assessments
level: medium
