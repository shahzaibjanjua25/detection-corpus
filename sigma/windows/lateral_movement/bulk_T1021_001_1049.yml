title: Remote Desktop Protocol Suspicious Activity Pattern 1049
id: 835e34a3-fbae-4320-7d15-5b5b97cc2822
status: experimental
description: Detects process or registry activity patterns associated with Remote Desktop Protocol (T1021.001).
references:
  - https://attack.mitre.org/techniques/T1021/001/
author: DetectionForge
date: 2024/12/15
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'remote'
      - 'bulk_pattern_1049'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving remote desktop protocol
  - Security tools, monitoring agents, and authorized assessments
level: medium
