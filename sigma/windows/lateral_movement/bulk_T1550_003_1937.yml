title: Pass the Ticket Suspicious Activity Pattern 1937
id: fcc67ce2-4f98-4fb5-80ee-d17d8aecaaa4
status: experimental
description: Detects process or registry activity patterns associated with Pass the Ticket (T1550.003).
references:
  - https://attack.mitre.org/techniques/T1550/003/
author: DetectionForge
date: 2025/06/21
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1550.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'pass'
      - 'bulk_pattern_1937'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving pass the ticket
  - Security tools, monitoring agents, and authorized assessments
level: medium
