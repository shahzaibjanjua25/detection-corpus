title: WMI Activity Indicator 3117
id: a32d3d3e-f505-49e6-a030-2e5cd50f2c0b
status: experimental
description: Detects activity patterns associated with WMI (T1047).
references:
  - https://attack.mitre.org/techniques/T1047/
author: DetectionForge
date: 2024/05/28
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'wmi'
      - 'fast_3117'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving wmi
  - Security tools and monitoring agents
level: medium
