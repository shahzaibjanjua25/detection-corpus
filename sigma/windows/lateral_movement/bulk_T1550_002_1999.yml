title: Pass the Hash Suspicious Activity Pattern 1999
id: 1384127f-b28d-47af-2a95-fc6b9d5e86d9
status: experimental
description: Detects process or registry activity patterns associated with Pass the Hash (T1550.002).
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: DetectionForge
date: 2025/08/22
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1550.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'pass'
      - 'bulk_pattern_1999'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving pass the hash
  - Security tools, monitoring agents, and authorized assessments
level: medium
