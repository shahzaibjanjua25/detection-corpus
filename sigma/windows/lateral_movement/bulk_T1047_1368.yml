title: Windows Management Instrumentation Suspicious Activity Pattern 1368
id: ba18b0a8-4201-49b4-eeff-4c98c8632392
status: experimental
description: Detects process or registry activity patterns associated with Windows Management Instrumentation (T1047).
references:
  - https://attack.mitre.org/techniques/T1047/
author: DetectionForge
date: 2025/10/30
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'bulk_pattern_1368'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving windows management instrumentation
  - Security tools, monitoring agents, and authorized assessments
level: medium
