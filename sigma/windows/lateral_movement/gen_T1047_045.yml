title: Suspicious Windows Management Instrumentation Activity Indicator 045
id: efb9c441-89b8-96e8-4b3a-b56d2f9f6341
status: experimental
description: Detects process or activity patterns associated with Windows Management Instrumentation (T1047).
references:
  - https://attack.mitre.org/techniques/T1047/
author: DetectionForge
date: 2024/06/08
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'suspicious_pattern_45'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving windows management instrumentation
  - Security tools and monitoring agents performing similar actions
level: medium
