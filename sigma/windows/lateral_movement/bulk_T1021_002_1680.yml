title: SMB Windows Admin Shares Suspicious Activity Pattern 1680
id: 77512461-83bc-41a8-cff5-f323d9ea13a9
status: experimental
description: Detects process or registry activity patterns associated with SMB Windows Admin Shares (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2024/10/07
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'bulk_pattern_1680'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving smb windows admin shares
  - Security tools, monitoring agents, and authorized assessments
level: medium
