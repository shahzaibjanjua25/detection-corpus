title: SMB Windows Admin Shares Suspicious Activity Pattern 2058
id: 4bec7bac-c2ac-4309-ea54-b24cd16fa1d3
status: experimental
description: Detects process or registry activity patterns associated with SMB Windows Admin Shares (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2025/10/20
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'bulk_pattern_2058'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving smb windows admin shares
  - Security tools, monitoring agents, and authorized assessments
level: medium
