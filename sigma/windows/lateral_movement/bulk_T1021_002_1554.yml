title: SMB Windows Admin Shares Suspicious Activity Pattern 1554
id: c047f392-f9b5-4b2e-8e9d-f7098738d733
status: experimental
description: Detects process or registry activity patterns associated with SMB Windows Admin Shares (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2024/06/03
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'bulk_pattern_1554'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving smb windows admin shares
  - Security tools, monitoring agents, and authorized assessments
level: medium
