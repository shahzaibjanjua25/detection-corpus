title: SMB Indicator 7237
id: a4ac2407-ca0f-406e-a5be-d5ce7653e850
status: experimental
description: Detects patterns associated with SMB (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2024/05/08
modified: 2025/09/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'z_7237'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for smb
  - Security and monitoring tools
level: medium
