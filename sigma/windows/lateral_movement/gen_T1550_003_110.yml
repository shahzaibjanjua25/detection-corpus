title: Suspicious Pass the Ticket Activity Indicator 110
id: 2dd1ea64-aa2d-99f5-4a83-4a9bb6aa1999
status: experimental
description: Detects process or activity patterns associated with Pass the Ticket (T1550.003).
references:
  - https://attack.mitre.org/techniques/T1550/003/
author: DetectionForge
date: 2024/08/12
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1550.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'pass'
      - 'suspicious_pattern_110'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving pass the ticket
  - Security tools and monitoring agents performing similar actions
level: medium
