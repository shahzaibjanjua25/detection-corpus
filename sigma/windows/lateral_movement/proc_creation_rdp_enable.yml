title: RDP Enable via Registry or Command
id: d4b4980a-8661-754e-ffd7-33b2a4b72b3e
status: stable
description: Detects attempts to enable Remote Desktop via command line
references:
  - https://attack.mitre.org/techniques/T1021/001/
author: DetectionForge
date: 2024/03/02
modified: 2025/03/01
tags:
  - attack.lateral-movement
  - attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'fDenyTSConnections'
      - '0'
      - 'TermService'
      - 'reg add'
  condition: selection
falsepositives:
  - Administrators enabling RDP for support
  - Golden image preparation
level: medium
