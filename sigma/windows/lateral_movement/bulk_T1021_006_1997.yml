title: Windows Remote Management Suspicious Activity Pattern 1997
id: 24dfab49-b821-4666-8f1c-8f225e2a2903
status: experimental
description: Detects process or registry activity patterns associated with Windows Remote Management (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2025/08/20
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'bulk_pattern_1997'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving windows remote management
  - Security tools, monitoring agents, and authorized assessments
level: medium
