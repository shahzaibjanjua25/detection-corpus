title: Suspicious Windows Management Instrumentation Activity Indicator 171
id: f2a2966f-2f56-c0c7-900a-cd0a774b0ae7
status: experimental
description: Detects process or activity patterns associated with Windows Management Instrumentation (T1047).
references:
  - https://attack.mitre.org/techniques/T1047/
author: DetectionForge
date: 2024/10/12
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'suspicious_pattern_171'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving windows management instrumentation
  - Security tools and monitoring agents performing similar actions
level: medium
