title: SMB Windows Admin Shares Suspicious Activity Pattern 1365
id: 73158c8f-272c-4dfc-8939-e3ab41c19e93
status: experimental
description: Detects process or registry activity patterns associated with SMB Windows Admin Shares (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2025/10/27
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'bulk_pattern_1365'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving smb windows admin shares
  - Security tools, monitoring agents, and authorized assessments
level: medium
