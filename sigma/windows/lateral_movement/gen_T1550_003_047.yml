title: Suspicious Pass the Ticket Activity Indicator 047
id: 0478cb67-8e74-5e19-cd40-5bb4f6b9f7bf
status: experimental
description: Detects process or activity patterns associated with Pass the Ticket (T1550.003).
references:
  - https://attack.mitre.org/techniques/T1550/003/
author: DetectionForge
date: 2024/06/10
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1550.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'pass'
      - 'suspicious_pattern_47'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving pass the ticket
  - Security tools and monitoring agents performing similar actions
level: medium
