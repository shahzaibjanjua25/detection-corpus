title: WinRM Activity Indicator 3391
id: a917bb8f-db1b-4e40-a5bb-12402070f269
status: experimental
description: Detects activity patterns associated with WinRM (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2025/02/26
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'winrm'
      - 'fast_3391'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving winrm
  - Security tools and monitoring agents
level: medium
