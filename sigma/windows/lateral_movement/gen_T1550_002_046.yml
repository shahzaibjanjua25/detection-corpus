title: Suspicious Pass the Hash Activity Indicator 046
id: 97e02433-756a-41da-6734-6cc4767eeab8
status: experimental
description: Detects process or activity patterns associated with Pass the Hash (T1550.002).
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: DetectionForge
date: 2024/06/09
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1550.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'pass'
      - 'suspicious_pattern_46'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving pass the hash
  - Security tools and monitoring agents performing similar actions
level: medium
