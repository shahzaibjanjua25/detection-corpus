title: Suspicious Remote Desktop Protocol Activity Indicator 041
id: 011bb9e1-8ac9-b420-6610-d387522566ed
status: experimental
description: Detects process or activity patterns associated with Remote Desktop Protocol (T1021.001).
references:
  - https://attack.mitre.org/techniques/T1021/001/
author: DetectionForge
date: 2024/06/04
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'remote'
      - 'suspicious_pattern_41'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving remote desktop protocol
  - Security tools and monitoring agents performing similar actions
level: medium
