title: WinRM Activity Indicator 3366
id: e2f8254d-c0e2-4fb3-af5a-a430069ef85f
status: experimental
description: Detects activity patterns associated with WinRM (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2025/02/01
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'winrm'
      - 'fast_3366'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving winrm
  - Security tools and monitoring agents
level: medium
