title: Distributed Component Object Model Suspicious Activity Pattern 2122
id: 831a4c9a-8fb8-48dd-d847-87930ec413cf
status: experimental
description: Detects process or registry activity patterns associated with Distributed Component Object Model (T1021.003).
references:
  - https://attack.mitre.org/techniques/T1021/003/
author: DetectionForge
date: 2024/01/23
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'distributed'
      - 'bulk_pattern_2122'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving distributed component object model
  - Security tools, monitoring agents, and authorized assessments
level: medium
