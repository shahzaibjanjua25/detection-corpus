title: Suspicious Remote Desktop Protocol Activity Indicator 167
id: 21eba934-07e3-47ab-3814-b4c5735e9bd9
status: experimental
description: Detects process or activity patterns associated with Remote Desktop Protocol (T1021.001).
references:
  - https://attack.mitre.org/techniques/T1021/001/
author: DetectionForge
date: 2024/10/08
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'remote'
      - 'suspicious_pattern_167'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving remote desktop protocol
  - Security tools and monitoring agents performing similar actions
level: medium
