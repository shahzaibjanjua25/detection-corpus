title: Detection Pattern for SMB Activity 201
id: 143519c4-2698-2ec9-42bc-c4fe7ab3402e
status: experimental
description: Detects activity patterns associated with SMB (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2024/12/19
modified: 2025/05/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'pattern_201'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate software and administrative tools using similar command patterns
  - Security products and monitoring agents
level: medium
