title: Suspicious Windows Remote Management Activity Indicator 170
id: e984b125-dcda-b5c8-8c23-585c50266412
status: experimental
description: Detects process or activity patterns associated with Windows Remote Management (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2024/10/11
modified: 2025/04/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'suspicious_pattern_170'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving windows remote management
  - Security tools and monitoring agents performing similar actions
level: medium
