title: Remote Desktop Protocol Suspicious Activity Pattern 1994
id: 0da5bf4a-97f5-48ab-dd8b-6c24dd90adb8
status: experimental
description: Detects process or registry activity patterns associated with Remote Desktop Protocol (T1021.001).
references:
  - https://attack.mitre.org/techniques/T1021/001/
author: DetectionForge
date: 2025/08/17
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'remote'
      - 'bulk_pattern_1994'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving remote desktop protocol
  - Security tools, monitoring agents, and authorized assessments
level: medium
