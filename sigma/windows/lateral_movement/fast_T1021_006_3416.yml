title: WinRM Activity Indicator 3416
id: ea0bbe42-f927-47a9-a687-6917bb3a20a6
status: experimental
description: Detects activity patterns associated with WinRM (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2025/03/23
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'winrm'
      - 'fast_3416'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving winrm
  - Security tools and monitoring agents
level: medium
