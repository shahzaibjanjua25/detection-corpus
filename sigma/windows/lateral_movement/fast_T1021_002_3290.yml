title: SMB Activity Indicator 3290
id: 812c5628-485f-4e3d-a7a8-06f6b8c36c3b
status: experimental
description: Detects activity patterns associated with SMB (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2024/11/17
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'fast_3290'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving smb
  - Security tools and monitoring agents
level: medium
