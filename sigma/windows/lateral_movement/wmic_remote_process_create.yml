title: WMIC Remote Process Create
id: 0defa8e1-a08a-d946-b73d-1919d9b40a3a
status: stable
description: Detects wmic process call create against remote hosts
references:
  - https://attack.mitre.org/techniques/T1047/
author: DetectionForge
date: 2024/02/29
modified: 2025/03/01
tags:
  - attack.lateral-movement
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - '/node:'
      - 'process'
      - 'call'
      - 'create'
  condition: selection
falsepositives:
  - Legacy remote management scripts
  - Some monitoring agents
level: medium
