title: SMB Indicator 7227
id: 5c7b0c7e-ef4e-4819-a38f-46dc3650f9be
status: experimental
description: Detects patterns associated with SMB (T1021.002).
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: DetectionForge
date: 2024/04/28
modified: 2025/09/01
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'smb'
      - 'z_7227'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for smb
  - Security and monitoring tools
level: medium
