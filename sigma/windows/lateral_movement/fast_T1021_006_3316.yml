title: WinRM Activity Indicator 3316
id: 452ed136-5f47-4909-af5a-1925ddd181fe
status: experimental
description: Detects activity patterns associated with WinRM (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2024/12/13
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'winrm'
      - 'fast_3316'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving winrm
  - Security tools and monitoring agents
level: medium
