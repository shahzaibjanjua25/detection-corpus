title: WinRM Activity Indicator 3241
id: 4f62b334-8450-4565-a509-0e007160e538
status: experimental
description: Detects activity patterns associated with WinRM (T1021.006).
references:
  - https://attack.mitre.org/techniques/T1021/006/
author: DetectionForge
date: 2024/09/29
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'winrm'
      - 'fast_3241'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving winrm
  - Security tools and monitoring agents
level: medium
