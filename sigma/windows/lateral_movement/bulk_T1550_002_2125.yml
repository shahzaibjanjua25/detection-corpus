title: Pass the Hash Suspicious Activity Pattern 2125
id: 2da6cb5f-d664-43fb-c4d8-21d9c577087f
status: experimental
description: Detects process or registry activity patterns associated with Pass the Hash (T1550.002).
references:
  - https://attack.mitre.org/techniques/T1550/002/
author: DetectionForge
date: 2024/01/26
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1550.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'pass'
      - 'bulk_pattern_2125'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving pass the hash
  - Security tools, monitoring agents, and authorized assessments
level: medium
