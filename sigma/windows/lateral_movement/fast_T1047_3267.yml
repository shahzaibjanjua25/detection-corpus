title: WMI Activity Indicator 3267
id: a7a250db-b6eb-4880-a909-3926a9a8234e
status: experimental
description: Detects activity patterns associated with WMI (T1047).
references:
  - https://attack.mitre.org/techniques/T1047/
author: DetectionForge
date: 2024/10/25
modified: 2025/07/01
tags:
  - attack.lateral-movement
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'wmi'
      - 'fast_3267'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving wmi
  - Security tools and monitoring agents
level: medium
