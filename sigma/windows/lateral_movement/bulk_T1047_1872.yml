title: Windows Management Instrumentation Suspicious Activity Pattern 1872
id: b94e48dd-1312-4433-d9be-76a2b7c0384a
status: experimental
description: Detects process or registry activity patterns associated with Windows Management Instrumentation (T1047).
references:
  - https://attack.mitre.org/techniques/T1047/
author: DetectionForge
date: 2025/04/17
modified: 2025/06/01
tags:
  - attack.lateral-movement
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'windows'
      - 'bulk_pattern_1872'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving windows management instrumentation
  - Security tools, monitoring agents, and authorized assessments
level: medium
