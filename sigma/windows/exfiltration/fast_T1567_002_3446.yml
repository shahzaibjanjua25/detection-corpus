title: CloudExfil Activity Indicator 3446
id: be6b6733-7fb8-4a55-a622-32a10e7a3e96
status: experimental
description: Detects activity patterns associated with CloudExfil (T1567.002).
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: DetectionForge
date: 2025/04/22
modified: 2025/07/01
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cloudexfil'
      - 'fast_3446'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving cloudexfil
  - Security tools and monitoring agents
level: medium
