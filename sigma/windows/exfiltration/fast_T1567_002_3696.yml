title: CloudExfil Activity Indicator 3696
id: df24b674-7c92-4c69-a643-d04325a75a79
status: experimental
description: Detects activity patterns associated with CloudExfil (T1567.002).
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: DetectionForge
date: 2024/05/07
modified: 2025/07/01
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cloudexfil'
      - 'fast_3696'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving cloudexfil
  - Security tools and monitoring agents
level: medium
