title: Rclone Cloud Exfiltration Tool
id: 77a25371-4a5a-5e72-34c8-e8f745ba412d
status: stable
description: Detects rclone usage which is frequently abused for cloud exfiltration
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: DetectionForge
date: 2024/03/09
modified: 2025/03/01
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\rclone.exe'
    CommandLine|contains:
      - 'copy'
      - 'sync'
      - 'to'
      - 'gdrive'
      - 's3'
      - 'mega'
  condition: selection
falsepositives:
  - Legitimate cloud sync by power users
  - Backup solutions using rclone
level: medium
