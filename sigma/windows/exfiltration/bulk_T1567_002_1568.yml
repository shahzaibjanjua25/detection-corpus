title: Exfiltration to Cloud Storage Suspicious Activity Pattern 1568
id: cb71c53e-13d8-4061-8171-4f07e1e3ae51
status: experimental
description: Detects process or registry activity patterns associated with Exfiltration to Cloud Storage (T1567.002).
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: DetectionForge
date: 2024/06/17
modified: 2025/06/01
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfiltration'
      - 'bulk_pattern_1568'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving exfiltration to cloud storage
  - Security tools, monitoring agents, and authorized assessments
level: medium
