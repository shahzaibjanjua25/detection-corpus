title: Suspicious Exfiltration Over C2 Channel Activity Indicator 054
id: acd99e3a-b270-2d2b-c440-07659fdab375
status: experimental
description: Detects process or activity patterns associated with Exfiltration Over C2 Channel (T1041).
references:
  - https://attack.mitre.org/techniques/T1041/
author: DetectionForge
date: 2024/06/17
modified: 2025/04/01
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfiltration'
      - 'suspicious_pattern_54'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving exfiltration over c2 channel
  - Security tools and monitoring agents performing similar actions
level: medium
