title: Exfil Pattern 5098
id: f0175a4b-b0d9-4f57-ac5d-333a92914741
status: experimental
description: Detects patterns associated with Exfil (T1041).
references:
  - https://attack.mitre.org/techniques/T1041/
author: DetectionForge
date: 2024/06/07
modified: 2025/08/01
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfil'
      - 'x_5098'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for exfil
  - Security and monitoring tools
level: medium
