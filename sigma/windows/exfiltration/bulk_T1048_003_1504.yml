title: Exfiltration Over Unencrypted Protocol Suspicious Activity Pattern 1504
id: bd5eb5af-9921-4d39-8d57-65d8fee428f5
status: experimental
description: Detects process or registry activity patterns associated with Exfiltration Over Unencrypted Protocol (T1048.003).
references:
  - https://attack.mitre.org/techniques/T1048/003/
author: DetectionForge
date: 2024/04/14
modified: 2025/06/01
tags:
  - attack.exfiltration
  - attack.t1048.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfiltration'
      - 'bulk_pattern_1504'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving exfiltration over unencrypted protocol
  - Security tools, monitoring agents, and authorized assessments
level: medium
