title: Exfil Pattern 5086
id: 832abb19-a39c-4e4c-a0bd-c01d79189a31
status: experimental
description: Detects patterns associated with Exfil (T1041).
references:
  - https://attack.mitre.org/techniques/T1041/
author: DetectionForge
date: 2024/05/26
modified: 2025/08/01
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfil'
      - 'x_5086'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for exfil
  - Security and monitoring tools
level: medium
