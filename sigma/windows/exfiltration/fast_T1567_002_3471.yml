title: CloudExfil Activity Indicator 3471
id: 80b51cf9-911a-44f7-ae3e-9bb705cd2f4d
status: experimental
description: Detects activity patterns associated with CloudExfil (T1567.002).
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: DetectionForge
date: 2025/05/17
modified: 2025/07/01
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cloudexfil'
      - 'fast_3471'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving cloudexfil
  - Security tools and monitoring agents
level: medium
