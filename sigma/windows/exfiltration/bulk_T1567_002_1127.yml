title: Exfiltration to Cloud Storage Suspicious Activity Pattern 1127
id: 625663c0-b09f-4fd4-4ae5-e7d3b19fcae4
status: experimental
description: Detects process or registry activity patterns associated with Exfiltration to Cloud Storage (T1567.002).
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: DetectionForge
date: 2025/03/03
modified: 2025/06/01
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfiltration'
      - 'bulk_pattern_1127'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving exfiltration to cloud storage
  - Security tools, monitoring agents, and authorized assessments
level: medium
