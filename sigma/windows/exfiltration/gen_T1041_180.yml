title: Suspicious Exfiltration Over C2 Channel Activity Indicator 180
id: 14b61b32-177c-7264-420f-c95a61198d02
status: experimental
description: Detects process or activity patterns associated with Exfiltration Over C2 Channel (T1041).
references:
  - https://attack.mitre.org/techniques/T1041/
author: DetectionForge
date: 2024/10/21
modified: 2025/04/01
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfiltration'
      - 'suspicious_pattern_180'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving exfiltration over c2 channel
  - Security tools and monitoring agents performing similar actions
level: medium
