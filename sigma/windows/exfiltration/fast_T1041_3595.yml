title: ExfilC2 Activity Indicator 3595
id: 2352cdce-67d3-4adf-ab0c-740f6fc9728e
status: experimental
description: Detects activity patterns associated with ExfilC2 (T1041).
references:
  - https://attack.mitre.org/techniques/T1041/
author: DetectionForge
date: 2025/09/18
modified: 2025/07/01
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfilc2'
      - 'fast_3595'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving exfilc2
  - Security tools and monitoring agents
level: medium
