title: Exfil Indicator 7058
id: c6dd78f9-cd96-43c9-a3c6-cffb5ac317e0
status: experimental
description: Detects patterns associated with Exfil (T1041).
references:
  - https://attack.mitre.org/techniques/T1041/
author: DetectionForge
date: 2024/12/15
modified: 2025/09/01
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfil'
      - 'z_7058'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for exfil
  - Security and monitoring tools
level: medium
