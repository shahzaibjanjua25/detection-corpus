title: Exfil Indicator 7018
id: 011d81f6-0a84-4f6d-a5a8-55939bdf4c60
status: experimental
description: Detects patterns associated with Exfil (T1041).
references:
  - https://attack.mitre.org/techniques/T1041/
author: DetectionForge
date: 2024/11/05
modified: 2025/09/01
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfil'
      - 'z_7018'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for exfil
  - Security and monitoring tools
level: medium
