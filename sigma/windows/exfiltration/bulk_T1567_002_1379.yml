title: Exfiltration to Cloud Storage Suspicious Activity Pattern 1379
id: eb57b1aa-a2de-42d2-271c-582298c08113
status: experimental
description: Detects process or registry activity patterns associated with Exfiltration to Cloud Storage (T1567.002).
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: DetectionForge
date: 2025/11/10
modified: 2025/06/01
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfiltration'
      - 'bulk_pattern_1379'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving exfiltration to cloud storage
  - Security tools, monitoring agents, and authorized assessments
level: medium
