title: Exfiltration to Cloud Storage Suspicious Activity Pattern 1946
id: 6f134df0-15f2-4b94-04a0-b89a57e4367f
status: experimental
description: Detects process or registry activity patterns associated with Exfiltration to Cloud Storage (T1567.002).
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: DetectionForge
date: 2025/06/30
modified: 2025/06/01
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfiltration'
      - 'bulk_pattern_1946'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving exfiltration to cloud storage
  - Security tools, monitoring agents, and authorized assessments
level: medium
