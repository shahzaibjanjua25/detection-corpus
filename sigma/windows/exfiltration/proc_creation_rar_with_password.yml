title: Archive Creation with Password (Potential Staging)
id: d8e9f0a1-b2c3-4567-1234-678901234567
status: test
description: Detects creation of password-protected archives using common tools, often observed during data staging before exfiltration.
references:
  - https://attack.mitre.org/techniques/T1560/001/
author: DetectionForge
date: 2024/10/05
modified: 2025/02/12
tags:
  - attack.collection
  - attack.exfiltration
  - attack.t1560.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\rar.exe'
      - '\7z.exe'
      - '\7za.exe'
    CommandLine|contains:
      - '-p'
      - '-hp'
  condition: selection
falsepositives:
  - Users who routinely create encrypted archives for legitimate data protection
  - Backup scripts that password-protect archives
level: medium
