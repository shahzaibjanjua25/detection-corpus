title: Exfiltration Over Unencrypted Protocol Suspicious Activity Pattern 1567
id: 20ec2748-db7d-4fed-ddcf-129556063134
status: experimental
description: Detects process or registry activity patterns associated with Exfiltration Over Unencrypted Protocol (T1048.003).
references:
  - https://attack.mitre.org/techniques/T1048/003/
author: DetectionForge
date: 2024/06/16
modified: 2025/06/01
tags:
  - attack.exfiltration
  - attack.t1048.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfiltration'
      - 'bulk_pattern_1567'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving exfiltration over unencrypted protocol
  - Security tools, monitoring agents, and authorized assessments
level: medium
