title: Exfiltration Over C2 Channel Suspicious Activity Pattern 1377
id: 39df42a4-a7ab-4df8-51ef-cb41c846c3ce
status: experimental
description: Detects process or registry activity patterns associated with Exfiltration Over C2 Channel (T1041).
references:
  - https://attack.mitre.org/techniques/T1041/
author: DetectionForge
date: 2025/11/08
modified: 2025/06/01
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfiltration'
      - 'bulk_pattern_1377'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving exfiltration over c2 channel
  - Security tools, monitoring agents, and authorized assessments
level: medium
