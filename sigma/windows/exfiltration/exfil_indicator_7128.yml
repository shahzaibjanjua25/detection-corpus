title: Exfil Indicator 7128
id: efa0092a-b2ba-42de-aea8-d6868567287e
status: experimental
description: Detects patterns associated with Exfil (T1041).
references:
  - https://attack.mitre.org/techniques/T1041/
author: DetectionForge
date: 2025/02/23
modified: 2025/09/01
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfil'
      - 'z_7128'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate admin/software activity for exfil
  - Security and monitoring tools
level: medium
