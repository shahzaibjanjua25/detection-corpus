title: CloudExfil Activity Indicator 3021
id: 2c2b0f97-b56e-4079-ac4d-b5cf1de5c415
status: experimental
description: Detects activity patterns associated with CloudExfil (T1567.002).
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: DetectionForge
date: 2024/02/22
modified: 2025/07/01
tags:
  - attack.exfiltration
  - attack.t1567.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'cloudexfil'
      - 'fast_3021'
  filter_main:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  condition: selection and not filter_main
falsepositives:
  - Legitimate administrative or software activity involving cloudexfil
  - Security tools and monitoring agents
level: medium
