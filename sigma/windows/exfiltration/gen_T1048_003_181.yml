title: Suspicious Exfiltration Over Unencrypted Protocol Activity Indicator 181
id: f9fe3b72-1ba8-5dd6-5411-63f7df04c060
status: experimental
description: Detects process or activity patterns associated with Exfiltration Over Unencrypted Protocol (T1048.003).
references:
  - https://attack.mitre.org/techniques/T1048/003/
author: DetectionForge
date: 2024/10/22
modified: 2025/04/01
tags:
  - attack.exfiltration
  - attack.t1048.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'exfiltration'
      - 'suspicious_pattern_181'
  filter_legitimate:
    ParentImage|endswith:
      - '\explorer.exe'
      - '\services.exe'
  condition: selection and not filter_legitimate
falsepositives:
  - Legitimate administrative or software activity involving exfiltration over unencrypted protocol
  - Security tools and monitoring agents performing similar actions
level: medium
