title: UAC Bypass via Sdclt
id: de1792c0-8bba-988d-2ca1-573c8e19e65d
status: stable
description: Detects sdclt.exe used in UAC bypass techniques
references:
  - https://attack.mitre.org/techniques/T1548/002/
author: DetectionForge
date: 2024/02/10
modified: 2025/03/01
tags:
  - attack.privilege-escalation
  - attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\sdclt.exe'
    CommandLine|contains:
      - '/kickoffelev'
      - 'isolatedCommand'
  condition: selection
falsepositives:
  - Legitimate backup/restore UI usage
  - Rare
level: high
