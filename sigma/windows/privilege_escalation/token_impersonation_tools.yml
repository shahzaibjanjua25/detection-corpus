title: Token Impersonation Tools
id: 8810c858-40b7-be47-a657-d36d65fd48c5
status: stable
description: Detects tools commonly used for token theft and impersonation
references:
  - https://attack.mitre.org/techniques/T1134/001/
author: DetectionForge
date: 2024/02/11
modified: 2025/03/01
tags:
  - attack.privilege-escalation
  - attack.t1134.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'incognito'
      - 'token::'
      - 'ImpersonateLoggedOnUser'
      - 'SharpRDP'
  condition: selection
falsepositives:
  - Authorized red team
  - DFIR token analysis
level: high
