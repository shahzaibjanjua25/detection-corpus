title: UAC Bypass via Eventvwr
id: c1ba9c42-c783-72bd-81b5-69933080c1f0
status: stable
description: Detects eventvwr.exe UAC bypass via msc file association hijack
references:
  - https://attack.mitre.org/techniques/T1548/002/
author: DetectionForge
date: 2024/02/09
modified: 2025/03/01
tags:
  - attack.privilege-escalation
  - attack.t1548.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\eventvwr.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\wscript.exe'
  condition: selection
falsepositives:
  - Extremely rare legitimate chaining
  - Custom MSC snap-ins
level: high
