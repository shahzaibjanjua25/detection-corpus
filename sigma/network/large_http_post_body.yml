title: Large HTTP POST Body
id: 60dd26cb-fb8f-6269-a57a-7300f7fdd342
status: test
description: Detects unusually large HTTP POST requests that may indicate data exfiltration
references:
  - https://attack.mitre.org/techniques/T1041/
author: DetectionForge
date: 2024/11/11
modified: 2025/03/20
tags:
  - attack.exfiltration
  - attack.t1041
logsource:
  category: proxy
  product: any
detection:
  selection:
    cs-method: 'POST'
    cs-bytes|gt: '1000000'
  condition: selection
falsepositives:
  - File upload features in business applications
  - Backup agents
level: medium
